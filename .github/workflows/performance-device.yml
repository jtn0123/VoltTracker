name: Device performance benchmark

on:
  # Manual-dispatch only: meaningful startup/tab benchmarks need a real device
  # (or a self-hosted runner with adb), so we don't run this unattended.
  workflow_dispatch:
    inputs:
      adb_serial:
        description: 'Optional adb serial or wireless debugging endpoint available to this runner'
        required: false
        type: string

permissions:
  contents: read

jobs:
  startup-and-tabs:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: mobile/android
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5.6.0
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: mobile/android/dashboard-tests/package-lock.json
      - name: Run optional Macrobenchmark startup lane
        env:
          ANDROID_SERIAL: ${{ inputs.adb_serial }}
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon verifyStartupPerformanceOptional --no-configuration-cache
      - name: Run no-install startup/tab scripts when a serial was supplied
        if: inputs.adb_serial != ''
        env:
          VOLTTRACKER_ADB_SERIAL: ${{ inputs.adb_serial }}
        run: bash tools/perf-local.sh --device "$VOLTTRACKER_ADB_SERIAL"
      - name: Upload performance benchmark reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: device-performance-benchmark
          path: |
            mobile/android/build/reports/startup-benchmark-local/
            mobile/android/build/reports/adb-startup-benchmark/
            mobile/android/build/reports/adb-tab-benchmark/
            mobile/android/build/reports/perf-local/
            mobile/android/build/reports/performance-trends/
          if-no-files-found: warn
