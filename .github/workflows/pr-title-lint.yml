name: PR Title Lint

# Enforces Conventional Commits on PR titles. This repo squash-merges, so the
# PR title becomes the commit subject on main, which is what
# python-semantic-release parses to decide whether to bump the version (see
# .github/workflows/release.yml). A title that doesn't start with `feat:`,
# `fix:`, `perf:` (or carry a `BREAKING CHANGE:` footer in the body) won't cut
# a release — this lint surfaces that intent at PR time, before merge.

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions:
  pull-requests: read

jobs:
  lint:
    name: Validate PR title
    runs-on: ubuntu-latest
    steps:
      - name: Check title matches Conventional Commits
        uses: amannn/action-semantic-pull-request@0723387faaf9b38adef4775cd42cfd5155ed6017 # v5.5.3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          # Keep the allowed types in sync with pyproject.toml's
          # [tool.semantic_release.commit_parser_options].allowed_tags.
          types: |
            feat
            fix
            perf
            refactor
            docs
            style
            test
            build
            ci
            chore
            revert
          requireScope: false
          subjectPattern: ^[^A-Z].+$
          subjectPatternError: |
            The PR title subject "{subject}" should start with a lowercase
            letter (after the `type(scope):` prefix). Example:
              feat(dashboard): add per-build version chip
