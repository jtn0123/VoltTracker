name: SonarQube

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  sonarqube:
    if: github.event_name == 'push' || github.event.pull_request.head.repo.fork == false
    runs-on: [self-hosted, sonar]
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Python coverage
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Python dependencies
        run: pip install -r receiver/requirements-dev.txt
      - name: Run Python tests with coverage
        run: pytest tests/ --cov=receiver --cov-branch --cov-report=xml:coverage.xml

      # TypeScript frontend coverage
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install frontend dependencies
        run: npm ci
        working-directory: receiver/frontend
      - name: Run frontend tests with coverage
        run: npm run test:coverage
        working-directory: receiver/frontend

      # E2E coverage (requires Docker services — run locally for now)
      # To collect E2E coverage locally:
      #   INSTRUMENT_COVERAGE=true npm run build --prefix receiver/frontend
      #   docker compose up -d  # start backend
      #   cd e2e && npm run test:coverage
      # The lcov output at e2e/coverage/lcov.info is picked up by SonarQube automatically.

      - uses: sonarsource/sonarqube-scan-action@v5
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
