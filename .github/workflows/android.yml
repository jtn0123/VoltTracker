name: Android unit tests

on:
  push:
    paths:
      - 'mobile/android/**'
      - '.github/workflows/android.yml'
  pull_request:
    paths:
      - 'mobile/android/**'
      - '.github/workflows/android.yml'

permissions:
  contents: read

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile/android
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9 # v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Run unit tests
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon :app:testDebugUnitTest
      - name: Spotless check
        run: ./gradlew --no-daemon :app:spotlessCheck
      - name: Android Lint
        run: ./gradlew --no-daemon :app:lintDebug
      - name: JaCoCo coverage report
        run: ./gradlew --no-daemon :app:jacocoTestReport
      - name: Verify coverage thresholds
        run: ./gradlew --no-daemon :app:jacocoTestCoverageVerification
      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: coverage-report
          path: mobile/android/app/build/reports/jacoco/jacocoTestReport/
          if-no-files-found: ignore
      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: unit-test-report
          path: mobile/android/app/build/reports/tests/
          if-no-files-found: ignore

  dashboard-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile/android/dashboard-tests
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@0a44ba7841725637a19e28fa30b79a866c81b0a6 # v4.0.4
        with:
          node-version: '20'
      - name: Install dashboard test deps
        run: npm ci
      - name: Run dashboard JS smoke tests
        run: npm test
