name: Android unit tests

# The push trigger is limited to main so python-semantic-release's version-bump
# commits (which only touch VERSION and pyproject.toml) still rebuild the
# rolling latest-debug APK with the new versionName baked in, while PR branches
# rely on the pull_request trigger below instead of running this slow workflow
# twice for the same commit.
on:
  push:
    branches: [main]
    paths:
      - 'mobile/android/**'
      - '.github/workflows/android.yml'
      - 'VERSION'
      - 'pyproject.toml'
  pull_request:
    paths:
      - 'mobile/android/**'
      - '.github/workflows/android.yml'
  workflow_dispatch:

# Keep only the newest run for a PR branch or main push. PR branch pushes no
# longer trigger this workflow directly, so canceling superseded runs now removes
# stale slow jobs instead of leaving duplicate checks behind.
#
# Deliberate choice — do not switch back to queueing. PR #210 briefly grouped
# runs by commit SHA with cancel-in-progress: false so the duplicate push+PR
# runs of the same commit queued instead of leaving a cancelled run's checks
# red. PR #235 then fixed the root cause instead: the push trigger above is
# limited to main, so a PR commit only ever starts one run and there is no
# same-SHA twin left to protect. With duplicates gone, a cancelled run here is
# always one that a newer run of the same ref supersedes, so cancelling is
# strictly cheaper than queueing.
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  # Needed by dorny/paths-filter to inspect pull-request file changes.
  pull-requests: read

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      emulator_smoke: ${{ steps.filter.outputs.emulator_smoke }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Detect paths that need WebView runtime smoke
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        with:
          filters: |
            emulator_smoke:
              - '.github/workflows/android.yml'
              - 'mobile/android/build.gradle'
              - 'mobile/android/settings.gradle'
              - 'mobile/android/gradle.properties'
              - 'mobile/android/gradle/**'
              - 'mobile/android/app/build.gradle'
              # Covers the dashboard TypeScript/CSS sources (app/src/main/dashboard-src)
              # whose bundle the WebView handshake executes.
              - 'mobile/android/app/src/main/**'
              - 'mobile/android/app/src/androidTest/**'
              # The esbuild toolchain (build.mjs, pinned esbuild/leaflet deps) lives in
              # dashboard-tests and shapes the shipped JS bundle just as much as the
              # sources do, so toolchain changes must also exercise the WebView runtime
              # smoke — the handshake depends on the built bundle.
              - 'mobile/android/dashboard-tests/**'
              - 'mobile/android/scripts/emulator-smoke.sh'

  unit-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile/android
    steps:
      - name: Record job start time
        # Runs before checkout, so the default working-directory does not exist yet.
        working-directory: ${{ github.workspace }}
        run: echo "JOB_STARTED_AT=$(date +%s)" >> "$GITHUB_ENV"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
      - uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: temurin
          java-version: '21'
          cache: 'gradle'
      # Node is needed because preBuild runs buildDashboardJs (esbuild bundles the
      # dashboard source in dashboard-src/js into the shipped assets/dashboard/js).
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: mobile/android/dashboard-tests/package-lock.json
      - name: Run unit tests
        # CI keeps the same checks as verifyActiveApp split into separate steps
        # so failures point at the exact lane and artifact uploads still run.
        # Keep this list in sync with mobile/android/build.gradle:verifyActiveApp.
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon --configuration-cache :app:testDebugUnitTest
      - name: Summarize unit test results
        if: always()
        run: |
          python3 - <<'PY'
          import glob
          import os
          import xml.etree.ElementTree as ET
          from collections import defaultdict

          summary = os.environ.get("GITHUB_STEP_SUMMARY")
          if not summary:
              raise SystemExit(0)
          paths = glob.glob("app/build/test-results/testDebugUnitTest/TEST-*.xml")
          tests = failures = skipped = 0
          slow = []
          # The test-retry plugin (app/build.gradle: maxRetries=1,
          # failOnPassedAfterRetry=false) lets a test that fails once but passes on
          # retry pass the build. Gradle's default XML reporting (mergeReruns off)
          # writes each execution as its own <testcase>, so such a flake shows up
          # once with a <failure> and once clean. Group executions per test name to
          # tell hard failures (never passed) from passed-on-retry flakes, and
          # surface the flakes here so retries can't silently mask flaky tests.
          executions = defaultdict(lambda: {"failed": 0, "passed": 0})
          for path in paths:
              root = ET.parse(path).getroot()
              tests += int(root.attrib.get("tests", "0"))
              failures += int(root.attrib.get("failures", "0")) + int(root.attrib.get("errors", "0"))
              skipped += int(root.attrib.get("skipped", "0"))
              for case in root.findall("testcase"):
                  name = f"{case.attrib.get('classname', '')}.{case.attrib.get('name', '')}".strip(".")
                  elapsed = float(case.attrib.get("time", "0"))
                  if elapsed >= 0.5:
                      slow.append((elapsed, name))
                  if case.find("failure") is not None or case.find("error") is not None:
                      executions[name]["failed"] += 1
                  elif case.find("skipped") is None:
                      executions[name]["passed"] += 1

          failed_cases = sorted(name for name, runs in executions.items() if runs["failed"] and not runs["passed"])
          flaky_cases = sorted(name for name, runs in executions.items() if runs["failed"] and runs["passed"])

          def write_list(fh, lines, limit):
              for line in lines[:limit]:
                  fh.write(line)
              if len(lines) > limit:
                  fh.write(f"- ...and {len(lines) - limit} more\n")

          with open(summary, "a", encoding="utf-8") as fh:
              fh.write("\n### Android unit tests\n\n")
              fh.write(f"- Tests: {tests}\n- Failures/errors: {failures}\n- Skipped: {skipped}\n")
              if flaky_cases:
                  fh.write(f"- Passed only after retry (flaky): {len(flaky_cases)}\n")
              if failed_cases:
                  fh.write("\nFailed cases:\n")
                  write_list(fh, [f"- `{name}`\n" for name in failed_cases], 20)
              if flaky_cases:
                  fh.write("\nPassed only after retry (flaky — investigate, retries hide these from the build result):\n")
                  write_list(fh, [f"- `{name}`\n" for name in flaky_cases], 20)
              if slow:
                  fh.write("\nSlowest cases over 500 ms:\n")
                  slow_lines = [f"- `{name}` - {elapsed:.2f}s\n" for elapsed, name in sorted(slow, reverse=True)]
                  write_list(fh, slow_lines, 10)
          for name in flaky_cases:
              print(f"::warning title=Flaky unit test::{name} failed, then passed on retry")
          PY
      # Spotless/Detekt/Lint moved to the parallel `static-analysis` job: together
      # they had grown to ~2.5 min (Android Lint alone ~1.5 min) on this job's
      # critical path, which made unit-tests the slowest required lane. The split
      # trades one repeated checkout+JDK+Gradle setup (~1 min, paid in parallel)
      # for ~2.5 min off the PR wall-clock.
      - name: Assemble debug APK
        run: ./gradlew --no-daemon --configuration-cache :app:assembleDebug
      - name: Verify generated dashboard is committed
        run: ./gradlew --no-daemon --configuration-cache verifyGeneratedDashboardClean
      - name: Upload generated dashboard diff
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: generated-dashboard-html-diff
          path: mobile/android/build/reports/dashboard-html-diff/
          if-no-files-found: ignore
      - name: Verify dashboard bundle budget
        run: ./gradlew --no-daemon --configuration-cache verifyDashboardBundleSize
      - name: Publish performance trend snapshot
        if: always()
        # Measurement + grouping live in tools/dashboard_bundle_report.py, which reads the
        # budgets AND the chunk groupings from build.gradle. Re-declaring the groupings here
        # is how this step came to report -40294 bytes of lazy-support headroom against a
        # real +7496: it still charged the expert/detail chunks to the support allowance.
        run: python3 tools/dashboard_bundle_report.py snapshot
      - name: JaCoCo coverage report
        run: ./gradlew --no-daemon --configuration-cache :app:jacocoTestReport
      - name: Verify coverage thresholds
        run: ./gradlew --no-daemon --configuration-cache :app:jacocoTestCoverageVerification
      - name: Upload debug APK
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: volttracker-debug-apk
          path: mobile/android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: warn
      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-report
          path: mobile/android/app/build/reports/jacoco/jacocoTestReport/
          if-no-files-found: ignore
      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: unit-test-report
          path: mobile/android/app/build/reports/tests/
          if-no-files-found: ignore
      - name: Upload performance trend snapshot
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: performance-trend-snapshot
          path: mobile/android/build/reports/performance-trends/
          if-no-files-found: ignore
      - name: Report job wall-clock time
        if: always()
        working-directory: ${{ github.workspace }}
        run: |
          elapsed=$(( $(date +%s) - JOB_STARTED_AT ))
          echo "Job wall-clock: $((elapsed / 60))m $((elapsed % 60))s" >> "$GITHUB_STEP_SUMMARY"

  static-analysis:
    # Spotless (ktlint) + Detekt + Android Lint, split out of unit-tests so the
    # ~2.5 min of style/lint work runs in parallel with the test execution
    # instead of extending the slowest required lane. Node is still needed:
    # lintDebug compiles the app, and preBuild runs buildDashboardJs (esbuild).
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile/android
    steps:
      - name: Record job start time
        # Runs before checkout, so the default working-directory does not exist yet.
        working-directory: ${{ github.workspace }}
        run: echo "JOB_STARTED_AT=$(date +%s)" >> "$GITHUB_ENV"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
      - uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: temurin
          java-version: '21'
          cache: 'gradle'
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: mobile/android/dashboard-tests/package-lock.json
      - name: Spotless check
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon --configuration-cache :app:spotlessCheck
      - name: Detekt static analysis
        # Correctness-leaning Kotlin rules (ktlint covers formatting); config in app/detekt.yml.
        run: ./gradlew --no-daemon --configuration-cache :app:detekt
      - name: Android Lint
        run: ./gradlew --no-daemon --configuration-cache :app:lintDebug
      - name: Upload lint report
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: android-lint-report
          path: mobile/android/app/build/reports/lint-results-debug.html
          if-no-files-found: ignore
      - name: Report job wall-clock time
        if: always()
        working-directory: ${{ github.workspace }}
        run: |
          elapsed=$(( $(date +%s) - JOB_STARTED_AT ))
          echo "Job wall-clock: $((elapsed / 60))m $((elapsed % 60))s" >> "$GITHUB_STEP_SUMMARY"

  build-dashboard:
    # Single esbuild compile of the dashboard TypeScript into the shipped bundle
    # (gitignored assets/dashboard/js plus the regenerated lazy CSS and vendored
    # Leaflet assets). The three Node dashboard lanes (dashboard-tests,
    # dashboard-e2e, dashboard-visual) download this artifact instead of each
    # re-running npm ci + esbuild in dashboard-tests. The Gradle jobs are left
    # alone on purpose: their preBuild -> buildDashboardJs rebuild happens inside
    # Gradle (with its own up-to-date checks) and stays authoritative for the APK.
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile/android/dashboard-tests
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: mobile/android/dashboard-tests/package-lock.json
      - name: Install dashboard build deps
        run: npm ci
      - name: Build dashboard bundle
        run: npm run build
      - name: Upload dashboard bundle
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dashboard-bundle
          # Everything build.mjs writes (see buildDashboardJs outputs in
          # mobile/android/build.gradle): the gitignored js/ bundle plus the
          # regenerated minified lazy CSS and the vendored Leaflet tree.
          path: |
            mobile/android/app/src/main/assets/dashboard/js/
            mobile/android/app/src/main/assets/dashboard/css/screens-map.css
            mobile/android/app/src/main/assets/dashboard/css/troubleshooter.css
            mobile/android/app/src/main/assets/dashboard/lib/leaflet/
          if-no-files-found: error

  dashboard-tests:
    needs: [build-dashboard]
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile/android/dashboard-tests
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: mobile/android/dashboard-tests/package-lock.json
      - name: Download prebuilt dashboard bundle
        # Built once in build-dashboard; the bundle-size report below measures the
        # real shipped output. Lint/typecheck/tests read the source, not the bundle.
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dashboard-bundle
          path: mobile/android/app/src/main/assets/dashboard
      - name: Install dashboard test deps
        run: npm ci
      - name: Verify package-lock.json is in sync
        # npm ci rewrites the lockfile when package.json was edited without
        # relocking (e.g. a hand-bumped version range). A dirty lockfile here
        # means the committed lock no longer matches package.json — fail fast
        # instead of testing against dependencies nobody pinned.
        run: git diff --exit-code package-lock.json
      - name: Audit dashboard dependencies
        # Fail the job on a known moderate+ advisory in the dashboard's (dev-only)
        # npm tree. `--audit-level=moderate` keeps low-severity noise from blocking
        # PRs while still gating on anything meaningfully exploitable — the esbuild
        # advisory that previously bit this repo was rated Moderate, which the old
        # `--audit-level=high` gate would have waved through.
        run: npm audit --audit-level=moderate
      - name: Lint dashboard JS
        # ESLint catches undefined globals / redeclared names / unreachable code
        # that Spotless (formatting-only) does not. Fails the job on any lint error.
        run: npm run lint
      - name: Type-check dashboard TypeScript
        # tsc over the full dashboard TypeScript source — tsconfig.json includes
        # all of dashboard-src/js/**/*.ts under full `strict` (the old per-file
        # `// @ts-check` opt-in migration is complete). Catches type-level bugs
        # ESLint can't — wrong property access, bad call arity.
        run: npm run typecheck
      - name: Run dashboard JS smoke tests with coverage gate
        # Istanbul instruments the dashboard JS loaded by the jsdom smoke suite and
        # fails the job if coverage drops below the ratchet in vitest.config.js.
        # This is the dashboard half of verifyActiveApp, kept as its own job for
        # npm dependency caching and coverage artifact isolation.
        run: npm run test:coverage:ci
      - name: Summarize dashboard test results
        if: always()
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const summary = process.env.GITHUB_STEP_SUMMARY;
          const path = 'coverage/vitest-results.json';
          if (!summary || !fs.existsSync(path)) process.exit(0);
          const report = JSON.parse(fs.readFileSync(path, 'utf8'));
          const cases = [];
          function walk(value) {
            if (Array.isArray(value)) {
              value.forEach(walk);
              return;
            }
            if (!value || typeof value !== 'object') return;
            const hasCaseShape =
              typeof value.status === 'string' &&
              (typeof value.fullName === 'string' || typeof value.name === 'string' || typeof value.title === 'string');
            if (hasCaseShape) {
              const name = value.fullName || value.name || value.title;
              cases.push({
                name,
                status: value.status,
                duration: Number(value.duration || 0),
              });
            }
            Object.values(value).forEach(walk);
          }
          walk(report);
          const failed = cases.filter((item) => !['passed', 'todo', 'skipped', 'pending'].includes(item.status));
          const slow = cases.filter((item) => item.duration >= 500).sort((a, b) => b.duration - a.duration);
          let out = '\n### Dashboard unit tests\n\n';
          out += `- Test cases reported: ${cases.length}\n`;
          out += `- Failed cases: ${failed.length}\n`;
          if (failed.length) {
            out += '\nFailed cases:\n';
            for (const item of failed.slice(0, 20)) out += `- \`${item.name}\` (${item.status})\n`;
            if (failed.length > 20) out += `- ...and ${failed.length - 20} more\n`;
          }
          if (slow.length) {
            out += '\nSlowest dashboard cases over 500 ms:\n';
            for (const item of slow.slice(0, 10)) out += `- \`${item.name}\` - ${(item.duration / 1000).toFixed(2)}s\n`;
            if (slow.length > 10) out += `- ...and ${slow.length - 10} more\n`;
          }
          fs.appendFileSync(summary, out);
          NODE
      - name: Upload dashboard coverage report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dashboard-coverage
          path: mobile/android/dashboard-tests/coverage/
          if-no-files-found: ignore
      - name: Report dashboard bundle size and budget headroom
        if: always()
        working-directory: mobile/android
        # Advisory only -- the Gradle verifyDashboardBundleSize task is the hard gate. This
        # step shares tools/dashboard_bundle_report.py with the perf-trend snapshot so there
        # is ONE implementation of the grouping, read from build.gradle. It previously
        # re-declared the grouping in `find ! -name ...` and had drifted: lazy support
        # excluded only insights-panel + the DTC pair, and startup counted the two
        # lazy-injected stylesheets that build.gradle deliberately leaves out.
        run: python3 tools/dashboard_bundle_report.py report
  dashboard-e2e:
    needs: [build-dashboard]
    # Playwright renders the REAL dashboard (index.html + css + js) in headless Chromium and
    # asserts actual rendered layout + interaction — the regression net for UI bugs the jsdom
    # suite (dashboard-tests) physically can't see: box sizes, clipping, real computed styles.
    # The dashboard is static-served over HTTP (python3, present on the runner) so its
    # `script-src 'self'` CSP resolves the same way the Android WebView resolves file://.
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile/android/dashboard-e2e
    steps:
      - name: Record job start time
        # Runs before checkout, so the default working-directory does not exist yet.
        working-directory: ${{ github.workspace }}
        run: echo "JOB_STARTED_AT=$(date +%s)" >> "$GITHUB_ENV"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: mobile/android/dashboard-e2e/package-lock.json
      - name: Install e2e deps
        run: npm ci
      - name: Verify package-lock.json is in sync
        # Mirrors the dashboard-tests lockfile-sync gate: catches a package.json
        # edited without relocking before it drifts past CI.
        run: git diff --exit-code package-lock.json
      - name: Audit e2e dependencies
        # Fail the job on a known moderate+ advisory in the e2e (dev-only) npm
        # tree, mirroring the dashboard-tests audit gate. `--audit-level=moderate`
        # keeps low-severity noise from blocking PRs while still gating on anything
        # meaningfully exploitable (see the dashboard-tests audit step).
        run: npm audit --audit-level=moderate
      - name: Resolve pinned Playwright version
        # Cache key input: the browser build is fixed by the @playwright/test pin in
        # package-lock.json, so the cache rolls over exactly when the pin changes.
        id: playwright-version
        run: |
          version="$(node -p "require('./package-lock.json').packages['node_modules/@playwright/test'].version")"
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright-version.outputs.version }}
      - name: Install Playwright Chromium + OS deps
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium
      - name: Install Playwright OS deps (browser cache hit)
        # The browser binaries came from the cache, but apt-level dependencies are
        # not cached, so they still need installing on every runner.
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium
      - name: Download prebuilt dashboard bundle
        # Playwright serves the real index.html, which loads js/app.js — the bundle
        # built once in the build-dashboard job (no second npm ci + esbuild here).
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dashboard-bundle
          path: mobile/android/app/src/main/assets/dashboard
      - name: Restore previous run's retried-spec list
        # Cross-run flake state for the escalation in the report step below. The
        # primary key is unique per run/attempt (so the save step always writes a
        # fresh entry); restore-keys falls back to the most recent previous run on
        # this branch.
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: mobile/android/dashboard-e2e/.playwright-retries
          key: dashboard-e2e-retries-${{ github.head_ref || github.ref }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            dashboard-e2e-retries-${{ github.head_ref || github.ref }}-
      - name: Run dashboard Playwright tests
        # Functional/layout project only — the visual (screenshot) project runs in the
        # separate `dashboard-visual` job (also required via ci-success) so a baseline
        # mismatch fails THERE, not here. An intentional UI change must refresh the
        # committed *-linux.png baselines (download the dashboard-visual-snapshots
        # artifact and commit it), or the dashboard-visual gate stays red.
        run: npx playwright test --project=chromium
      - name: Report retried Playwright tests
        if: always()
        # Flake escalation policy: retries stay at 1 (playwright.config.js) so a
        # one-off runner hiccup cannot red the lane, but retries must not make
        # real flake invisible either. A spec that needed a retry gets a
        # ::warning; a spec that needed a retry in TWO CONSECUTIVE runs on the
        # same branch FAILS this job — that streak is a flaky test, not runner
        # noise. The per-branch retried-spec list is persisted in
        # .playwright-retries/ via the cache restore/save pair around this step
        # (restored list = previous run, written list = this run). A clean run
        # writes an empty list, so fixing the flake clears the streak.
        run: |
          node - <<'NODE'
          const fs = require('node:fs');
          const path = 'playwright-report/results.json';
          const stateDir = '.playwright-retries';
          const statePath = `${stateDir}/retried-specs.json`;
          const summary = process.env.GITHUB_STEP_SUMMARY;
          fs.mkdirSync(stateDir, { recursive: true });
          let previous = [];
          try {
            previous = JSON.parse(fs.readFileSync(statePath, 'utf8'));
            if (!Array.isArray(previous)) previous = [];
          } catch {
            previous = [];
          }
          if (!fs.existsSync(path)) {
            // Crashed before the reporter wrote results.json: keep the previous
            // state (do not overwrite) so an infra failure can't launder a streak.
            process.exit(0);
          }
          const report = JSON.parse(fs.readFileSync(path, 'utf8'));
          const retried = [];
          function visitSuite(suite, prefix = []) {
            for (const child of suite.suites || []) visitSuite(child, prefix.concat(child.title).filter(Boolean));
            for (const spec of suite.specs || []) {
              for (const test of spec.tests || []) {
                const retries = (test.results || []).filter((result) => result.retry > 0);
                if (retries.length) {
                  const title = prefix.concat(spec.title).filter(Boolean).join(' > ');
                  retried.push({ title, project: test.projectName || 'default', count: retries.length });
                }
              }
            }
          }
          for (const suite of report.suites || []) visitSuite(suite);
          const current = retried.map((item) => `${item.project}: ${item.title}`).sort();
          fs.writeFileSync(statePath, JSON.stringify(current, null, 2) + '\n');
          if (!retried.length) {
            if (summary) fs.appendFileSync(summary, '\n### Playwright retries\n\nNo dashboard e2e tests needed a retry.\n');
            process.exit(0);
          }
          if (summary) fs.appendFileSync(summary, '\n### Playwright retries\n\n| Test | Project | Retries |\n|------|---------|---------|\n');
          for (const item of retried) {
            console.log(`::warning title=Playwright retry::${item.project}: ${item.title} retried ${item.count} time(s)`);
            if (summary) fs.appendFileSync(summary, `| ${item.title.replace(/\|/g, '\\|')} | ${item.project} | ${item.count} |\n`);
          }
          const repeated = current.filter((name) => previous.includes(name));
          if (repeated.length) {
            for (const name of repeated) {
              console.log(`::error title=Playwright flake streak::${name} needed a retry in two consecutive runs on this branch — fix the flaky test instead of leaning on retries`);
            }
            if (summary) fs.appendFileSync(summary, `\nFAILED: ${repeated.length} spec(s) retried in two consecutive runs (flake streak).\n`);
            process.exit(1);
          }
          NODE
      - name: Save this run's retried-spec list
        # always(): the state must persist precisely when the report step above
        # fails the job, so the streak is visible to the next run.
        if: always()
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: mobile/android/dashboard-e2e/.playwright-retries
          key: dashboard-e2e-retries-${{ github.head_ref || github.ref }}-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dashboard-e2e-report
          path: mobile/android/dashboard-e2e/playwright-report/
          if-no-files-found: ignore
      - name: Report job wall-clock time
        if: always()
        working-directory: ${{ github.workspace }}
        run: |
          elapsed=$(( $(date +%s) - JOB_STARTED_AT ))
          echo "Job wall-clock: $((elapsed / 60))m $((elapsed % 60))s" >> "$GITHUB_STEP_SUMMARY"

  dashboard-visual:
    needs: [build-dashboard]
    # Required pixel-screenshot regression for the reworked dashboard surfaces (Playwright
    # toHaveScreenshot). Pinned to a fixed ubuntu image so font rendering matches the committed
    # baselines; the @playwright/test pin fixes the Chromium build. Baselines are Linux-only
    # (see .gitignore) and generated here — on the first run (or a real visual change) this job
    # fails and uploads the produced *-linux.png so they can be reviewed/committed.
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: mobile/android/dashboard-e2e
    steps:
      - name: Record job start time
        # Runs before checkout, so the default working-directory does not exist yet.
        working-directory: ${{ github.workspace }}
        run: echo "JOB_STARTED_AT=$(date +%s)" >> "$GITHUB_ENV"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: mobile/android/dashboard-e2e/package-lock.json
      - name: Install e2e deps
        run: npm ci
      - name: Resolve pinned Playwright version
        # Cache key input: the browser build is fixed by the @playwright/test pin in
        # package-lock.json, so the cache rolls over exactly when the pin changes.
        id: playwright-version
        run: |
          version="$(node -p "require('./package-lock.json').packages['node_modules/@playwright/test'].version")"
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright-version.outputs.version }}
      - name: Install Playwright Chromium + OS deps
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium
      - name: Install Playwright OS deps (browser cache hit)
        # The browser binaries came from the cache, but apt-level dependencies are
        # not cached, so they still need installing on every runner.
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium
      - name: Download prebuilt dashboard bundle
        # Playwright serves the real index.html, which loads js/app.js — the bundle
        # built once in the build-dashboard job (no second npm ci + esbuild here).
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dashboard-bundle
          path: mobile/android/app/src/main/assets/dashboard
      - name: Run visual screenshot tests
        run: npx playwright test --project=visual
      - name: Upload visual baselines + diffs
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dashboard-visual-snapshots
          # Upload every per-spec snapshot dir (visual.spec.js + scenario-matrix),
          # not just the first, so newly-generated baselines for any visual spec
          # can be reviewed and committed on the first run.
          path: |
            mobile/android/dashboard-e2e/*-snapshots/
            mobile/android/dashboard-e2e/test-results/
          if-no-files-found: ignore
      - name: Report job wall-clock time
        if: always()
        working-directory: ${{ github.workspace }}
        run: |
          elapsed=$(( $(date +%s) - JOB_STARTED_AT ))
          echo "Job wall-clock: $((elapsed / 60))m $((elapsed % 60))s" >> "$GITHUB_STEP_SUMMARY"

  gradle-dependency-audit:
    # Required dependency-vulnerability scan for the Gradle/Java side — the
    # counterpart to the npm `npm audit --audit-level=high` gate in the
    # dashboard-tests job above. A known-vulnerable transitive dependency now
    # fails ci-success instead of landing as an advisory artifact only.
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: temurin
          java-version: '21'
          cache: 'gradle'
      - name: Verify committed Gradle lockfile is in sync
        # app/gradle.lockfile is committed (see mobile/android/.gitignore) so the
        # OSV scan below reads it directly — no --write-locks regeneration. Only the
        # shipped `releaseRuntimeClasspath` is locked (see app/build.gradle), so this
        # step resolves that classpath in lock-VERIFICATION mode (no --write-locks)
        # and Gradle fails if it drifted from the lock — a stale lockfile can't slip
        # the scan. It only resolves dependencies (no Kotlin/Java compile).
        # AGP's unified-test-platform configs are deliberately unlocked so their
        # build/test-host-only Netty (never shipped) stays out of the scan.
        # Regenerate after a release-dependency change with `./gradlew :app:dependencies
        # --configuration releaseRuntimeClasspath --write-locks` and commit the file.
        #
        # NOT `:app:dependencies` — that report task prints "FAILED" rows for
        # unresolvable entries and still exits 0, which is how a lockfile missing
        # every Compose dependency passed this gate while breaking the release APK
        # build for three tagged releases in a row.
        working-directory: mobile/android
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon :app:verifyReleaseDependencyLock
      - name: OSV vulnerability scan
        id: osv
        # Scans the committed Gradle lockfile (shipped release runtime classpath) for
        # dependencies with known advisories in the OSV database.
        uses: google/osv-scanner-action/osv-scanner-action@6e4298ebc4db23e847df9b2e2de2939d6f066c67 # v2.5.1
        with:
          scan-args: |-
            --lockfile=./mobile/android/app/gradle.lockfile
      - name: Upload dependency audit artifacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: gradle-dependency-audit
          path: |
            mobile/android/app/gradle.lockfile
            results.sarif
          if-no-files-found: ignore

  dependency-review:
    # Supply-chain gate on the PR's dependency diff (GitHub dependency graph):
    # fails when a PR introduces a dependency with a known moderate+ advisory or
    # an unexpected license, before it ever lands. Complements the lockfile
    # audits above: npm audit / OSV scan what is already resolved, this reviews
    # what a PR is about to add. The event has no dependency diff outside
    # pull_request, so the job only runs there; ci-success below treats its
    # skipped result on main pushes as success (same pattern as emulator-smoke).
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Review PR dependency diff
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          # Match the npm audit gates: moderate+ blocks, low-severity is noise.
          fail-on-severity: moderate

  emulator-smoke:
    # Required WebView runtime smoke for the file:// dashboard path. It installs
    # the debug APK on an emulator, asserts the dashboard JS reaches the native
    # "dashboard handshake received" logcat marker, starts demo telemetry, and
    # taps through the dashboard tabs while scanning logcat for runtime errors.
    # PRs that only touch JVM tests, docs, or other non-runtime files skip this
    # slow lane; pushes to main and manual runs always execute it.
    needs: [changes]
    if: github.event_name != 'pull_request' || needs.changes.outputs.emulator_smoke == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Record job start time
        run: echo "JOB_STARTED_AT=$(date +%s)" >> "$GITHUB_ENV"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: temurin
          java-version: '21'
          cache: 'gradle'
      # Node is needed because preBuild runs buildDashboardJs (esbuild) to produce
      # the shipped dashboard bundle.
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: mobile/android/dashboard-tests/package-lock.json
      - name: Build debug APK and instrumented-test APK
        working-directory: mobile/android
        run: |
          chmod +x ./gradlew
          # androidTest APK built here, outside the emulator session, so the
          # connectedDebugAndroidTest step below only installs and runs.
          ./gradlew --no-daemon --configuration-cache :app:assembleDebug :app:assembleDebugAndroidTest
          ./gradlew --no-daemon :app:signingReport
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      # AVD snapshot caching (android-emulator-runner's documented pattern): a
      # cache miss boots the emulator once, cleanly, and saves a post-boot
      # snapshot; every later run restores that snapshot instead of paying the
      # multi-minute cold boot — which also shrinks the window for the
      # boot-time adb flakes this job occasionally hits. Bump the key suffix to
      # force a fresh AVD after emulator/system-image behavior changes.
      - name: AVD snapshot cache
        id: avd-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.android/avd/*
            ~/.android/adb*
          # Keep the snapshot tied to the phone profile below. Rotate the key whenever launch
          # behavior changes so an older AVD configuration cannot mask the new setting.
          key: avd-api34-google_apis-x86_64-pixel2-software-v6
      - name: Create AVD and generate snapshot for caching
        if: steps.avd-cache.outputs.cache-hit != 'true'
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_2
          force-avd-creation: false
          # Pixel 2 keeps a real 1080 px phone/WebView surface while rendering 20% fewer pixels
          # than Pixel 6. The API 34 image enforces a 2560 MiB guest even when lower memory is
          # requested, so use the smaller surface instead of carrying an ineffective memory flag.
          # No -no-snapshot here: this boot exists to write the snapshot.
          emulator-options: -no-window -no-audio -no-boot-anim -gpu software
          script: echo "Generated AVD snapshot for caching."
      # The previous SwiftShader GLES path segfaulted on a native RenderThread.
      # Use the supported software backend for both snapshot creation and tests.
      # Keep process/guest diagnostics and every runtime assertion; in-session
      # retries can leave an inconsistent guest and are intentionally not used.
      - name: Launch app and assert the dashboard JS comes alive
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_2
          force-avd-creation: false
          pre-emulator-launch-script: bash mobile/android/scripts/install-emulator-diagnostics.sh
          # The forced legacy SwiftShader GLES path segfaulted on RenderThread.
          # Let the emulator select its supported software rendering backends.
          emulator-options: -no-window -no-audio -no-snapshot-save -no-boot-anim -gpu software
          # The shell smoke (logcat contract) plus the instrumented twin
          # (app/src/androidTest MainActivitySmokeTest) on the same booted emulator, wrapped
          # in a streaming logcat so the instrumented phase is recorded too.
          #
          # ONE LINE, ON PURPOSE. This action runs `script:` one line at a time, each through
          # a separate `/usr/bin/sh -c` (dash, not bash). Nothing survives between lines — no
          # variable, no trap, no background PID — and a multi-line construct cannot even
          # parse, because line one is handed over as a complete program. Everything that
          # needs any of those lives in emulator-session.sh, which runs as a single process.
          script: bash mobile/android/scripts/emulator-session.sh
      # Guest logcat cannot explain a native emulator exit. Preserve host and
      # crash evidence alongside the process exit status for future regressions.
      - name: Capture host diagnostics after an emulator failure
        if: failure()
        continue-on-error: true
        run: |
          {
            echo "### Emulator failure — host diagnostics"
            echo
            echo '```'
            echo "== memory =="
            free -m
            echo
            echo "== cpu =="
            nproc
            echo
            echo "== kernel: OOM / qemu kills =="
            sudo dmesg --time-format iso 2>/dev/null | grep -iE 'killed process|out of memory|oom-kill|qemu' | tail -30 \
              || echo "(no OOM/qemu lines in dmesg)"
            echo
            echo "== adb devices =="
            adb devices -l 2>&1 || true
            echo '```'
          } | tee mobile/android/build/emulator-host-diagnostics.txt >> "$GITHUB_STEP_SUMMARY"
          # The emulator logs its crash database here; guest logcat cannot explain
          # a host-side native crash. Preserve it with the failure diagnostics.
          if [ -d /tmp/android-runner ]; then
            tar -czf mobile/android/build/emulator-crash-data.tar.gz -C /tmp/android-runner .
          fi
      - name: Upload emulator smoke artifacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: emulator-smoke-artifacts
          path: |
            mobile/android/build/emulator-smoke-logcat.txt
            mobile/android/build/emulator-session-logcat.txt
            mobile/android/build/emulator-host-diagnostics.txt
            mobile/android/build/emulator-crash-data.tar.gz
            mobile/android/build/emulator-process/
            mobile/android/build/emulator-smoke/
          if-no-files-found: ignore
      - name: Report job wall-clock time
        if: always()
        run: |
          elapsed=$(( $(date +%s) - JOB_STARTED_AT ))
          echo "Job wall-clock: $((elapsed / 60))m $((elapsed % 60))s" >> "$GITHUB_STEP_SUMMARY"

  ci-success:
    # Single aggregate status so branch protection only needs to require one
    # check ("ci-success") instead of enumerating every lane. Adding a new test
    # job just means adding it to `needs:` here — the verify step derives pass/fail
    # from the `needs` map itself (no second hand-maintained list to forget), so a
    # newly-added job can't silently pass this gate while failing.
    if: always()
    needs:
      [
        changes,
        unit-tests,
        static-analysis,
        build-dashboard,
        dashboard-tests,
        dashboard-e2e,
        dashboard-visual,
        gradle-dependency-audit,
        dependency-review,
        emulator-smoke,
      ]
    runs-on: ubuntu-latest
    steps:
      - name: Verify all required jobs passed
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: |
          echo "$NEEDS_JSON" | jq -r 'to_entries[] | "\(.key)=\(.value.result)"'
          # emulator-smoke may be path-skipped on PRs; dependency-review only has a
          # dependency diff to review on pull_request events, so it is skipped on
          # main pushes. Both count as success when skipped.
          failed="$(echo "$NEEDS_JSON" | jq -r '[to_entries[] | select(.value.result != "success" and (.key != "emulator-smoke" or .value.result != "skipped") and (.key != "dependency-review" or .value.result != "skipped")) | .key] | join(", ")')"
          if [ -n "$failed" ]; then
            echo "::error::One or more required CI jobs did not succeed: $failed"
            exit 1
          fi
          echo "All required CI jobs succeeded or were intentionally path-skipped."

  publish-debug-release:
    # Rolling debug build of main, surfaced as a permanent download URL:
    # https://github.com/jtn0123/VoltTracker/releases/tag/latest-debug
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [unit-tests, ci-success]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: volttracker-debug-apk
          path: artifact
      - name: Stage APK with versioned filename
        run: |
          mkdir -p release
          VERSION="$(cat VERSION)"
          SHORT_SHA="${GITHUB_SHA::7}"
          cp artifact/app-debug.apk "release/volttracker-v${VERSION}-${SHORT_SHA}-debug.apk"
      - name: Remove legacy generic debug assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release view latest-debug --repo "${{ github.repository }}" \
            --json assets --jq '.assets[].name' \
            | grep -E '^(app-debug\.apk|volttracker-debug-[0-9a-f]+\.apk)$' \
            > legacy-debug-assets.txt || true
          while read -r asset; do
            if [ -n "${asset}" ]; then
              gh release delete-asset latest-debug "${asset}" \
                --repo "${{ github.repository }}" --yes
              echo "Removed legacy latest-debug asset ${asset}"
            fi
          done < legacy-debug-assets.txt
      - uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: latest-debug
          name: Latest debug build (main)
          body: |
            Rolling debug build of `main`. Updates on every push.

            - Commit: ${{ github.sha }}
            - APK flavor: debug
            - Filename format: `volttracker-v<version>-<commit>-debug.apk`

            The APK is signed with the standard Android debug key. To install:
            grant "Install unknown apps" to your browser or file manager, then
            tap the `volttracker-v...-debug.apk` asset below.
          files: release/*.apk
          prerelease: true
          make_latest: 'false'
          target_commitish: ${{ github.sha }}
