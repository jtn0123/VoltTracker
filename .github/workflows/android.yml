name: Android unit tests

# The push trigger also fires on python-semantic-release's version-bump commits
# (which only touch VERSION and pyproject.toml). Re-running this workflow after a
# bump rebuilds the rolling latest-debug APK with the new versionName baked in,
# so the in-app "Volt Tracker vX.Y.Z" footer stays in sync with the most recent
# tag instead of lagging one release behind. Pull-request paths intentionally
# stay narrow — release commits never arrive as PRs.
on:
  push:
    paths:
      - 'mobile/android/**'
      - '.github/workflows/android.yml'
      - 'VERSION'
      - 'pyproject.toml'
  pull_request:
    paths:
      - 'mobile/android/**'
      - '.github/workflows/android.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile/android
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654 # v5.2.0
        with:
          distribution: temurin
          java-version: '17'
      - name: Run unit tests
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon :app:testDebugUnitTest
      - name: Spotless check
        run: ./gradlew --no-daemon :app:spotlessCheck
      - name: Android Lint
        run: ./gradlew --no-daemon :app:lintDebug
      - name: Assemble debug APK
        run: ./gradlew --no-daemon :app:assembleDebug
      - name: JaCoCo coverage report
        run: ./gradlew --no-daemon :app:jacocoTestReport
      - name: Verify coverage thresholds
        run: ./gradlew --no-daemon :app:jacocoTestCoverageVerification
      - name: Upload debug APK
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: volttracker-debug-apk
          path: mobile/android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: warn
      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-report
          path: mobile/android/app/build/reports/jacoco/jacocoTestReport/
          if-no-files-found: ignore
      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: unit-test-report
          path: mobile/android/app/build/reports/tests/
          if-no-files-found: ignore

  dashboard-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile/android/dashboard-tests
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@0a44ba7841725637a19e28fa30b79a866c81b0a6 # v4.0.4
        with:
          node-version: '20'
      - name: Install dashboard test deps
        run: npm ci
      - name: Lint dashboard JS
        # I1: ESLint catches undefined globals / redeclared names / unreachable code
        # that Spotless (formatting-only) does not. Fails the job on any lint error.
        run: npm run lint
      - name: Run dashboard JS smoke tests with coverage gate
        # D4: --coverage runs the same suites under v8 instrumentation and fails the
        # job if coverage drops below the floor declared in vitest.config.js. The
        # floor mirrors the JaCoCo ratchet pattern — never lower it, only raise it.
        run: npm run test:coverage
      - name: Upload dashboard coverage report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: dashboard-coverage
          path: mobile/android/dashboard-tests/coverage/
          if-no-files-found: ignore
      - name: Report dashboard bundle size
        if: always()
        working-directory: mobile/android/app/src/main/assets/dashboard
        run: |
          {
            echo "## Dashboard bundle size"
            echo ""
            echo "| Path | Bytes |"
            echo "|------|-------|"
            for f in js/*.js css/*.css; do
              if [ -f "$f" ]; then
                size=$(wc -c < "$f" | tr -d ' ')
                echo "| $f | $size |"
              fi
            done
            total=$(find js css -type f \( -name "*.js" -o -name "*.css" \) ! -path "*/lib/*" -exec cat {} + | wc -c | tr -d ' ')
            echo "| **total (excl lib/)** | **$total** |"
          } >> "$GITHUB_STEP_SUMMARY"

  publish-debug-release:
    # Rolling debug build of main, surfaced as a permanent download URL:
    # https://github.com/jtn0123/VoltTracker/releases/tag/latest-debug
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: unit-tests
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: volttracker-debug-apk
          path: artifact
      - name: Stage APKs (stable + commit-tagged filenames)
        run: |
          mkdir -p release
          cp artifact/app-debug.apk release/app-debug.apk
          cp artifact/app-debug.apk "release/volttracker-debug-${GITHUB_SHA::7}.apk"
      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          tag_name: latest-debug
          name: Latest debug build (main)
          body: |
            Rolling debug build of `main`. Updates on every push.

            - Commit: ${{ github.sha }}

            The APK is signed with the standard Android debug key. To install:
            grant "Install unknown apps" to your browser or file manager, then
            tap `app-debug.apk` below.
          files: release/*.apk
          prerelease: true
          make_latest: 'false'
          target_commitish: ${{ github.sha }}
