name: Android unit tests

# The push trigger also fires on python-semantic-release's version-bump commits
# (which only touch VERSION and pyproject.toml). Re-running this workflow after a
# bump rebuilds the rolling latest-debug APK with the new versionName baked in,
# so the in-app "Volt Tracker vX.Y.Z" footer stays in sync with the most recent
# tag instead of lagging one release behind. Pull-request paths intentionally
# stay narrow — release commits never arrive as PRs.
on:
  push:
    paths:
      - 'mobile/android/**'
      - '.github/workflows/android.yml'
      - 'VERSION'
      - 'pyproject.toml'
  pull_request:
    paths:
      - 'mobile/android/**'
      - '.github/workflows/android.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile/android
    steps:
      - name: Record job start time
        # Runs before checkout, so the default working-directory does not exist yet.
        working-directory: ${{ github.workspace }}
        run: echo "JOB_STARTED_AT=$(date +%s)" >> "$GITHUB_ENV"
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654 # v5.2.0
        with:
          distribution: temurin
          java-version: '21'
          cache: 'gradle'
      # Node is needed because preBuild runs buildDashboardJs (esbuild bundles the
      # dashboard source in dashboard-src/js into the shipped assets/dashboard/js).
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: mobile/android/dashboard-tests/package-lock.json
      - name: Run unit tests
        # CI keeps the same checks as verifyActiveApp split into separate steps
        # so failures point at the exact lane and artifact uploads still run.
        # Keep this list in sync with mobile/android/build.gradle:verifyActiveApp.
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon --configuration-cache :app:testDebugUnitTest
      - name: Summarize unit test results
        if: always()
        run: |
          python3 - <<'PY'
          import glob
          import os
          import xml.etree.ElementTree as ET

          summary = os.environ.get("GITHUB_STEP_SUMMARY")
          if not summary:
              raise SystemExit(0)
          paths = glob.glob("app/build/test-results/testDebugUnitTest/TEST-*.xml")
          tests = failures = skipped = 0
          slow = []
          failed_cases = []
          for path in paths:
              root = ET.parse(path).getroot()
              tests += int(root.attrib.get("tests", "0"))
              failures += int(root.attrib.get("failures", "0")) + int(root.attrib.get("errors", "0"))
              skipped += int(root.attrib.get("skipped", "0"))
              for case in root.findall("testcase"):
                  name = f"{case.attrib.get('classname', '')}.{case.attrib.get('name', '')}".strip(".")
                  elapsed = float(case.attrib.get("time", "0"))
                  if elapsed >= 0.5:
                      slow.append((elapsed, name))
                  if case.find("failure") is not None or case.find("error") is not None:
                      failed_cases.append(name)

          with open(summary, "a", encoding="utf-8") as fh:
              fh.write("\n### Android unit tests\n\n")
              fh.write(f"- Tests: {tests}\n- Failures/errors: {failures}\n- Skipped: {skipped}\n")
              if failed_cases:
                  fh.write("\nFailed cases:\n")
                  for name in failed_cases[:20]:
                      fh.write(f"- `{name}`\n")
              if slow:
                  fh.write("\nSlowest cases over 500 ms:\n")
                  for elapsed, name in sorted(slow, reverse=True)[:10]:
                      fh.write(f"- `{name}` - {elapsed:.2f}s\n")
          PY
      - name: Spotless check
        run: ./gradlew --no-daemon --configuration-cache :app:spotlessCheck
      - name: Detekt static analysis
        # Correctness-leaning Kotlin rules (ktlint covers formatting); config in app/detekt.yml.
        run: ./gradlew --no-daemon --configuration-cache :app:detekt
      - name: Android Lint
        run: ./gradlew --no-daemon --configuration-cache :app:lintDebug
      - name: Assemble debug APK
        run: ./gradlew --no-daemon --configuration-cache :app:assembleDebug
      - name: Verify generated dashboard is committed
        run: ./gradlew --no-daemon --configuration-cache verifyGeneratedDashboardClean
      - name: Upload generated dashboard diff
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: generated-dashboard-html-diff
          path: mobile/android/build/reports/dashboard-html-diff/
          if-no-files-found: ignore
      - name: Verify dashboard bundle budget
        run: ./gradlew --no-daemon --configuration-cache verifyDashboardBundleSize
      - name: JaCoCo coverage report
        run: ./gradlew --no-daemon --configuration-cache :app:jacocoTestReport
      - name: Verify coverage thresholds
        run: ./gradlew --no-daemon --configuration-cache :app:jacocoTestCoverageVerification
      - name: Upload debug APK
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: volttracker-debug-apk
          path: mobile/android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: warn
      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-report
          path: mobile/android/app/build/reports/jacoco/jacocoTestReport/
          if-no-files-found: ignore
      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: unit-test-report
          path: mobile/android/app/build/reports/tests/
          if-no-files-found: ignore
      - name: Report job wall-clock time
        if: always()
        working-directory: ${{ github.workspace }}
        run: |
          elapsed=$(( $(date +%s) - JOB_STARTED_AT ))
          echo "Job wall-clock: $((elapsed / 60))m $((elapsed % 60))s" >> "$GITHUB_STEP_SUMMARY"

  dashboard-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile/android/dashboard-tests
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: mobile/android/dashboard-tests/package-lock.json
      - name: Install dashboard test deps
        run: npm ci
      - name: Build dashboard bundle
        # esbuild compiles dashboard-src/js -> assets/dashboard/js (gitignored), so the
        # bundle-size report below measures the real shipped output. Lint/typecheck/tests
        # read the source, not the bundle.
        run: npm run build
      - name: Audit dashboard dependencies
        # Fail the job on a known high/critical advisory in the dashboard's
        # (dev-only) npm tree. `--audit-level=high` keeps low/moderate noise from
        # blocking PRs while still gating on anything seriously exploitable.
        run: npm audit --audit-level=high
      - name: Lint dashboard JS
        # ESLint catches undefined globals / redeclared names / unreachable code
        # that Spotless (formatting-only) does not. Fails the job on any lint error.
        run: npm run lint
      - name: Type-check opted-in dashboard JS
        # tsc --checkJs over the files that start with `// @ts-check` (see
        # tsconfig.json). Catches type-level bugs ESLint can't — wrong property
        # access, bad call arity. Migrate a file by adding the comment + clearing
        # errors; this gate keeps the already-migrated files honest.
        run: npm run typecheck
      - name: Run dashboard JS smoke tests with coverage gate
        # Istanbul instruments the dashboard JS loaded by the jsdom smoke suite and
        # fails the job if coverage drops below the ratchet in vitest.config.js.
        # This is the dashboard half of verifyActiveApp, kept as its own job for
        # npm dependency caching and coverage artifact isolation.
        run: npm run test:coverage:ci
      - name: Summarize dashboard test results
        if: always()
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const summary = process.env.GITHUB_STEP_SUMMARY;
          const path = 'coverage/vitest-results.json';
          if (!summary || !fs.existsSync(path)) process.exit(0);
          const report = JSON.parse(fs.readFileSync(path, 'utf8'));
          const cases = [];
          function walk(value) {
            if (Array.isArray(value)) {
              value.forEach(walk);
              return;
            }
            if (!value || typeof value !== 'object') return;
            const hasCaseShape =
              typeof value.status === 'string' &&
              (typeof value.fullName === 'string' || typeof value.name === 'string' || typeof value.title === 'string');
            if (hasCaseShape) {
              const name = value.fullName || value.name || value.title;
              cases.push({
                name,
                status: value.status,
                duration: Number(value.duration || 0),
              });
            }
            Object.values(value).forEach(walk);
          }
          walk(report);
          const failed = cases.filter((item) => !['passed', 'todo', 'skipped', 'pending'].includes(item.status));
          const slow = cases.filter((item) => item.duration >= 500).sort((a, b) => b.duration - a.duration).slice(0, 10);
          let out = '\n### Dashboard unit tests\n\n';
          out += `- Test cases reported: ${cases.length}\n`;
          out += `- Failed cases: ${failed.length}\n`;
          if (failed.length) {
            out += '\nFailed cases:\n';
            for (const item of failed.slice(0, 20)) out += `- \`${item.name}\` (${item.status})\n`;
          }
          if (slow.length) {
            out += '\nSlowest dashboard cases over 500 ms:\n';
            for (const item of slow) out += `- \`${item.name}\` - ${(item.duration / 1000).toFixed(2)}s\n`;
          }
          fs.appendFileSync(summary, out);
          NODE
      - name: Upload dashboard coverage report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dashboard-coverage
          path: mobile/android/dashboard-tests/coverage/
          if-no-files-found: ignore
      - name: Report dashboard bundle size and budget headroom
        if: always()
        working-directory: mobile/android/app/src/main/assets/dashboard
        run: |
          {
            echo "## Dashboard bundle size"
            echo ""
            echo "| Path | Bytes |"
            echo "|------|-------|"
            for f in js/*.js css/*.css; do
              if [ -f "$f" ]; then
                size=$(wc -c < "$f" | tr -d ' ')
                echo "| $f | $size |"
              fi
            done
          } >> "$GITHUB_STEP_SUMMARY"
          # Split budget (build.gradle:verifyDashboardBundleSize): core bundle vs lazy DTC
          # data. Keep these numbers in sync with dashboardCoreBudgetBytes /
          # dashboardDtcDataBudgetBytes in mobile/android/build.gradle. The Gradle task is
          # the hard gate (it fails the unit-tests job when a budget is exceeded); this
          # report is advisory only — it surfaces remaining headroom and warns when a
          # bundle is within 15 KB of its budget, without failing the build.
          core_budget=400000
          dtc_budget=380000
          warn_floor=15000
          dtc=$(cat js/dtc-lookup.js js/dtc-causes.js | wc -c | tr -d ' ')
          all=$(find js css -type f \( -name "*.js" -o -name "*.css" \) ! -path "*/lib/*" -exec cat {} + | wc -c | tr -d ' ')
          core=$((all - dtc))
          core_headroom=$((core_budget - core))
          dtc_headroom=$((dtc_budget - dtc))
          {
            echo ""
            echo "### Budget headroom"
            echo ""
            echo "| Bundle | Bytes | Budget | Headroom |"
            echo "|--------|------:|-------:|---------:|"
            echo "| core (JS + CSS, excl lib/ and DTC data) | $core | $core_budget | $core_headroom |"
            echo "| dtc data (dtc-lookup.js + dtc-causes.js) | $dtc | $dtc_budget | $dtc_headroom |"
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$core_headroom" -lt "$warn_floor" ]; then
            echo "::warning title=Dashboard bundle headroom::core bundle headroom is ${core_headroom} bytes (under 15 KB of the ${core_budget}-byte budget)"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "WARNING: core bundle headroom is ${core_headroom} bytes (under 15 KB)." >> "$GITHUB_STEP_SUMMARY"
          fi
          if [ "$dtc_headroom" -lt "$warn_floor" ]; then
            echo "::warning title=Dashboard bundle headroom::DTC data headroom is ${dtc_headroom} bytes (under 15 KB of the ${dtc_budget}-byte budget)"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "WARNING: DTC data headroom is ${dtc_headroom} bytes (under 15 KB)." >> "$GITHUB_STEP_SUMMARY"
          fi

  dashboard-e2e:
    # Playwright renders the REAL dashboard (index.html + css + js) in headless Chromium and
    # asserts actual rendered layout + interaction — the regression net for UI bugs the jsdom
    # suite (dashboard-tests) physically can't see: box sizes, clipping, real computed styles.
    # The dashboard is static-served over HTTP (python3, present on the runner) so its
    # `script-src 'self'` CSP resolves the same way the Android WebView resolves file://.
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile/android/dashboard-e2e
    steps:
      - name: Record job start time
        # Runs before checkout, so the default working-directory does not exist yet.
        working-directory: ${{ github.workspace }}
        run: echo "JOB_STARTED_AT=$(date +%s)" >> "$GITHUB_ENV"
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: mobile/android/dashboard-e2e/package-lock.json
      - name: Install e2e deps
        run: npm ci
      - name: Audit e2e dependencies
        # Fail the job on a known high/critical advisory in the e2e (dev-only) npm
        # tree, mirroring the dashboard-tests audit gate. `--audit-level=high` keeps
        # low/moderate noise from blocking PRs while still gating on anything
        # seriously exploitable.
        run: npm audit --audit-level=high
      - name: Resolve pinned Playwright version
        # Cache key input: the browser build is fixed by the @playwright/test pin in
        # package-lock.json, so the cache rolls over exactly when the pin changes.
        id: playwright-version
        run: |
          version="$(node -p "require('./package-lock.json').packages['node_modules/@playwright/test'].version")"
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright-version.outputs.version }}
      - name: Install Playwright Chromium + OS deps
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium
      - name: Install Playwright OS deps (browser cache hit)
        # The browser binaries came from the cache, but apt-level dependencies are
        # not cached, so they still need installing on every runner.
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium
      - name: Build dashboard bundle
        # Playwright serves the real index.html, which loads js/app.js (the built bundle).
        working-directory: mobile/android/dashboard-tests
        run: npm ci && npm run build
      - name: Run dashboard Playwright tests
        # Functional/layout project only — the visual (screenshot) project runs in the
        # separate `dashboard-visual` job (also required via ci-success) so a baseline
        # mismatch fails THERE, not here. An intentional UI change must refresh the
        # committed *-linux.png baselines (download the dashboard-visual-snapshots
        # artifact and commit it), or the dashboard-visual gate stays red.
        run: npx playwright test --project=chromium
      - name: Report retried Playwright tests
        if: always()
        run: |
          node - <<'NODE'
          const fs = require('node:fs');
          const path = 'playwright-report/results.json';
          const summary = process.env.GITHUB_STEP_SUMMARY;
          if (!fs.existsSync(path) || !summary) process.exit(0);
          const report = JSON.parse(fs.readFileSync(path, 'utf8'));
          const retried = [];
          function visitSuite(suite, prefix = []) {
            for (const child of suite.suites || []) visitSuite(child, prefix.concat(child.title).filter(Boolean));
            for (const spec of suite.specs || []) {
              for (const test of spec.tests || []) {
                const retries = (test.results || []).filter((result) => result.retry > 0);
                if (retries.length) {
                  const title = prefix.concat(spec.title).filter(Boolean).join(' > ');
                  retried.push({ title, project: test.projectName || 'default', count: retries.length });
                }
              }
            }
          }
          for (const suite of report.suites || []) visitSuite(suite);
          if (!retried.length) {
            fs.appendFileSync(summary, '\n### Playwright retries\n\nNo dashboard e2e tests needed a retry.\n');
            process.exit(0);
          }
          fs.appendFileSync(summary, '\n### Playwright retries\n\n| Test | Project | Retries |\n|------|---------|---------|\n');
          for (const item of retried) {
            console.log(`::warning title=Playwright retry::${item.project}: ${item.title} retried ${item.count} time(s)`);
            fs.appendFileSync(summary, `| ${item.title.replace(/\|/g, '\\|')} | ${item.project} | ${item.count} |\n`);
          }
          NODE
      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dashboard-e2e-report
          path: mobile/android/dashboard-e2e/playwright-report/
          if-no-files-found: ignore
      - name: Report job wall-clock time
        if: always()
        working-directory: ${{ github.workspace }}
        run: |
          elapsed=$(( $(date +%s) - JOB_STARTED_AT ))
          echo "Job wall-clock: $((elapsed / 60))m $((elapsed % 60))s" >> "$GITHUB_STEP_SUMMARY"

  dashboard-visual:
    # Required pixel-screenshot regression for the reworked dashboard surfaces (Playwright
    # toHaveScreenshot). Pinned to a fixed ubuntu image so font rendering matches the committed
    # baselines; the @playwright/test pin fixes the Chromium build. Baselines are Linux-only
    # (see .gitignore) and generated here — on the first run (or a real visual change) this job
    # fails and uploads the produced *-linux.png so they can be reviewed/committed.
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: mobile/android/dashboard-e2e
    steps:
      - name: Record job start time
        # Runs before checkout, so the default working-directory does not exist yet.
        working-directory: ${{ github.workspace }}
        run: echo "JOB_STARTED_AT=$(date +%s)" >> "$GITHUB_ENV"
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: mobile/android/dashboard-e2e/package-lock.json
      - name: Install e2e deps
        run: npm ci
      - name: Resolve pinned Playwright version
        # Cache key input: the browser build is fixed by the @playwright/test pin in
        # package-lock.json, so the cache rolls over exactly when the pin changes.
        id: playwright-version
        run: |
          version="$(node -p "require('./package-lock.json').packages['node_modules/@playwright/test'].version")"
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright-version.outputs.version }}
      - name: Install Playwright Chromium + OS deps
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium
      - name: Install Playwright OS deps (browser cache hit)
        # The browser binaries came from the cache, but apt-level dependencies are
        # not cached, so they still need installing on every runner.
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium
      - name: Build dashboard bundle
        # Playwright serves the real index.html, which loads js/app.js (the built bundle).
        working-directory: mobile/android/dashboard-tests
        run: npm ci && npm run build
      - name: Run visual screenshot tests
        run: npx playwright test --project=visual
      - name: Upload visual baselines + diffs
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dashboard-visual-snapshots
          # Upload every per-spec snapshot dir (visual.spec.js + scenario-matrix),
          # not just the first, so newly-generated baselines for any visual spec
          # can be reviewed and committed on the first run.
          path: |
            mobile/android/dashboard-e2e/*-snapshots/
            mobile/android/dashboard-e2e/test-results/
          if-no-files-found: ignore
      - name: Report job wall-clock time
        if: always()
        working-directory: ${{ github.workspace }}
        run: |
          elapsed=$(( $(date +%s) - JOB_STARTED_AT ))
          echo "Job wall-clock: $((elapsed / 60))m $((elapsed % 60))s" >> "$GITHUB_STEP_SUMMARY"

  gradle-dependency-audit:
    # Required dependency-vulnerability scan for the Gradle/Java side — the
    # counterpart to the npm `npm audit --audit-level=high` gate in the
    # dashboard-tests job above. A known-vulnerable transitive dependency now
    # fails ci-success instead of landing as an advisory artifact only.
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654 # v5.2.0
        with:
          distribution: temurin
          java-version: '21'
          cache: 'gradle'
      - name: Verify committed Gradle lockfile is in sync
        # app/gradle.lockfile is committed (see mobile/android/.gitignore) so the
        # OSV scan below reads it directly — no --write-locks regeneration. Only the
        # shipped `releaseRuntimeClasspath` is locked (see app/build.gradle), so this
        # step resolves dependencies in lock-VERIFICATION mode (no --write-locks) and
        # Gradle fails if that classpath drifted from the lock — a stale lockfile
        # can't slip the scan. It only resolves dependencies (no Kotlin/Java compile).
        # AGP's unified-test-platform configs are deliberately unlocked so their
        # build/test-host-only Netty (never shipped) stays out of the scan.
        # Regenerate after a release-dependency change with `./gradlew :app:dependencies
        # --configuration releaseRuntimeClasspath --write-locks` and commit the file.
        working-directory: mobile/android
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon :app:dependencies
      - name: OSV vulnerability scan
        id: osv
        # Scans the committed Gradle lockfile (shipped release runtime classpath) for
        # dependencies with known advisories in the OSV database.
        uses: google/osv-scanner-action/osv-scanner-action@e69cc6c86b31f1e7e23935bbe7031b50e51082de # v2.0.2
        with:
          scan-args: |-
            --lockfile=./mobile/android/app/gradle.lockfile
      - name: Upload dependency audit artifacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: gradle-dependency-audit
          path: |
            mobile/android/app/gradle.lockfile
            results.sarif
          if-no-files-found: ignore

  emulator-smoke:
    # Required WebView runtime smoke for the file:// dashboard path. It installs
    # the debug APK on an emulator, asserts the dashboard JS reaches the native
    # "dashboard handshake received" logcat marker, starts demo telemetry, and
    # taps through the dashboard tabs while scanning logcat for runtime errors.
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Record job start time
        run: echo "JOB_STARTED_AT=$(date +%s)" >> "$GITHUB_ENV"
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654 # v5.2.0
        with:
          distribution: temurin
          java-version: '21'
          cache: 'gradle'
      # Node is needed because preBuild runs buildDashboardJs (esbuild) to produce
      # the shipped dashboard bundle.
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: mobile/android/dashboard-tests/package-lock.json
      - name: Build debug APK and instrumented-test APK
        working-directory: mobile/android
        run: |
          chmod +x ./gradlew
          # androidTest APK built here, outside the emulator session, so the
          # connectedDebugAndroidTest step below only installs and runs.
          ./gradlew --no-daemon --configuration-cache :app:assembleDebug :app:assembleDebugAndroidTest
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Launch app and assert the dashboard JS comes alive
        uses: reactivecircus/android-emulator-runner@e89f39f1abbbd05b1113a29cf4db69e7540cae5a # v2.37.0
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          emulator-options: -no-window -no-audio -no-snapshot -no-boot-anim -gpu swiftshader_indirect
          # The shell smoke (logcat contract) plus the instrumented twin
          # (app/src/androidTest MainActivitySmokeTest) on the same booted emulator.
          script: |
            bash mobile/android/scripts/emulator-smoke.sh
            cd mobile/android && ./gradlew --no-daemon --configuration-cache :app:connectedDebugAndroidTest
      - name: Upload emulator smoke artifacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: emulator-smoke-artifacts
          path: |
            mobile/android/build/emulator-smoke-logcat.txt
            mobile/android/build/emulator-smoke/
          if-no-files-found: ignore
      - name: Report job wall-clock time
        if: always()
        run: |
          elapsed=$(( $(date +%s) - JOB_STARTED_AT ))
          echo "Job wall-clock: $((elapsed / 60))m $((elapsed % 60))s" >> "$GITHUB_STEP_SUMMARY"

  ci-success:
    # Single aggregate status so branch protection only needs to require one
    # check ("ci-success") instead of enumerating every lane. Adding a new test
    # job just means adding it to `needs:` here — the verify step derives pass/fail
    # from the `needs` map itself (no second hand-maintained list to forget), so a
    # newly-added job can't silently pass this gate while failing.
    if: always()
    needs:
      [
        unit-tests,
        dashboard-tests,
        dashboard-e2e,
        dashboard-visual,
        gradle-dependency-audit,
        emulator-smoke,
      ]
    runs-on: ubuntu-latest
    steps:
      - name: Verify all required jobs passed
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: |
          echo "$NEEDS_JSON" | jq -r 'to_entries[] | "\(.key)=\(.value.result)"'
          failed="$(echo "$NEEDS_JSON" | jq -r '[to_entries[] | select(.value.result != "success") | .key] | join(", ")')"
          if [ -n "$failed" ]; then
            echo "::error::One or more required CI jobs did not succeed: $failed"
            exit 1
          fi
          echo "All required CI jobs succeeded."

  publish-debug-release:
    # Rolling debug build of main, surfaced as a permanent download URL:
    # https://github.com/jtn0123/VoltTracker/releases/tag/latest-debug
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [unit-tests, ci-success]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: volttracker-debug-apk
          path: artifact
      - name: Stage APK with versioned filename
        run: |
          mkdir -p release
          VERSION="$(cat VERSION)"
          SHORT_SHA="${GITHUB_SHA::7}"
          cp artifact/app-debug.apk "release/volttracker-v${VERSION}-${SHORT_SHA}-debug.apk"
      - name: Remove legacy generic debug assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release view latest-debug --repo "${{ github.repository }}" \
            --json assets --jq '.assets[].name' \
            | grep -E '^(app-debug\.apk|volttracker-debug-[0-9a-f]+\.apk)$' \
            > legacy-debug-assets.txt || true
          while read -r asset; do
            if [ -n "${asset}" ]; then
              gh release delete-asset latest-debug "${asset}" \
                --repo "${{ github.repository }}" --yes
              echo "Removed legacy latest-debug asset ${asset}"
            fi
          done < legacy-debug-assets.txt
      - uses: softprops/action-gh-release@b4309332981a82ec1c5618f44dd2e27cc8bfbfda # v3.0.0
        with:
          tag_name: latest-debug
          name: Latest debug build (main)
          body: |
            Rolling debug build of `main`. Updates on every push.

            - Commit: ${{ github.sha }}
            - APK flavor: debug
            - Filename format: `volttracker-v<version>-<commit>-debug.apk`

            The APK is signed with the standard Android debug key. To install:
            grant "Install unknown apps" to your browser or file manager, then
            tap the `volttracker-v...-debug.apk` asset below.
          files: release/*.apk
          prerelease: true
          make_latest: 'false'
          target_commitish: ${{ github.sha }}
