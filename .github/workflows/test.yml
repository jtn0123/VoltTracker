name: Tests

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master, develop]

jobs:
  test:
    runs-on: [self-hosted, ci]

    strategy:
      matrix:
        python-version: ['3.10', '3.11', '3.12', '3.13']

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Cache pip dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('receiver/requirements*.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r receiver/requirements.txt
          pip install -r receiver/requirements-dev.txt

      - name: Run tests with coverage
        run: |
          python -m pytest tests/ -v --cov=receiver --cov-report=xml --cov-report=term-missing
        env:
          DATABASE_URL: "sqlite:///:memory:"
          FLASK_TESTING: "true"
          FLASK_ENV: "development"

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage.xml
          fail_ci_if_error: false
          verbose: true

  frontend:
    runs-on: [self-hosted, ci]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: receiver/frontend/package-lock.json

      - name: Install dependencies
        run: cd receiver/frontend && npm ci

      - name: Run frontend tests
        run: cd receiver/frontend && npm test

      - name: Run frontend lint
        run: cd receiver/frontend && npm run lint

      - name: Run type check
        run: cd receiver/frontend && npm run type-check

  lint:
    runs-on: [self-hosted, ci]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install linters
        run: |
          python -m pip install --upgrade pip
          pip install flake8

      - name: Run flake8
        run: |
          flake8 receiver/ tests/ --max-line-length=120 --ignore=W503,W504,E402

  security:
    runs-on: [self-hosted, ci]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install security tools
        run: |
          python -m pip install --upgrade pip
          pip install bandit pip-audit

      - name: Run Bandit security linter
        run: |
          bandit -r receiver/ -ll --skip B101

      - name: Check dependencies for vulnerabilities
        run: |
          pip-audit -r receiver/requirements.txt

  type-check:
    runs-on: [self-hosted, ci]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r receiver/requirements.txt
          pip install mypy types-requests types-Flask types-python-dateutil

      - name: Run mypy
        run: |
          mypy receiver/ --ignore-missing-imports --disable-error-code=misc --disable-error-code=valid-type --disable-error-code=var-annotated --disable-error-code=arg-type --disable-error-code=assignment --disable-error-code=operator --disable-error-code=no-any-return --disable-error-code=attr-defined

  test-postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: volt
          POSTGRES_PASSWORD: testpass
          POSTGRES_DB: volt_tracker_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U volt -d volt_tracker_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r receiver/requirements.txt
          pip install -r receiver/requirements-dev.txt
          pip install psycopg2-binary

      - name: Run tests against PostgreSQL
        run: |
          python -m pytest tests/test_models.py tests/test_api.py tests/test_concurrency.py tests/test_transactions.py -v --tb=short
        env:
          DATABASE_URL: "postgresql://volt:testpass@localhost:5432/volt_tracker_test"
          FLASK_TESTING: "true"
          FLASK_ENV: "development"
