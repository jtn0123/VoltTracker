name: Tests

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master, develop]

jobs:
  test:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        python-version: ['3.10', '3.11', '3.12', '3.13']

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Cache pip dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('receiver/requirements*.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r receiver/requirements.txt
          pip install -r receiver/requirements-dev.txt

      - name: Run tests with coverage
        run: |
          python -m pytest tests/ -v --cov=receiver --cov-report=xml --cov-report=term-missing
        env:
          DATABASE_URL: "sqlite:///:memory:"
          FLASK_TESTING: "true"
          FLASK_ENV: "development"

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage.xml
          fail_ci_if_error: false
          verbose: true

      # Publish coverage.xml from the 3.12 matrix entry as an artifact so the
      # downstream sonarcloud job can pick it up without re-running the test
      # suite. Mirrors the InkyPi pattern (coverage-3.12 → SonarCloud Scan).
      - name: Upload coverage artifact for SonarCloud
        if: matrix.python-version == '3.12'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-3.12
          path: coverage.xml
          retention-days: 1

  frontend:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: receiver/frontend/package-lock.json

      - name: Install dependencies
        run: cd receiver/frontend && npm ci

      - name: Run frontend tests
        run: cd receiver/frontend && npm test

      - name: Run frontend lint
        run: cd receiver/frontend && npm run lint

      - name: Run type check
        run: cd receiver/frontend && npm run type-check

  lint:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install linters
        run: |
          python -m pip install --upgrade pip
          pip install flake8

      - name: Run flake8
        run: |
          flake8 receiver/ tests/ --max-line-length=120 --ignore=W503,W504,E402

  security:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install security tools
        run: |
          python -m pip install --upgrade pip
          pip install bandit pip-audit

      - name: Run Bandit security linter
        run: |
          bandit -r receiver/ -ll --skip B101

      - name: Check dependencies for vulnerabilities
        run: |
          pip-audit -r receiver/requirements.txt

  type-check:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r receiver/requirements.txt
          pip install mypy types-requests types-Flask types-python-dateutil

      - name: Run mypy
        run: |
          mypy receiver/ --ignore-missing-imports --disable-error-code=misc --disable-error-code=valid-type --disable-error-code=var-annotated --disable-error-code=arg-type --disable-error-code=assignment --disable-error-code=operator --disable-error-code=no-any-return --disable-error-code=attr-defined

  test-postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: volt
          POSTGRES_PASSWORD: testpass
          POSTGRES_DB: volt_tracker_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U volt -d volt_tracker_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r receiver/requirements.txt
          pip install -r receiver/requirements-dev.txt
          pip install psycopg2-binary

      - name: Run tests against PostgreSQL
        run: |
          python -m pytest tests/test_models.py tests/test_api.py tests/test_concurrency.py tests/test_transactions.py -v --tb=short
        env:
          DATABASE_URL: "postgresql://volt:testpass@localhost:5432/volt_tracker_test"
          FLASK_TESTING: "true"
          FLASK_ENV: "development"

  sonarcloud:
    name: SonarCloud Scan
    needs: [test, frontend]
    if: always() && (github.event_name == 'push' || github.event.pull_request.head.repo.fork == false)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # required for git blame in SonarCloud

      # Reuse coverage produced by the test job's 3.12 matrix entry instead
      # of re-running pytest here. Mirrors the InkyPi pattern.
      - name: Download Python coverage
        uses: actions/download-artifact@v4
        with:
          name: coverage-3.12
        continue-on-error: true

      # Frontend coverage is fast (~1s of vitest) so generating it inline
      # here is simpler than plumbing a separate artifact through the
      # frontend job.
      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: receiver/frontend/package-lock.json
      - name: Install frontend dependencies
        run: npm ci
        working-directory: receiver/frontend
      - name: Run frontend tests with coverage
        run: npm run test:coverage
        working-directory: receiver/frontend

      # E2E coverage (requires Docker services — run locally for now)
      # To collect E2E coverage locally:
      #   INSTRUMENT_COVERAGE=true npm run build --prefix receiver/frontend
      #   docker compose up -d  # start backend
      #   cd e2e && npm run test:coverage
      # The lcov output at e2e/coverage/lcov.info is picked up by SonarCloud automatically.

      - name: SonarCloud Scan
        uses: SonarSource/sonarqube-scan-action@v7
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
