name: Release dry run

on:
  push:
    branches: [release]
  pull_request:
    branches: [main, release]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-dry-run-${{ github.ref }}
  cancel-in-progress: true

jobs:
  semantic-release-dry-run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.11"
      - name: Validate release config
        run: python .github/scripts/check_release_config.py
      - name: Predict release bump
        run: python .github/scripts/semantic_release_dry_run.py
      - name: Verify release-candidate evidence
        env:
          REQUIRE_RELEASE_CANDIDATE_EVIDENCE: "1"
          REQUIRE_READY_TO_TAG: "0"
        run: scripts/check-release-candidate-evidence.sh
