name: Release dry run

on:
  push:
    branches: [release]
  pull_request:
    branches: [main, release]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-dry-run-${{ github.ref }}
  cancel-in-progress: true

jobs:
  semantic-release-dry-run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"
      - name: Validate release config
        run: python .github/scripts/check_release_config.py
      - name: Test release config checks
        run: python -m unittest discover -s .github/scripts -p 'test_*.py'
      - name: Install the release lock
        # Installs .github/requirements-release.txt exactly as the Release
        # workflow's key-holding job does, so a lock that will not install on
        # ubuntu-latest / Python 3.11 fails here instead of on main. It goes
        # into a throwaway venv so nothing else in this job sees the packages.
        run: |
          python -m venv "${RUNNER_TEMP}/release-lock"
          . "${RUNNER_TEMP}/release-lock/bin/activate"
          pip install --only-binary ":all:" --require-hashes -r .github/requirements-release.txt
          semantic-release --version
      - name: Predict release bump
        run: python .github/scripts/semantic_release_dry_run.py
      - name: Verify release-candidate evidence
        env:
          REQUIRE_RELEASE_CANDIDATE_EVIDENCE: "1"
          REQUIRE_READY_TO_TAG: "0"
        run: scripts/check-release-candidate-evidence.sh
