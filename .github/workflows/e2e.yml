name: E2E Tests

on:
  push:
    branches: [main, 'test/**']
  pull_request:
    branches: [main]

env:
  POSTGRES_USER: volt
  POSTGRES_PASSWORD: testpass123
  POSTGRES_DB: volt_tracker
  REDIS_PASSWORD: testpass123
  DASHBOARD_USER: admin
  DASHBOARD_PASSWORD: testpass
  WEBSOCKET_AUTH_ENABLED: 'false'
  RATE_LIMIT_ENABLED: 'false'
  SECRET_KEY: e2e-test-secret-key

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - name: Create .env for docker-compose
        run: |
          cat > .env << EOF
          POSTGRES_USER=${{ env.POSTGRES_USER }}
          POSTGRES_PASSWORD=${{ env.POSTGRES_PASSWORD }}
          POSTGRES_DB=${{ env.POSTGRES_DB }}
          DASHBOARD_USER=${{ env.DASHBOARD_USER }}
          DASHBOARD_PASSWORD=${{ env.DASHBOARD_PASSWORD }}
          WEBSOCKET_AUTH_ENABLED=false
          RATE_LIMIT_ENABLED=false
          SECRET_KEY=${{ env.SECRET_KEY }}
          REDIS_PASSWORD=${{ env.REDIS_PASSWORD }}
          FLASK_ENV=development
          EOF

      - name: Start application stack
        run: |
          docker compose up -d --build --wait
          # Wait for healthy state
          for i in $(seq 1 30); do
            if curl -sf http://localhost:8080/health > /dev/null 2>&1; then
              echo "App is healthy"
              break
            fi
            echo "Waiting for app... ($i/30)"
            sleep 2
          done

      - name: Seed test data
        run: |
          docker compose exec -T db psql -U ${{ env.POSTGRES_USER }} -d ${{ env.POSTGRES_DB }} < e2e/seed/seed-data.sql

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Playwright
        working-directory: e2e
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Run E2E tests
        working-directory: e2e
        env:
          BASE_URL: http://localhost:8080
          DASHBOARD_USER: admin
          DASHBOARD_PASSWORD: testpass
        run: npx playwright test

      - name: Upload test artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            e2e/playwright-report/
            e2e/test-results/
          retention-days: 7

      - name: Stop application stack
        if: always()
        run: docker compose down -v
