name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '20 14 * * 1'
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  packages: read
  security-events: write

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: actions
            build-mode: none
          - language: javascript-typescript
            build-mode: none
          - language: java-kotlin
            build-mode: manual
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        if: matrix.language == 'java-kotlin'
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        if: matrix.language == 'java-kotlin'
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: mobile/android/dashboard-tests/package-lock.json

      - uses: github/codeql-action/init@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}

      - name: Build Java/Kotlin for CodeQL
        if: matrix.language == 'java-kotlin'
        working-directory: mobile/android
        run: |
          chmod +x ./gradlew
          # CodeQL only needs the compiler invocations (its Kotlin/Java extractors hook
          # javac/kotlinc), not dex/merge/package — assembleDebug spent ~1-1.5 min on those.
          # --no-build-cache is load-bearing: a FROM-CACHE compile task never runs the
          # compiler, so CodeQL would silently extract no Java/Kotlin at all.
          ./gradlew --no-daemon --no-build-cache :app:compileDebugKotlin :app:compileDebugJavaWithJavac

      - uses: github/codeql-action/analyze@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          category: "/language:${{ matrix.language }}"
