name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '20 14 * * 1'
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  packages: read
  security-events: write

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: actions
            build-mode: none
          - language: javascript-typescript
            build-mode: none
          - language: java-kotlin
            build-mode: manual
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        if: matrix.language == 'java-kotlin'
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: matrix.language == 'java-kotlin'
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: mobile/android/dashboard-tests/package-lock.json

      - uses: github/codeql-action/init@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}

      - name: Build Java/Kotlin for CodeQL
        if: matrix.language == 'java-kotlin'
        working-directory: mobile/android
        run: |
          chmod +x ./gradlew
          # CodeQL only needs the compiler invocations (its Kotlin/Java extractors hook
          # javac/kotlinc), not dex/merge/package — assembleDebug spent ~1-1.5 min on those.
          # --no-build-cache is load-bearing: a FROM-CACHE compile task never runs the
          # compiler, so CodeQL would silently extract no Java/Kotlin at all.
          ./gradlew --no-daemon --no-build-cache :app:compileDebugKotlin :app:compileDebugJavaWithJavac

      - uses: github/codeql-action/analyze@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          category: "/language:${{ matrix.language }}"
