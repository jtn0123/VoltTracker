name: Privacy scan

on:
  pull_request:
    paths:
      - '**'
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  privacy-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
      - name: Run privacy scanner
        run: python3 mobile/android/tools/privacy-scan.py
      - name: Self-test privacy scanner
        run: python3 mobile/android/tools/privacy-scan.py --self-test
