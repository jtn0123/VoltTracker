name: Privacy scan

on:
  pull_request:
    paths:
      - '**'
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  privacy-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - name: Run privacy scanner
        run: python3 mobile/android/tools/privacy-scan.py
      - name: Self-test privacy scanner
        run: python3 mobile/android/tools/privacy-scan.py --self-test
