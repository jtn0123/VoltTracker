name: Privacy scan

on:
  pull_request:
    paths:
      - '**'
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  privacy-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Run privacy scanner
        run: python3 mobile/android/tools/privacy-scan.py
      - name: Self-test privacy scanner
        run: python3 mobile/android/tools/privacy-scan.py --self-test
