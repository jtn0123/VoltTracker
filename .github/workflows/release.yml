name: Release

# Conventional-commits-driven release pipeline modeled on jtn0123/InkyPi.
#
# On every push to main, python-semantic-release inspects commits since the
# last tag. If any commit subject starts with `feat:` (minor), `fix:`/`perf:`
# (patch), or carries a `BREAKING CHANGE:` footer (major), it bumps the
# version in pyproject.toml + VERSION, tags `vX.Y.Z`, and cuts a GitHub
# Release. Chore/docs/ci/refactor/style/test/build/revert PRs do NOT bump —
# the "no release cut" step below surfaces those skips loudly so a streak of
# unreleased PRs doesn't go silently unnoticed.
#
# The rolling `latest-debug` release published from android.yml continues to
# update on every main push regardless of whether a tagged release was cut.

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    if: github.repository == 'jtn0123/VoltTracker'
    outputs:
      released: ${{ steps.resolve_tag.outputs.released }}
      tag: ${{ steps.resolve_tag.outputs.tag }}
    concurrency:
      group: release
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          # python-semantic-release needs the full history to walk commits
          # since the last tag and decide the bump type.
          fetch-depth: 0
          # We push the version-bump commit + tag back to protected main. The
          # default GITHUB_TOKEN cannot bypass the main ruleset (GitHub does
          # not allow the Actions app as a ruleset bypass actor on user-owned
          # repos), so the checkout authenticates with the write deploy key
          # stored in RELEASE_PUSH_DEPLOY_KEY — deploy keys are the ruleset's
          # bypass actor.
          ssh-key: ${{ secrets.RELEASE_PUSH_DEPLOY_KEY }}
          # Deploy-key pushes DO trigger workflows (unlike GITHUB_TOKEN), and
          # that is by design: the bump-commit push re-runs android.yml so the
          # rolling latest-debug APK gets the new versionName baked in. It
          # can't loop releases: the bump commit's subject ("X.Y.Z") is not a
          # bumpable conventional-commits type, so the retriggered release run
          # cuts nothing.
          persist-credentials: true

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"

      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: '21'

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: |
            mobile/android/dashboard-tests/package-lock.json
            mobile/android/dashboard-e2e/package-lock.json

      - name: Validate release config
        run: python .github/scripts/check_release_config.py

      - name: Install release dashboard e2e deps
        working-directory: mobile/android/dashboard-e2e
        run: npm ci

      - name: Install release Playwright Chromium + OS deps
        # release-preflight.sh runs verifyActiveApp, which includes the
        # Playwright dashboard e2e checks. The normal Android CI installs the
        # browser binary first; the release lane needs the same runtime setup.
        working-directory: mobile/android/dashboard-e2e
        run: npx playwright install --with-deps chromium

      - name: Release preflight
        env:
          REQUIRE_RELEASE_CANDIDATE_EVIDENCE: "1"
        run: ./scripts/release-preflight.sh

      - name: Install python-semantic-release
        run: pip install python-semantic-release==9.21.1

      - name: Semantic Release — version & publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          semantic-release version
          semantic-release publish

      - name: Resolve released tag
        id: resolve_tag
        run: |
          TAG=$(
            git tag --points-at HEAD \
              | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+([-.][0-9A-Za-z.-]+)?$' \
              | sort -V \
              | tail -n1 \
              || true
          )
          if [ -n "${TAG}" ]; then
            echo "released=true" >> "$GITHUB_OUTPUT"
            echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
            echo "Release tag: ${TAG}"
          else
            echo "released=false" >> "$GITHUB_OUTPUT"
            echo "tag=" >> "$GITHUB_OUTPUT"
            echo "No new release tag on this run."
          fi

      - name: Warn loudly if no release was cut
        if: steps.resolve_tag.outputs.released != 'true'
        run: |
          # python-semantic-release exits 0 even when the merged commit
          # doesn't match a bumpable conventional-commits type. Without a
          # surface like this, a streak of non-bumping PRs (chore/docs/ci)
          # silently piles up — InkyPi hit this with 5 unreleased PRs in a
          # row before adding the warning.
          SUBJECT=$(git log -1 --pretty=%s)
          {
            echo "## No release cut"
            echo ""
            echo "\`semantic-release version\` found no bumpable commits since"
            echo "the last tag. Most recent commit subject:"
            echo ""
            echo "    ${SUBJECT}"
            echo ""
            echo "If this merge included user-facing changes, the PR title"
            echo "probably didn't use a conventional-commits type that"
            echo "triggers a bump (\`feat:\`, \`fix:\`, \`perf:\`, or a"
            echo "\`BREAKING CHANGE:\` footer)."
          } >> "$GITHUB_STEP_SUMMARY"
          # Workflow command bodies must URL-encode %, CR, and LF so subjects
          # like "bump coverage to 90%" don't render garbled in the annotation.
          ESCAPED=${SUBJECT//%/%25}
          ESCAPED=${ESCAPED//$'\r'/%0D}
          ESCAPED=${ESCAPED//$'\n'/%0A}
          echo "::warning title=No release cut::semantic-release skipped this commit; subject: ${ESCAPED}"
          # Non-failing on purpose — chore/docs/ci PRs legitimately skip
          # release, so we only surface the info rather than failing the run.

      - name: Strip build-only files from GitHub release
        if: steps.resolve_tag.outputs.released == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # `VERSION` is listed in pyproject.toml's [tool.semantic_release]
          # assets so PSR commits it alongside the bump, but the same config
          # uploads it as a release download. Users don't install VERSION —
          # it lives in the repo — so drop it from the release listing.
          TAG="${{ steps.resolve_tag.outputs.tag }}"
          for asset in VERSION; do
            if gh release view "${TAG}" --repo "${{ github.repository }}" \
                 --json assets --jq '.assets[].name' \
                 | grep -Fxq "${asset}"; then
              gh release delete-asset "${TAG}" "${asset}" \
                --repo "${{ github.repository }}" --yes
              echo "Removed ${asset} from release ${TAG}"
            fi
          done

  build-release-apk:
    name: Build and attach Android APKs
    needs: release
    if: needs.release.outputs.released == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    defaults:
      run:
        working-directory: mobile/android
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          # Check out the tagged commit, not whatever HEAD is now — keeps the
          # APK byte-for-byte tied to the release tag.
          ref: ${{ needs.release.outputs.tag }}
          persist-credentials: false

      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: '21'

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: |
            mobile/android/dashboard-tests/package-lock.json
            mobile/android/dashboard-e2e/package-lock.json

      - name: Decode release keystore from secrets (dev-mode fallback)
        id: keystore
        # Recreates the keystore + keystore.properties that
        # mobile/android/app/build.gradle's signingConfigs.release block looks
        # for. With all four secrets set, tagged releases ship the stable-key
        # signed release APK. With none set (solo dev mode), the job publishes
        # only the debug APK — signed with the runner's throwaway debug key —
        # instead of failing the release. A partial secret set is still a hard
        # error: that is misconfiguration, not a mode.
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          missing=()
          for name in ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD; do
            if [ -z "${!name}" ]; then
              missing+=("${name}")
            fi
          done
          if [ "${#missing[@]}" -eq 4 ]; then
            echo "signed=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=Dev-mode release (no signing secrets)::Publishing the debug APK only, signed with the runner's throwaway Android debug key."
            exit 0
          fi
          if [ "${#missing[@]}" -gt 0 ]; then
            echo "::error title=Incomplete release signing secrets::${missing[*]} missing while other signing secrets are set — configure all four or none."
            exit 1
          fi
          # storeFile in keystore.properties is resolved relative to the
          # :app project's directory, not rootProject — so the path is just
          # "release.keystore" and the actual file lives at app/release.keystore.
          # Don't echo the base64 (it would land in the run log); use --decode
          # from a heredoc instead.
          printf '%s' "${ANDROID_KEYSTORE_BASE64}" | base64 --decode > app/release.keystore
          cat > keystore.properties <<EOF
          storeFile=release.keystore
          storePassword=${ANDROID_KEYSTORE_PASSWORD}
          keyAlias=${ANDROID_KEY_ALIAS}
          keyPassword=${ANDROID_KEY_PASSWORD}
          EOF
          # Sanity-check the keystore decoded into a real PKCS12 file.
          # keytool exits non-zero if the password is wrong or the file is
          # corrupt — fail fast rather than producing a broken APK.
          keytool -list -keystore app/release.keystore \
            -storepass "${ANDROID_KEYSTORE_PASSWORD}" >/dev/null
          echo "signed=true" >> "$GITHUB_OUTPUT"
          echo "Keystore decoded; release build will be signed."

      - name: Assemble release and debug APKs
        # Signed mode builds both variants. Dev mode skips :app:assembleRelease:
        # without a signingConfig the release variant comes out unsigned, and
        # Android refuses to install unsigned APKs.
        run: |
          chmod +x ./gradlew
          # The job checks out the tag after semantic-release creates it, so
          # use the checked-out tag commit in the in-app version suffix.
          TAG_SHA="$(git rev-parse HEAD)"
          if [ "${{ steps.keystore.outputs.signed }}" = "true" ]; then
            GITHUB_SHA="${TAG_SHA}" ./gradlew --no-daemon :app:assembleRelease :app:assembleDebug
          else
            GITHUB_SHA="${TAG_SHA}" ./gradlew --no-daemon :app:assembleDebug
          fi

      - name: Stage APKs (version-tagged flavor filenames)
        run: |
          mkdir -p release
          TAG="${{ needs.release.outputs.tag }}"
          DEBUG_SRC="app/build/outputs/apk/debug/app-debug.apk"
          DEBUG_NAME="volttracker-${TAG}-debug.apk"
          cp "${DEBUG_SRC}" "release/${DEBUG_NAME}"
          echo "Staged: ${DEBUG_NAME}"
          if [ "${{ steps.keystore.outputs.signed }}" = "true" ]; then
            RELEASE_SRC="app/build/outputs/apk/release/app-release.apk"
            RELEASE_NAME="volttracker-${TAG}-release.apk"
            if [ ! -f "${RELEASE_SRC}" ]; then
              echo "::error title=Signed release APK missing::Expected ${RELEASE_SRC}; release signing may be broken."
              exit 1
            fi
            cp "${RELEASE_SRC}" "release/${RELEASE_NAME}"
            echo "Staged: ${RELEASE_NAME}"
          fi

      - name: Update release install notes (signed)
        if: steps.keystore.outputs.signed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ needs.release.outputs.tag }}"
          gh release view "${TAG}" --repo "${{ github.repository }}" \
            --json body --jq '.body // ""' > release/body.md
          START="<!-- volttracker-android-apks:start -->"
          END="<!-- volttracker-android-apks:end -->"
          awk -v start="${START}" -v end="${END}" '
            $0 == start { skip = 1; next }
            $0 == end { skip = 0; next }
            !skip { print }
          ' release/body.md > release/body.clean.md
          mv release/body.clean.md release/body.md
          cat >> release/body.md <<EOF

          ${START}
          ## Android APKs

          - \`volttracker-${TAG}-release.apk\` is the normal signed release build.
          - \`volttracker-${TAG}-debug.apk\` is the debuggable field build signed with the same stable app key as the release APK, so it can update tagged release installs while still allowing \`adb run-as\` and richer debugging.
          ${END}
          EOF
          gh release edit "${TAG}" --repo "${{ github.repository }}" \
            --notes-file release/body.md

      - name: Update release install notes (dev mode)
        if: steps.keystore.outputs.signed != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ needs.release.outputs.tag }}"
          gh release view "${TAG}" --repo "${{ github.repository }}" \
            --json body --jq '.body // ""' > release/body.md
          START="<!-- volttracker-android-apks:start -->"
          END="<!-- volttracker-android-apks:end -->"
          awk -v start="${START}" -v end="${END}" '
            $0 == start { skip = 1; next }
            $0 == end { skip = 0; next }
            !skip { print }
          ' release/body.md > release/body.clean.md
          mv release/body.clean.md release/body.md
          cat >> release/body.md <<EOF

          ${START}
          ## Android APKs

          - \`volttracker-${TAG}-debug.apk\` is a dev-mode debug build: release signing secrets are not configured, so it is signed with the CI runner's throwaway Android debug key. Each release run generates a fresh key, so the in-app updater can download this APK but Android may reject the install over an existing install — back up in-app data, uninstall, install, and restore when that happens.
          ${END}
          EOF
          gh release edit "${TAG}" --repo "${{ github.repository }}" \
            --notes-file release/body.md

      - name: Attach APK to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ needs.release.outputs.tag }}"
          gh release view "${TAG}" --repo "${{ github.repository }}" \
            --json assets --jq '.assets[].name' \
            | grep -E '^(app-(release(-unsigned)?|debug)\.apk|volttracker-'"${TAG}"'(-unsigned)?\.apk|volttracker-'"${TAG}"'-field-diagnostics-debuggable.*\.apk)$' \
            > release/legacy-assets.txt || true
          while read -r asset; do
            if [ -n "${asset}" ]; then
                gh release delete-asset "${TAG}" "${asset}" \
                  --repo "${{ github.repository }}" --yes
                echo "Removed legacy release asset ${asset}"
            fi
          done < release/legacy-assets.txt
          gh release upload "${TAG}" release/*.apk \
            --repo "${{ github.repository }}" \
            --clobber

      - name: Remove keystore artifacts from runner
        # Belt-and-braces cleanup. The runner is ephemeral so this is mostly
        # symbolic, but it keeps the keystore + plaintext password out of any
        # post-job step that might archive the workspace.
        if: always()
        run: |
          rm -f app/release.keystore keystore.properties
