name: Android emulator smoke

# STATUS: ADVISORY (not a required check) — intentionally, for now.
#
# This job runs on dashboard/startup PRs (see the path filter below) and weekly,
# but it is deliberately NOT part of the `ci-success` aggregate in
# android.yml. Branch protection requires only `ci-success`, which needs
# [unit-tests, dashboard-tests] — so a red emulator-smoke does NOT block merges
# today. That is on purpose until the emulator lane proves stable on CI
# hardware (emulator boots / KVM availability are historically flaky).
#
# TEST CONTRACT: the smoke's pass signal is the exact logcat line
# "dashboard handshake received" (emitted by MainActivity.onDashboardReady,
# grepped in scripts/emulator-smoke.sh). Renaming that log silently neuters this
# job — change both sides in the same commit. See that script's header and
# mobile/android/docs/data-model.md.
#
# PROMOTING TO REQUIRED (do this once the lane has been green/stable for a
# stretch of dashboard PRs):
#   1. Add `emulator-smoke` to the `needs:` list of the `ci-success` job in
#      .github/workflows/android.yml, AND add a
#      `needs.emulator-smoke.result == "success"` check there.
#      NOTE: because this job is path-filtered, on a PR that does NOT touch the
#      dashboard the job is SKIPPED, not run. A naive `!= "success"` check would
#      then fail `ci-success` on every unrelated PR. Treat "skipped" as a pass
#      (e.g. allow result in (success, skipped)) before wiring it in.
#   2. Once `ci-success` reliably reflects this job, no branch-protection edit is
#      needed — protection already requires only `ci-success`.
# Until both are done, leave this job advisory.

on:
  schedule:
    - cron: '30 14 * * 1'
  workflow_dispatch:
  # Also run on PRs that touch the dashboard or the WebView startup wiring — the exact
  # surface where a regression can leave the dashboard loading but its JS silently dead
  # (the file:// ES-module class of bug). Other PRs skip the emulator job.
  pull_request:
    paths:
      - 'mobile/android/app/src/main/dashboard-src/**'
      - 'mobile/android/app/src/main/assets/dashboard/**'
      - 'mobile/android/app/src/main/java/com/volttracker/obdpoc/WebViewBootstrap.java'
      - 'mobile/android/app/src/main/java/com/volttracker/obdpoc/MainActivity.java'
      - 'mobile/android/app/src/main/java/com/volttracker/obdpoc/VoltBridge.java'
      - '.github/workflows/android-emulator-smoke.yml'
      - 'mobile/android/scripts/emulator-smoke.sh'

concurrency:
  group: android-emulator-smoke-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  emulator-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654 # v5.2.0
        with:
          distribution: temurin
          java-version: '17'
      - name: Build debug APK
        working-directory: mobile/android
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon --configuration-cache :app:assembleDebug
      - name: Enable KVM
        # Hardware acceleration for the x86_64 emulator on ubuntu-latest.
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Launch app and assert the dashboard JS comes alive
        uses: reactivecircus/android-emulator-runner@e89f39f1abbbd05b1113a29cf4db69e7540cae5a # v2.37.0
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          emulator-options: -no-window -no-audio -no-snapshot -no-boot-anim -gpu swiftshader_indirect
          # The action runs `script` line-by-line, so the multi-line poll lives in a real script
          # file (also makes it shellcheck-able and locally testable). It installs the APK, launches
          # the app, and asserts the dashboard's JS->native handshake reaches logcat — the file://
          # dead-JS class of bug shows up as the absence of that line, which a crash-only scan misses.
          script: bash mobile/android/scripts/emulator-smoke.sh
      - name: Upload emulator smoke logcat
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: emulator-smoke-logcat
          path: mobile/android/build/emulator-smoke-logcat.txt
          if-no-files-found: ignore
