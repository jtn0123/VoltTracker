name: Android emulator smoke

# STATUS: SUPPLEMENTAL scheduled/manual smoke. The per-PR smoke lives in
# `.github/workflows/android.yml` (`emulator-smoke`, part of `ci-success`).
#
# This job intentionally does not run on PRs: runtime PRs already boot an emulator through
# android.yml. It runs the SAME session (scripts/emulator-session.sh: the Compose + classic
# shell smoke, then the instrumented tests) on a different screen profile (pixel_6), weekly
# and on demand, so hosted-emulator drift shows up between PRs and repeat runs give a flake
# rate. Failures on main open a `ci-failure` issue (ci-failure-alert.yml).
#
# TEST CONTRACT: the smoke's pass signals are exact logcat strings — the classic dashboard's
# "dashboard handshake received" (MainActivity.DASHBOARD_READY_LOG) and the Compose launcher's
# VoltStartup marks (StartupTrace.COMPOSE_SCREEN / COMPOSE_FIRST_TELEMETRY), grepped in
# scripts/emulator-smoke.sh. EmulatorSmokeContractTest pins both sides; see that script's header
# and mobile/android/docs/data-model.md.
#
on:
  schedule:
    - cron: '30 14 * * 1'
  workflow_dispatch:

concurrency:
  group: android-emulator-smoke-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  emulator-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Pin Android user directory
        # Same as android.yml: keep AGP debug signing in one place across emulator setup.
        run: echo "ANDROID_USER_HOME=$RUNNER_TEMP/volttracker-android" >> "$GITHUB_ENV"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '21'
      # Node is needed because preBuild runs verifyDashboardNodeVersion and buildDashboardJs
      # (esbuild). Without it the runner's default Node 22 failed that check and this lane
      # was red every Monday from 2026-08-10 without anyone seeing it.
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: mobile/android/dashboard-tests/package-lock.json
      - name: Build debug APK and instrumented-test APK
        working-directory: mobile/android
        env:
          # Stadia Maps basemap key -> BuildConfig.STADIA_API_KEY. An unset/empty secret is
          # fine: the app builds and runs, the maps just draw no tiles.
          STADIA_API_KEY: ${{ secrets.STADIA_API_KEY }}
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon --configuration-cache :app:assembleDebug :app:assembleDebugAndroidTest
      - name: Enable KVM
        # Hardware acceleration for the x86_64 emulator on ubuntu-latest.
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run the emulator session (Compose + classic smoke, instrumented tests)
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          pre-emulator-launch-script: bash mobile/android/scripts/install-emulator-diagnostics.sh
          emulator-options: -no-window -no-audio -no-snapshot -no-boot-anim -gpu swangle
          # One line on purpose: the action runs `script:` line by line through separate dash
          # shells. See the same step in android.yml.
          script: bash mobile/android/scripts/emulator-session.sh
      - name: Upload emulator smoke artifacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: emulator-smoke-artifacts
          path: |
            mobile/android/build/emulator-smoke-logcat.txt
            mobile/android/build/emulator-session-logcat.txt
            mobile/android/build/emulator-instrumentation.txt
            mobile/android/build/emulator-process/
            mobile/android/build/emulator-smoke/
          if-no-files-found: ignore
