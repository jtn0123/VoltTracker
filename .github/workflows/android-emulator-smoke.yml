name: Android emulator smoke

# STATUS: SUPPLEMENTAL scheduled/manual smoke. The per-PR WebView smoke lives in
# `.github/workflows/android.yml` (informational; not part of `ci-success`).
#
# This job intentionally does not run on PRs: dashboard/startup PRs already boot
# an emulator through the `emulator-smoke` job in android.yml. Keeping
# this lane scheduled/manual avoids a second slow emulator run and still leaves
# an on-demand artifact source for investigating hosted-emulator drift.
#
# TEST CONTRACT: the smoke's pass signal is the exact logcat line
# "dashboard handshake received" (emitted by MainActivity.onDashboardReady,
# grepped in scripts/emulator-smoke.sh). Renaming that log silently neuters this
# job — change both sides in the same commit. See that script's header and
# mobile/android/docs/data-model.md.
#
on:
  schedule:
    - cron: '30 14 * * 1'
  workflow_dispatch:

concurrency:
  group: android-emulator-smoke-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  emulator-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '21'
      # Node is needed because preBuild runs verifyDashboardNodeVersion and buildDashboardJs
      # (esbuild). Without it the runner's default Node 22 failed that check and this lane
      # was red every Monday from 2026-08-10 without anyone seeing it.
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: mobile/android/dashboard-tests/package-lock.json
      - name: Build debug APK
        working-directory: mobile/android
        env:
          # Stadia Maps basemap key -> BuildConfig.STADIA_API_KEY. An unset/empty secret is
          # fine: the app builds and runs, the maps just draw no tiles.
          STADIA_API_KEY: ${{ secrets.STADIA_API_KEY }}
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon --configuration-cache :app:assembleDebug
      - name: Enable KVM
        # Hardware acceleration for the x86_64 emulator on ubuntu-latest.
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Launch app and assert the dashboard JS comes alive
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          emulator-options: -no-window -no-audio -no-snapshot -no-boot-anim -gpu swangle
          # The action runs `script` line-by-line, so the multi-line poll lives in a real script
          # file (also makes it shellcheck-able and locally testable). It installs the APK, launches
          # the app, asserts the dashboard's JS->native handshake reaches logcat, starts demo
          # telemetry, taps through the bottom nav, and captures screenshot/logcat artifacts.
          script: bash mobile/android/scripts/emulator-smoke.sh
      - name: Upload emulator smoke artifacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: emulator-smoke-artifacts
          path: |
            mobile/android/build/emulator-smoke-logcat.txt
            mobile/android/build/emulator-smoke/
          if-no-files-found: ignore
