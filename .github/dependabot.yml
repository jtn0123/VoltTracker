# Active project is the Android app at mobile/android/.
version: 2
updates:
  - package-ecosystem: "gradle"
    directory: "/mobile/android"
    schedule:
      interval: "weekly"
    groups:
      androidx:
        patterns:
          - "androidx.*"
      test-deps:
        patterns:
          - "junit:*"
          - "org.json:*"
          - "org.robolectric:*"
  - package-ecosystem: "npm"
    directory: "/mobile/android/dashboard-tests"
    schedule:
      interval: "weekly"
  - package-ecosystem: "npm"
    directory: "/mobile/android/dashboard-e2e"
    schedule:
      interval: "weekly"
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
