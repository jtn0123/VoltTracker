# Active project is the Android app at mobile/android/.
version: 2
updates:
  - package-ecosystem: "gradle"
    directory: "/mobile/android"
    schedule:
      interval: "weekly"
    groups:
      androidx:
        patterns:
          - "androidx.*"
      test-deps:
        patterns:
          - "junit:*"
          - "org.json:*"
          - "org.robolectric:*"
  - package-ecosystem: "npm"
    directory: "/mobile/android/dashboard-tests"
    schedule:
      interval: "weekly"
    # The @typescript/native alias supplies TS 7 for type-checking. Keep TS 6
    # under its normal name for typescript-eslint's compiler API dependency.
    ignore:
      - dependency-name: "typescript"
        update-types:
          - "version-update:semver-major"
  - package-ecosystem: "npm"
    directory: "/mobile/android/dashboard-e2e"
    schedule:
      interval: "weekly"
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    # github/codeql-action ships as four separate sub-actions - init,
    # autobuild, analyze and upload-sarif - and CodeQL fails unless every
    # step in a workflow is on the same version. One PR per sub-action can
    # therefore never go green. Group them so the family moves together.
    groups:
      codeql-action:
        patterns:
          - "github/codeql-action*"
