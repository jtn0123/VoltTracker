<!doctype html>
<html lang="en" data-accent="volt" data-ambient="on" data-density="comfortable">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Volt Tracker</title>
<meta name="theme-color" content="#08080c" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@300;400;500;600;700&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="anonymous" />
<link rel="stylesheet" href="/static/v2/app/app.css?v=20260520-map-fullscreen" />
<style>
  html, body { margin: 0; height: 100%; background: #08080c; color: #f5f3ec; font-family: 'Geist', system-ui, sans-serif; -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale; }
  body { overflow: hidden; overscroll-behavior: none; touch-action: manipulation; }
  #root { width: 100%; height: 100%; }
  .vt-boot {
    position: fixed; inset: 0;
    display: grid; place-items: center;
    background: #08080c;
    color: #62626a;
    font-family: 'Geist Mono', monospace; font-size: 11px;
    letter-spacing: 0.22em; text-transform: uppercase;
  }
  .vt-boot::before {
    content: ''; display: block;
    width: 28px; height: 28px;
    margin-bottom: 14px;
    border: 2px solid rgba(230, 255, 58, 0.16);
    border-top-color: #e6ff3a;
    border-radius: 50%;
    animation: vt-spin .9s linear infinite;
  }
  .vt-boot div { display: flex; flex-direction: column; align-items: center; }
  @keyframes vt-spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>
  <div id="root"><div class="vt-boot"><div>booting volt tracker</div></div></div>

  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin="anonymous"></script>

  <script src="/static/v2/shared/mock-data.js?v=20260520-map-fullscreen"></script>
  <script type="text/babel" src="/static/v2/tweaks-panel.jsx?v=20260520-map-fullscreen"></script>
  <script type="text/babel" src="/static/v2/app/components.jsx?v=20260520-map-fullscreen"></script>
  <script type="text/babel" src="/static/v2/app/screens.jsx?v=20260520-map-fullscreen"></script>
  <script type="text/babel" src="/static/v2/app/screens-extra.jsx?v=20260520-map-fullscreen"></script>
  <script type="text/babel" src="/static/v2/app/app.jsx?v=20260520-map-fullscreen"></script>
</body>
</html>
