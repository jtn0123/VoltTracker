# Enabled so Robolectric's test-only AndroidX deps resolve; the app's own code uses no AndroidX.
android.useAndroidX=true
android.nonTransitiveRClass=true
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
# Configuration cache: skips the configuration phase on unchanged builds (warm reuse ~2s vs ~28s).
# CI already ran every task with --configuration-cache; this makes the local default match. All
# tasks (incl. the dashboard Exec tasks and the file-reading verify* tasks) are compatible.
org.gradle.configuration-cache=true
# Task-level parallelism and the local build cache: parallel lets decoupled tasks (dashboard
# Exec tasks, lint, unit tests) run concurrently; caching reuses task outputs across branch
# switches and clean builds. Both are safe with the configuration cache above.
org.gradle.parallel=true
org.gradle.caching=true
