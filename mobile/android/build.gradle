// Split budget (C2/G4): startup JS/CSS is what affects first paint, so it gets
// the tightest budget. Non-DTC lazy support chunks (map, troubleshooter, demo,
// and secondary action groups) are still bounded, but they no longer crowd the
// startup number. DTC lookup tables remain a separate lazy reference-data bucket.
// See docs/bundle-budget.md.
def dashboardStartupBudgetBytes = 360_000L
def dashboardLazySupportBudgetBytes = 90_000L
def dashboardLazyPanelBudgetBytes = 45_000L
def dashboardLazyCssBudgetBytes = 20_000L
def dashboardDtcDataBudgetBytes = 380_000L
def dashboardLazyPanelFiles = ["js/insights-panel.js"]
def dashboardDtcDataFiles = ["js/dtc-lookup.js", "js/dtc-causes.js"]
// Lazy-injected stylesheets are NOT render-blocking links in index.template.html:
// screens-map.css is injected by the lazy map chunk (map.ts#ensureMapStyles) and
// troubleshooter.css by the lazy troubleshooter chunk, so neither costs the
// Drive-first startup path. They get their own ceiling below instead of crowding
// the startup number, mirroring the lazy JS split.
def dashboardLazyCssFiles = ["css/screens-map.css", "css/troubleshooter.css"]
def dashboardStartupAssets = files(new File(dashboardAssetDir, "js/app.js"), fileTree(dashboardAssetDir) {
    include "css/**/*.css"
    dashboardLazyCssFiles.each { exclude it }
})
def dashboardLazyCssAssets = files(dashboardLazyCssFiles.collect { new File(dashboardAssetDir, it) })
def dashboardLazySupportAssets = files(fileTree(dashboardAssetDir) {
    include "js/**/*.js"
    exclude "js/app.js"
    dashboardLazyPanelFiles.each { exclude it }
    dashboardDtcDataFiles.each { exclude it }
})
def dashboardLazyPanelAssets = files(dashboardLazyPanelFiles.collect { new File(dashboardAssetDir, it) })
def dashboardDtcDataAssets = files(dashboardDtcDataFiles.collect { new File(dashboardAssetDir, it) })
def dashboardEagerJsAssets = files(new File(dashboardAssetDir, "js/app.js"))
def dashboardLazyJsAssets = files(fileTree(dashboardAssetDir) {
    include "js/**/*.js"
    exclude "js/app.js"
})
def dashboardCssAssets = files(fileTree(dashboardAssetDir) { include "css/**/*.css" })
def dashboardLeafletAssets = files(fileTree(dashboardAssetDir) { include "lib/leaflet/**" })
def dashboardGeneratedHtmlAssets = files(new File(dashboardAssetDir, "index.html"))
def sumBytes = { assets ->
    assets.files.findAll { it.exists() }.sum { it.length() } ?: 0L
}
def commandOutput = { List<String> command ->
    try {
        def proc = new ProcessBuilder(command).redirectErrorStream(true).start()
        def text = proc.inputStream.getText("UTF-8").trim()
        proc.waitFor()
        return proc.exitValue() == 0 ? text : "unavailable (${text})"
    } catch (Exception ignored) {
        return "unavailable"
    }
}
def majorVersionOrNull = { String version ->
    def parts = (version ?: "").tokenize(".")
    if (parts.empty || !(parts[0] ==~ /\d+/)) {
        return null
    }
    return parts[0] as int
}
def startupBenchmarkDeviceStatusCache = null
def startupBenchmarkDeviceStatus = {
    if (startupBenchmarkDeviceStatusCache != null) {
        return startupBenchmarkDeviceStatusCache
    }
    def candidates = []
    def androidHome = System.getenv("ANDROID_HOME") ?: System.getenv("ANDROID_SDK_ROOT")
    if (androidHome) {
        candidates.add(new File(new File(androidHome), "platform-tools/adb").absolutePath)
    }
    candidates.add("adb")
    for (candidate in candidates.unique()) {
        try {
            def proc = new ProcessBuilder(candidate, "devices").redirectErrorStream(true).start()
            def output = proc.inputStream.getText("UTF-8").trim()
            proc.waitFor()
            if (proc.exitValue() == 0) {
                def devices = output.readLines()
                        .drop(1)
                        .collect { it.trim() }
                        .findAll { it }
                def ready = devices.findAll { it ==~ /.+\s+device$/ }
                startupBenchmarkDeviceStatusCache = [
                        adb: candidate,
                        output: output,
                        devices: devices,
                        readyDevices: ready,
                        readySerial: ready ? ready[0].split(/\s+/)[0] : "",
                        hasReadyDevice: !ready.isEmpty()]
                return startupBenchmarkDeviceStatusCache
            }
        } catch (Exception ignored) {
            // Try the next adb candidate.
        }
    }
    startupBenchmarkDeviceStatusCache = [
            adb: "unavailable",
            output: "adb unavailable",
            devices: [],
            readyDevices: [],
            readySerial: "",
            hasReadyDevice: false]
    return startupBenchmarkDeviceStatusCache
}
def startupBenchmarkReportDir = layout.buildDirectory.dir("reports/startup-benchmark-local")
def writeStartupBenchmarkLocalReport = { String status ->
    def reportDir = startupBenchmarkReportDir.get().asFile
    reportDir.mkdirs()
    def deviceStatus = startupBenchmarkDeviceStatus()
    def benchmarkArtifactRoots = [
            file("startup-benchmark/build/outputs/connected_android_test_additional_output"),
            file("startup-benchmark/build/reports/androidTests/connected")]
    def files = benchmarkArtifactRoots.findAll { it.exists() }.collectMany { root ->
        fileTree(root) {
                include "**/*.json"
                include "**/*.trace"
                include "**/*.perfetto-trace"
                include "**/*.txt"
                include "**/*.html"
            }.files.findAll { it.isFile() }
    }.sort { it.absolutePath }
    def jsonFiles = files.findAll { it.name.endsWith(".json") }
    def metricLines = []
    jsonFiles.each { jsonFile ->
        try {
            def parsed = new groovy.json.JsonSlurper().parse(jsonFile)
            def benchmarks = parsed instanceof Map ? parsed.benchmarks : null
            if (benchmarks instanceof Collection) {
                benchmarks.each { benchmark ->
                    def name = benchmark.name ?: benchmark.className ?: jsonFile.name
                    def metrics = benchmark.metrics instanceof Map ? benchmark.metrics : [:]
                    metrics.each { metricName, value ->
                        if (value instanceof Map) {
                            def summary = ["minimum", "median", "maximum", "min", "max", "p50", "p90", "p95"]
                                    .findAll { value.containsKey(it) }
                                    .collect { "${it}=${value[it]}" }
                                    .join(", ")
                            if (summary) {
                                metricLines.add("- `${name}` `${metricName}`: ${summary}")
                            }
                        }
                    }
                }
            }
        } catch (Exception ignored) {
            // Keep the report useful even if an AndroidX output shape changes.
        }
    }
    def summary = new File(reportDir, "summary.md")
    summary.text = """# Local Startup Benchmark

Status: `${status}`

Command:

```sh
./gradlew verifyStartupPerformanceOptional --no-configuration-cache
```

ADB: `${deviceStatus.adb}`

Ready devices:

${deviceStatus.readyDevices ? deviceStatus.readyDevices.collect { "- `${it}`" }.join("\n") : "- none"}

Raw `adb devices` output:

```text
${deviceStatus.output ?: "(empty)"}
```

Benchmark metrics:

${metricLines ? metricLines.join("\n") : "- No parsed Macrobenchmark metric JSON found yet."}

Benchmark artifact files:

${files ? files.collect { "- `${project.relativePath(it)}`" }.join("\n") : "- No startup-benchmark artifacts found yet."}
"""
}

tasks.register("verifyDashboardNodeVersion") {
    description = "Fails early when dashboard tooling is not running on Node 22.x."
    doLast {
        def override = ["1", "true", "yes"].contains((System.getenv(unsupportedNodeOverrideEnv) ?: "").toLowerCase())
        def version = commandOutput(["node", "-p", "process.versions.node"])
        if (version.startsWith("unavailable")) {
            throw new GradleException(
                    "Node.js ${requiredNodeMajor}.x is required for dashboard tooling. " +
                            "Install/use Node ${requiredNodeMajor} (repo .nvmrc/.node-version) and retry.")
        }
        def major = majorVersionOrNull(version)
        if (major == null) {
            throw new GradleException(
                    "Node.js ${requiredNodeMajor}.x is required for dashboard tooling; found ${version}. " +
                            "Run `nvm use` from the repo root.")
        }
        if (major != requiredNodeMajor && !override) {
            throw new GradleException(
                    "Node.js ${requiredNodeMajor}.x is required for dashboard tooling; found ${version}. " +
                            "Run `nvm use` from the repo root, or set ${unsupportedNodeOverrideEnv}=1 for a temporary local override.")
        }
        if (major != requiredNodeMajor) {
            logger.warn("Using unsupported Node ${version} because ${unsupportedNodeOverrideEnv} is set.")
        }
    }
}

