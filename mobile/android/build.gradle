// Split budget (C2/G4): startup JS/CSS is what affects first paint, so it gets
// the tightest budget. Non-DTC lazy support chunks (map, troubleshooter, demo,
// and secondary action groups) are still bounded, but they no longer crowd the
// startup number. DTC lookup tables remain a separate lazy reference-data bucket.
// See docs/bundle-budget.md.
// 360k → 364k (design pass 4): funds the @font-face + display-voice rules and
// the motion vocabulary (view-enter, accent crossfades). The Space Grotesk
// woff2 itself is font-display:swap and NOT render-blocking, so it stays out
// of this bucket by design.
// 364k → 370k (design pass 5): funds the "Polished" visual refresh — contained
// live-card hero, bordered live-readout tiles, energy-bar charge rows, the
// segmented preference control, the diagnostics breathing dot, and the map
// sheet/scrubber/history-row restyle. All CSS (loads directly, no minify step).
// 370k → 372k (design pass 6): funds the "minimal" flatten pass (veiled/flat
// cards, bare-column stat rows, neutralized diagnostics tints, flat nav) plus
// the live-signals "reporting" filter default (small telemetry.ts/core.ts JS).
// 372k → 373.5k (bug-hunt passes 1-2): irreducible growth from ~30 correctness
// fixes across the eager app.js bundle (null-guards, memo keys, demo isolation,
// numeric-pref commit refactor) plus a global light-scheme high-contrast a11y
// token block in base.css (cannot be lazy-loaded). ~945 B headroom retained.
// 373.5k → 396k (v2 design handoff): funds the v2 interaction layer — swipe
// tab navigation + directional slide/stagger motion (core.ts + base.css), the
// DTC detail bottom sheet + Mode 03/07/02 scan narration (storage-status.ts +
// components.css), the Drive trip-energy strip, proportional charge-row kWh
// bars, and the trip-sheet speed/stops additions. All eager CSS ships raw
// (no minify step) and the sheet/scan markup rides the eager bundle.
// ~890 B headroom retained.
// 396k → 404k (v2 fidelity pass, 2026-07-08): funds the design's card-stack
// rework — Drive This-trip card + slim session/health footer, charge hero
// progress treatment, per-layer map legends, insights temp-vs-range scatter,
// skeleton chart placeholders, and action-confirmation toasts. All eager
// Drive/Charge-first chrome (CSS ships raw). ~3.6 KB headroom retained.
// 404k → 412k (v2 deep alignment, 2026-07-09): funds the full tab-by-tab
// design match — cell-balance deviation heatmap + toggle, layered card
// depth (--shadow-card), Drive/enhanced signal tile grids, segmented map
// layer control, recovery-card tone borders, inset savings/session rows,
// and the week-chart/eff-bars renderer options. Eager CSS ships raw.
// ~3.6 KB headroom retained.
