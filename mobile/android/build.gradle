plugins {
    // AGP and Spotless versions live in gradle/libs.versions.toml (the single source of truth).
    // Kotlin needs no plugin here: AGP 9.0+ compiles Kotlin via its built-in support.
    alias(libs.plugins.android.application) apply false
    alias(libs.plugins.android.test) apply false
    alias(libs.plugins.spotless) apply false
    alias(libs.plugins.test.retry) apply false
    alias(libs.plugins.detekt) apply false
    id "com.github.ben-manes.versions" version "0.54.0"
}

tasks.named("dependencyUpdates").configure {
    rejectVersionIf {
        ["alpha", "beta", "rc", "cr", "m", "preview", "b", "ea"].any { qualifier ->
            it.candidate.version ==~ /(?i).*[.-]${qualifier}[.\d-+]*/
        }
    }
}

def dashboardTestsDir = file("dashboard-tests")
def dashboardE2eDir = file("dashboard-e2e")
def dashboardAssetDir = file("app/src/main/assets/dashboard")
def requiredNodeMajor = 22
def unsupportedNodeOverrideEnv = "VOLTTRACKER_ALLOW_UNSUPPORTED_NODE"
def productionJavaStragglers = fileTree("app/src/main/java") {
    include "**/*.java"
}
def dashboardSourceJsStragglers = fileTree("app/src/main/dashboard-src/js") {
    include "**/*.js"
}
// Split budget (C2/G4): startup JS/CSS is what affects first paint, so it gets
// the tightest budget. Non-DTC lazy support chunks (map, troubleshooter, demo,
// and secondary action groups) are still bounded, but they no longer crowd the
// startup number. DTC lookup tables remain a separate lazy reference-data bucket.
// See docs/bundle-budget.md.
def dashboardStartupBudgetBytes = 360_000L
def dashboardLazySupportBudgetBytes = 90_000L
def dashboardLazyPanelBudgetBytes = 45_000L
def dashboardDtcDataBudgetBytes = 380_000L
def dashboardLazyPanelFiles = ["js/insights-panel.js"]
def dashboardDtcDataFiles = ["js/dtc-lookup.js", "js/dtc-causes.js"]
def dashboardStartupAssets = files(new File(dashboardAssetDir, "js/app.js"), fileTree(dashboardAssetDir) { include "css/**/*.css" })
def dashboardLazySupportAssets = files(fileTree(dashboardAssetDir) {
    include "js/**/*.js"
    exclude "js/app.js"
    dashboardLazyPanelFiles.each { exclude it }
    dashboardDtcDataFiles.each { exclude it }
})
def dashboardLazyPanelAssets = files(dashboardLazyPanelFiles.collect { new File(dashboardAssetDir, it) })
def dashboardDtcDataAssets = files(dashboardDtcDataFiles.collect { new File(dashboardAssetDir, it) })
def dashboardEagerJsAssets = files(new File(dashboardAssetDir, "js/app.js"))
def dashboardLazyJsAssets = files(fileTree(dashboardAssetDir) {
    include "js/**/*.js"
    exclude "js/app.js"
})
def dashboardCssAssets = files(fileTree(dashboardAssetDir) { include "css/**/*.css" })
def dashboardLeafletAssets = files(fileTree(dashboardAssetDir) { include "lib/leaflet/**" })
def dashboardGeneratedHtmlAssets = files(new File(dashboardAssetDir, "index.html"))
def sumBytes = { assets ->
    assets.files.findAll { it.exists() }.sum { it.length() } ?: 0L
}
def commandOutput = { List<String> command ->
    try {
        def proc = new ProcessBuilder(command).redirectErrorStream(true).start()
        def text = proc.inputStream.getText("UTF-8").trim()
        proc.waitFor()
        return proc.exitValue() == 0 ? text : "unavailable (${text})"
    } catch (Exception ignored) {
        return "unavailable"
    }
}
def majorVersionOrNull = { String version ->
    def parts = (version ?: "").tokenize(".")
    if (parts.empty || !(parts[0] ==~ /\d+/)) {
        return null
    }
    return parts[0] as int
}

tasks.register("verifyDashboardNodeVersion") {
    description = "Fails early when dashboard tooling is not running on Node 22.x."
    doLast {
        def override = ["1", "true", "yes"].contains((System.getenv(unsupportedNodeOverrideEnv) ?: "").toLowerCase())
        def version = commandOutput(["node", "-p", "process.versions.node"])
        if (version.startsWith("unavailable")) {
            throw new GradleException(
                    "Node.js ${requiredNodeMajor}.x is required for dashboard tooling. " +
                            "Install/use Node ${requiredNodeMajor} (repo .nvmrc/.node-version) and retry.")
        }
        def major = majorVersionOrNull(version)
        if (major == null) {
            throw new GradleException(
                    "Node.js ${requiredNodeMajor}.x is required for dashboard tooling; found ${version}. " +
                            "Run `nvm use` from the repo root.")
        }
        if (major != requiredNodeMajor && !override) {
            throw new GradleException(
                    "Node.js ${requiredNodeMajor}.x is required for dashboard tooling; found ${version}. " +
                            "Run `nvm use` from the repo root, or set ${unsupportedNodeOverrideEnv}=1 for a temporary local override.")
        }
        if (major != requiredNodeMajor) {
            logger.warn("Using unsupported Node ${version} because ${unsupportedNodeOverrideEnv} is set.")
        }
    }
}

tasks.register("dashboardNpmCi", Exec) {
    description = "Installs dashboard test dependencies from package-lock.json."
    dependsOn("verifyDashboardNodeVersion")
    workingDir = dashboardTestsDir
    commandLine "npm", "ci"
    inputs.file(file("${dashboardTestsDir}/package.json"))
    inputs.file(file("${dashboardTestsDir}/package-lock.json"))
    outputs.dir(file("${dashboardTestsDir}/node_modules"))
}

// Compiles the editable dashboard TypeScript source (app/src/main/dashboard-src/js) into the shipped,
// gitignored bundle (app/src/main/assets/dashboard/js) via esbuild. Wired into preBuild
// so `:app:assembleDebug` always packages a fresh bundle; up-to-date when the source is
// unchanged. Requires Node (the dashboard toolchain), so CI Android jobs set up Node.
tasks.register("buildDashboardJs", Exec) {
    description = "Bundles dashboard TypeScript source into assets/dashboard/js with esbuild."
    dependsOn("dashboardNpmCi")
    workingDir = dashboardTestsDir
    commandLine "npm", "run", "build"
    inputs.dir(file("app/src/main/dashboard-src/js"))
    inputs.file(file("${dashboardTestsDir}/build.mjs"))
    outputs.dir(file("app/src/main/assets/dashboard/js"))
    outputs.dir(file("app/src/main/assets/dashboard/lib/leaflet"))
}

tasks.register("dashboardTest", Exec) {
    description = "Runs dashboard Vitest coverage for the shipped WebView assets."
    dependsOn("dashboardNpmCi")
    workingDir = dashboardTestsDir
    commandLine "npm", "run", "test:coverage"
}

tasks.register("dashboardLint", Exec) {
    description = "Runs dashboard TypeScript lint."
    dependsOn("dashboardNpmCi")
    workingDir = dashboardTestsDir
    commandLine "npm", "run", "lint"
}

tasks.register("dashboardTypecheck", Exec) {
    description = "Type-checks the dashboard TypeScript source."
    dependsOn("dashboardNpmCi")
    workingDir = dashboardTestsDir
    commandLine "npm", "run", "typecheck"
}

tasks.register("dashboardE2eNpmCi", Exec) {
    description = "Installs Playwright dashboard e2e dependencies from package-lock.json."
    dependsOn("verifyDashboardNodeVersion")
    workingDir = dashboardE2eDir
    commandLine "npm", "ci"
    inputs.file(file("${dashboardE2eDir}/package.json"))
    inputs.file(file("${dashboardE2eDir}/package-lock.json"))
    outputs.dir(file("${dashboardE2eDir}/node_modules"))
}

tasks.register("dashboardE2e", Exec) {
    description = "Runs Playwright functional tests against the shipped dashboard."
    dependsOn("dashboardE2eNpmCi", "buildDashboardJs")
    workingDir = dashboardE2eDir
    commandLine "npm", "test"
}

tasks.register("verifyGeneratedDashboardClean") {
    description = "Fails when generated dashboard HTML is stale relative to dashboard-src."
    def srcDir = file("app/src/main/dashboard-src")
    def outFile = file("app/src/main/assets/dashboard/index.html")
    def reportDir = file("build/reports/dashboard-html-diff")
    inputs.dir(srcDir)
    outputs.dir(reportDir)
    doLast {
        def sb = new StringBuilder()
        new File(srcDir, "index.template.html").eachLine("UTF-8") { line ->
            def m = (line =~ /^\s*<!-- include: (\S+) -->\s*$/)
            if (m.find()) {
                sb.append(new File(srcDir, m.group(1)).getText("UTF-8").replaceAll(/\s+$/, ""))
            } else {
                sb.append(line)
            }
            sb.append("\n")
        }
        def expected = sb.toString().replaceAll(/\n+$/, "") + "\n"
        def current = outFile.exists() ? outFile.getText("UTF-8") : ""
        if (current != expected) {
            reportDir.mkdirs()
            new File(reportDir, "expected-index.html").setText(expected, "UTF-8")
            new File(reportDir, "current-index.html").setText(current, "UTF-8")
            new File(reportDir, "README.txt").setText(
                    "Generated dashboard HTML drifted. expected-index.html is generated from " +
                            "app/src/main/dashboard-src; current-index.html is the committed asset.\n",
                    "UTF-8")
            outFile.setText(expected, "UTF-8")
            throw new GradleException(
                    "Generated dashboard HTML was stale. Re-run ./gradlew generateDashboardHtml " +
                            "and include app/src/main/assets/dashboard/index.html. Diff inputs written to " +
                            "${reportDir}.")
        }
    }
}

tasks.register("verifyDashboardBundleSize") {
    description = "Fails when dashboard startup, lazy support, or DTC data exceeds its size budget."
    // Measures the BUILT bundle (app.js + lazy chunks), so it must build first.
    dependsOn("buildDashboardJs")
    inputs.files(dashboardStartupAssets, dashboardLazySupportAssets, dashboardLazyPanelAssets, dashboardDtcDataAssets)
    doLast {
        def startupBytes = sumBytes(dashboardStartupAssets)
        def lazySupportBytes = sumBytes(dashboardLazySupportAssets)
        def lazyPanelBytes = sumBytes(dashboardLazyPanelAssets)
        def dtcBytes = sumBytes(dashboardDtcDataAssets)
        if (startupBytes > dashboardStartupBudgetBytes) {
            throw new GradleException(
                    "Dashboard startup JS/CSS is ${startupBytes} bytes, over budget ${dashboardStartupBudgetBytes} bytes")
        }
        if (lazySupportBytes > dashboardLazySupportBudgetBytes) {
            throw new GradleException(
                    "Dashboard lazy support JS is ${lazySupportBytes} bytes, over budget ${dashboardLazySupportBudgetBytes} bytes")
        }
        if (lazyPanelBytes > dashboardLazyPanelBudgetBytes) {
            throw new GradleException(
                    "Dashboard lazy panel JS is ${lazyPanelBytes} bytes, over budget ${dashboardLazyPanelBudgetBytes} bytes")
        }
        if (dtcBytes > dashboardDtcDataBudgetBytes) {
            throw new GradleException(
                    "DTC data bundle is ${dtcBytes} bytes, over budget ${dashboardDtcDataBudgetBytes} bytes")
        }
        logger.lifecycle(
                "Dashboard startup JS/CSS: ${startupBytes} bytes (budget ${dashboardStartupBudgetBytes}); " +
                        "lazy support JS: ${lazySupportBytes} bytes (budget ${dashboardLazySupportBudgetBytes}); " +
                        "lazy panel JS: ${lazyPanelBytes} bytes (budget ${dashboardLazyPanelBudgetBytes}); " +
                        "DTC data: ${dtcBytes} bytes (budget ${dashboardDtcDataBudgetBytes})")
    }
}

tasks.register("dashboardAssetReport") {
    description = "Prints dashboard asset byte counts and bundle-budget headroom."
    dependsOn("buildDashboardJs", ":app:generateDashboardHtml")
    inputs.files(dashboardEagerJsAssets, dashboardLazyJsAssets, dashboardCssAssets, dashboardLeafletAssets, dashboardGeneratedHtmlAssets)
    doLast {
        def startupBytes = sumBytes(dashboardStartupAssets)
        def lazySupportBytes = sumBytes(dashboardLazySupportAssets)
        def lazyPanelBytes = sumBytes(dashboardLazyPanelAssets)
        def dtcBytes = sumBytes(dashboardDtcDataAssets)
        logger.lifecycle("")
        logger.lifecycle("Dashboard asset report")
        logger.lifecycle("----------------------")
        logger.lifecycle(String.format("%-22s %10d bytes", "eager app.js", sumBytes(dashboardEagerJsAssets)))
        logger.lifecycle(String.format("%-22s %10d bytes", "lazy JS chunks", sumBytes(dashboardLazyJsAssets)))
        logger.lifecycle(String.format("%-22s %10d bytes", "CSS", sumBytes(dashboardCssAssets)))
        logger.lifecycle(String.format("%-22s %10d bytes", "Leaflet assets", sumBytes(dashboardLeafletAssets)))
        logger.lifecycle(String.format("%-22s %10d bytes", "generated HTML", sumBytes(dashboardGeneratedHtmlAssets)))
        logger.lifecycle(String.format("%-22s %10d bytes (%d headroom)", "startup budget set", startupBytes, dashboardStartupBudgetBytes - startupBytes))
        logger.lifecycle(String.format("%-22s %10d bytes (%d headroom)", "lazy support budget", lazySupportBytes, dashboardLazySupportBudgetBytes - lazySupportBytes))
        logger.lifecycle(String.format("%-22s %10d bytes (%d headroom)", "lazy panel budget", lazyPanelBytes, dashboardLazyPanelBudgetBytes - lazyPanelBytes))
        logger.lifecycle(String.format("%-22s %10d bytes (%d headroom)", "DTC data budget set", dtcBytes, dashboardDtcDataBudgetBytes - dtcBytes))
        logger.lifecycle("")
    }
}

tasks.register("verifyNoMigrationSourceStragglers") {
    description = "Fails if production Java or dashboard source JavaScript returns after the migration."
    inputs.files(productionJavaStragglers)
    inputs.files(dashboardSourceJsStragglers)
    doLast {
        def productionJava = productionJavaStragglers.files.sort()
        def dashboardSourceJs = dashboardSourceJsStragglers.files.sort()
        if (!productionJava.empty || !dashboardSourceJs.empty) {
            def details = []
            if (!productionJava.empty) {
                details << "Production Android source must stay Kotlin-only; found: " +
                        productionJava.collect { it.path }.join(", ")
            }
            if (!dashboardSourceJs.empty) {
                details << "Dashboard behavior source must stay TypeScript-only; found: " +
                        dashboardSourceJs.collect { it.path }.join(", ")
            }
            throw new GradleException(details.join("\n"))
        }
    }
}

tasks.register("verifyActiveApp") {
    description = "Runs the full local validation suite for the active Android app."
    dependsOn(
            ":app:testDebugUnitTest",
            ":app:lintDebug",
            ":app:spotlessCheck",
            ":app:detekt",
            ":app:assembleDebug",
            ":app:jacocoTestCoverageVerification",
            "dashboardLint",
            "dashboardTypecheck",
            "dashboardTest",
            "dashboardE2e",
            "verifyDashboardBundleSize",
            "verifyNoMigrationSourceStragglers",
            "verifyGeneratedDashboardClean")
}

tasks.register("doctor") {
    description = "Prints local Android/dashboard tool versions and fails on required runtime mismatches."
    doLast {
        def javaVersion = System.getProperty("java.version")
        def nodeVersion = commandOutput(["node", "-p", "process.versions.node"])
        def npmVersion = commandOutput(["npm", "--version"])
        def adbVersion = commandOutput(["adb", "version"]).readLines().take(1).join("")
        def androidHome = System.getenv("ANDROID_HOME") ?: System.getenv("ANDROID_SDK_ROOT") ?: "unset"
        logger.lifecycle("VoltTracker local doctor")
        logger.lifecycle("-------------------------")
        logger.lifecycle("Gradle JVM: ${javaVersion}")
        logger.lifecycle("Node: ${nodeVersion}")
        logger.lifecycle("npm: ${npmVersion}")
        logger.lifecycle("Android SDK: ${androidHome}")
        logger.lifecycle("adb: ${adbVersion}")
        def nodeMajor = majorVersionOrNull(nodeVersion)
        if (nodeMajor != requiredNodeMajor) {
            throw new GradleException(
                    "Node.js ${requiredNodeMajor}.x is required for dashboard tooling; found ${nodeVersion}. " +
                            "Run `nvm use` from the repo root.")
        }
    }
}

// Fast inner-loop tier (I5): the subset of verifyActiveApp that catches the mistakes you make
// while editing — formatting, static analysis, broken Kotlin/dashboard logic — WITHOUT the two
// slow steps: the Playwright e2e run (dashboardE2e, which boots a browser) and the full
// :app:assembleDebug (R8/resource packaging). Run this on every change; run the heavier
// verifyActiveApp before pushing for full CI parity. Deliberately omits assemble, lint, jacoco
// verification, e2e, and the bundle-size/straggler gates — those belong to the pre-push tier.
tasks.register("verifyFast") {
    description = "Fast inner-loop checks: spotless + detekt + unit tests + dashboard lint/typecheck/test (no e2e/assemble)."
    dependsOn(
            ":app:spotlessCheck",
            ":app:detekt",
            ":app:testDebugUnitTest",
            "dashboardLint",
            "dashboardTypecheck",
            "dashboardTest")
}

tasks.register("verifyPerformance") {
    description = "Performance-focused validation: dashboard budgets/tests plus Android unit performance regressions."
    dependsOn(
            "dashboardAssetReport",
            "verifyDashboardBundleSize",
            "dashboardTest",
            ":app:testDebugUnitTest")
}

tasks.register("verifyStartupPerformance") {
    description = "Runs the opt-in on-device Macrobenchmark cold-start/dashboard-ready suite. Requires a connected API 29+ device/emulator."
    dependsOn(":startup-benchmark:connectedCheck")
}

subprojects {
    plugins.withId("com.android.application") {
        tasks.named("check") {
            dependsOn(
                    rootProject.tasks.named("dashboardTest"),
                    rootProject.tasks.named("dashboardLint"),
                    rootProject.tasks.named("dashboardTypecheck"),
                    rootProject.tasks.named("verifyDashboardBundleSize"),
                    rootProject.tasks.named("verifyNoMigrationSourceStragglers"),
                    rootProject.tasks.named("verifyGeneratedDashboardClean"))
        }
    }
}
