        def startupBytes = sumBytes(dashboardStartupAssets)
        def lazySupportBytes = sumBytes(dashboardLazySupportAssets)
        def lazyPanelBytes = sumBytes(dashboardLazyPanelAssets)
        def lazyExpertBytes = sumBytes(dashboardLazyExpertAssets)
        def lazyDetailBytes = sumBytes(dashboardLazyDetailAssets)
        def lazyCssBytes = sumBytes(dashboardLazyCssAssets)
        def dtcBytes = sumBytes(dashboardDtcDataAssets)
        logger.lifecycle("")
        logger.lifecycle("Dashboard asset report")
        logger.lifecycle("----------------------")
        logger.lifecycle(String.format("%-22s %10d bytes", "eager app.js", sumBytes(dashboardEagerJsAssets)))
        logger.lifecycle(String.format("%-22s %10d bytes", "lazy JS chunks", sumBytes(dashboardLazyJsAssets)))
        logger.lifecycle(String.format("%-22s %10d bytes", "CSS", sumBytes(dashboardCssAssets)))
        logger.lifecycle(String.format("%-22s %10d bytes", "Leaflet assets", sumBytes(dashboardLeafletAssets)))
        logger.lifecycle(String.format("%-22s %10d bytes", "generated HTML", sumBytes(dashboardGeneratedHtmlAssets)))
        logger.lifecycle(String.format("%-22s %10d bytes (%d headroom)", "startup budget set", startupBytes, dashboardStartupBudgetBytes - startupBytes))
        logger.lifecycle(String.format("%-22s %10d bytes (%d headroom)", "lazy support budget", lazySupportBytes, dashboardLazySupportBudgetBytes - lazySupportBytes))
        logger.lifecycle(String.format("%-22s %10d bytes (%d headroom)", "lazy panel budget", lazyPanelBytes, dashboardLazyPanelBudgetBytes - lazyPanelBytes))
        logger.lifecycle(String.format("%-22s %10d bytes (%d headroom)", "lazy expert budget", lazyExpertBytes, dashboardLazyExpertBudgetBytes - lazyExpertBytes))
        logger.lifecycle(String.format("%-22s %10d bytes (%d headroom)", "lazy detail budget", lazyDetailBytes, dashboardLazyDetailBudgetBytes - lazyDetailBytes))
        logger.lifecycle(String.format("%-22s %10d bytes (%d headroom)", "lazy CSS budget", lazyCssBytes, dashboardLazyCssBudgetBytes - lazyCssBytes))
        logger.lifecycle(String.format("%-22s %10d bytes (%d headroom)", "DTC data budget set", dtcBytes, dashboardDtcDataBudgetBytes - dtcBytes))
        logger.lifecycle("")
    }
}

tasks.register("verifyNoMigrationSourceStragglers") {
    description = "Fails if production Java or dashboard source JavaScript returns after the migration."
    inputs.files(productionJavaStragglers)
    inputs.files(dashboardSourceJsStragglers)
    doLast {
        def productionJava = productionJavaStragglers.files.sort()
        def dashboardSourceJs = dashboardSourceJsStragglers.files.sort()
        if (!productionJava.empty || !dashboardSourceJs.empty) {
            def details = []
            if (!productionJava.empty) {
                details << "Production Android source must stay Kotlin-only; found: " +
                        productionJava.collect { it.path }.join(", ")
            }
            if (!dashboardSourceJs.empty) {
                details << "Dashboard behavior source must stay TypeScript-only; found: " +
                        dashboardSourceJs.collect { it.path }.join(", ")
            }
            throw new GradleException(details.join("\n"))
        }
    }
}

def nulCheckedSourceFiles = fileTree(file("app/src")) {
    include "**/*.kt"
    include "**/*.java"
    include "**/*.ts"
    include "**/*.js"
    include "**/*.html"
    include "**/*.css"
    include "**/*.xml"
    exclude "**/build/**"
    exclude "main/assets/dashboard/**"
}

tasks.register("verifyNoNulSourceBytes") {
    description = "Fails when editable app/test source contains a literal NUL byte."
    inputs.files(nulCheckedSourceFiles)
    doLast {
        def offenders = nulCheckedSourceFiles.files.findAll { source ->
            source.bytes.any { value -> value == 0 }
        }.sort()
        if (!offenders.empty) {
            throw new GradleException(
                    "Source files must use escaped NUL literals (for example \\u0000), not raw bytes; found: " +
                            offenders.collect { it.path }.join(", "))
        }
    }
}

tasks.register("privacyScan", Exec) {
    description = "Fails when tracked files contain unallowlisted VIN, GPS route, or private device endpoint data."
    dependsOn("buildDashboardJs", ":app:generateDashboardHtml")
    workingDir = repoRootDir
    commandLine "python3", "mobile/android/tools/privacy-scan.py"
    inputs.files(fileTree(repoRootDir) {
        include "README.md"
        include "SECURITY.md"
        include "CONTRIBUTING.md"
        include "docs/**"
        include ".github/**"
        include "mobile/android/**"
        exclude "**/build/**"
        exclude "**/node_modules/**"
        exclude "mobile/android/dashboard-tests/coverage/**"
        // Generated, gitignored outputs of :buildDashboardJs. The scanner walks git-tracked
        // files itself, so it never reads these; declaring them as inputs only creates an
        // undeclared producer/consumer link that Gradle 9.6+ fails the build over.
        exclude "mobile/android/app/src/main/assets/dashboard/js/**"
        exclude "mobile/android/app/src/main/assets/dashboard/lib/leaflet/**"
    })
    inputs.file(file("tools/privacy-scan.py"))
    inputs.file(file("tools/privacy-scan-allowlist.txt"))
}

tasks.register("verifyPrivacyScanSelfTest", Exec) {
