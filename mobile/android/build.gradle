tasks.register("verifyStartupPerformanceOptional") {
    description = "Runs startup Macrobenchmark when an authorized Android device/emulator is attached; otherwise writes a local skip report."
    outputs.dir(startupBenchmarkReportDir)
    outputs.upToDateWhen { false }
    doLast {
        def deviceStatus = startupBenchmarkDeviceStatus()
        if (!deviceStatus.hasReadyDevice) {
            writeStartupBenchmarkLocalReport("skipped-no-ready-device")
            logger.lifecycle("Skipping startup Macrobenchmark: no authorized Android device/emulator from `${deviceStatus.adb} devices`.")
            logger.lifecycle("Startup benchmark local report: ${startupBenchmarkReportDir.get().asFile}/summary.md")
            return
        }
        def procBuilder = new ProcessBuilder("./gradlew", "--no-daemon", "verifyStartupPerformance", "--no-configuration-cache")
                .directory(projectDir)
                .redirectErrorStream(true)
        if (deviceStatus.readySerial) {
            procBuilder.environment().put("ANDROID_SERIAL", deviceStatus.readySerial)
        }
        if (System.getenv(unsupportedNodeOverrideEnv)) {
            procBuilder.environment().put(unsupportedNodeOverrideEnv, System.getenv(unsupportedNodeOverrideEnv))
        }
        def proc = procBuilder.start()
        proc.inputStream.eachLine { logger.lifecycle(it) }
        proc.waitFor()
        if (proc.exitValue() != 0) {
            throw new GradleException("verifyStartupPerformance failed with exit code ${proc.exitValue()}")
        }
        writeStartupBenchmarkLocalReport("completed")
        logger.lifecycle("Startup benchmark local report: ${startupBenchmarkReportDir.get().asFile}/summary.md")
    }
}

subprojects {
    plugins.withId("com.android.application") {
        tasks.named("check") {
            dependsOn(
                    rootProject.tasks.named("dashboardTest"),
                    rootProject.tasks.named("dashboardLint"),
                    rootProject.tasks.named("dashboardTypecheck"),
                    rootProject.tasks.named("verifyDashboardBundleSize"),
                    rootProject.tasks.named("verifyNoMigrationSourceStragglers"),
                    rootProject.tasks.named("verifyGeneratedDashboardClean"))
        }
    }
}
