apply plugin: "jacoco"

jacoco {
    toolVersion = "0.8.14"
}

// Shared coverage inputs for the report + verification tasks below. Both javac outputs
// (for generated stubs / any Java interop) and Kotlin debug outputs are measured, and
// source roots are mapped so Kotlin production code is held to the ratcheting floors.
def coverageFileFilter = ["**/R.class", "**/R\$*.class", "**/BuildConfig.*", "**/Manifest*.*"]
def coverageClassDirs = {
    files([
        fileTree(dir: "${project.layout.buildDirectory.get()}/intermediates/javac/debug/compileDebugJavaWithJavac/classes", excludes: coverageFileFilter),
        // AGP 9 built-in Kotlin emits here (not the old kotlin-android tmp/kotlin-classes path).
        fileTree(dir: "${project.layout.buildDirectory.get()}/intermediates/built_in_kotlinc/debug/compileDebugKotlin/classes", excludes: coverageFileFilter),
    ])
}
def coverageSourceDirs = {
    files(["${project.projectDir}/src/main/java", "${project.projectDir}/src/main/kotlin"])
}
def coverageExecData = {
    fileTree(dir: project.layout.buildDirectory.get(), includes: ["jacoco/testDebugUnitTest.exec"])
}

tasks.register("jacocoTestReport", JacocoReport) {
    dependsOn "testDebugUnitTest"
    reports {
        xml.required = true
        html.required = true
    }
    sourceDirectories.setFrom(coverageSourceDirs())
    classDirectories.setFrom(coverageClassDirs())
    executionData.setFrom(coverageExecData())
}

// Coverage floors are RATCHETING regression baselines, not goals. Bump them up
// when the suite improves; never lower without discussion in the PR description.
//
// History: (labels like "D4" are improvement-item IDs from the grade-codebase
// audit pass that drove each change — the convention root CONTRIBUTING.md asks
// commits to cite. The audit reports themselves are gitignored, so the
// plain-language description next to each entry is the durable record; see
// docs/reports-index.md.)
//   2026-05-22 (round 1): project LINE 0.43, data/ LINE 0.70 (set after the
//   first 38-item grade-codebase pass; actual was ~48% project / ~76% data).
//   2026-05-22 (round 2, D4): project LINE 0.71, data/ LINE 0.89. Set after the
//   second pass added engine, recorder, backup round-trip, materializer, and
//   query-plan tests. Actual at the time: 73.7% project / 91.9% data. Each
//   floor is `actual − 2 pts` to absorb minor refactor churn.
//   2026-06-06 (round 3): project LINE 0.80, data/ LINE 0.90. Set after the full
//   Java→Kotlin test conversion plus new VoltBridge (14→80%), DeviceCatalog
//   (23→84%), BackupController (48→73%), ElmConnection (35→63%), and
//   TroubleshooterBridge coverage. Actual: 82.7% project / 92.2% data.
//   2026-06-07 (round 4, D4 — per-package coverage floors): added FOCUSED
//   per-package LINE floors for the high-value,
//   pure-logic packages so a regression there can't hide behind the aggregate
//   project floor (a 38%-covered framework class averaged against an 87% one).
//   We deliberately do NOT add a blanket element="CLASS" rule: several classes
//   are framework-bound and legitimately near-zero (SdpProbe ~8%, LogcatMirror
//   ~0%, raw Bluetooth socket paths, MainActivity$obdReceiver), so a CLASS floor
//   would be unworkable. Instead we pin the two packages that are pure,
//   testable domain logic and already very well covered:
//     materialize  LINE 88.9% (386/434) -> floor 0.85 (~actual-4, churn room)
//     classify     LINE 100%  (86/86)   -> floor 0.95 (~actual-5, churn room)
//   Floors are actual-minus-a-margin regression baselines, not goals; raise them
//   as the suites grow, never lower without discussion. (Percentages read from
//   the local jacocoTestReport.xml; adjust by a point or two if a verified run
//   differs.)
//   2026-06-15 (round 5, I2 — focused per-CLASS floors for the new pure-logic
//   feature classes): the v0.15.0 wave landed four pure, WebView-free decision
//   cores in the ROOT package (com.volttracker.obdpoc) and one in the widget
//   subpackage, so they sat under only the 0.80 aggregate project floor — a
//   regression in one would average against ~80 root-package classes and hide.
//   These are exactly the "pure, testable domain logic" the focused floors exist
//   to protect, and they are well covered today, so we pin a per-CLASS LINE floor
//   (~actual-4, churn room) like the materialize/classify package floors. A
//   bare dotted class name matches only that top-level class (its nested data
//   classes / sealed Event subclasses are covered ~100% and ride the project
//   floor):
//     EventNotificationDecider   LINE 95.1% (97/102) -> floor 0.90
//     widget.WidgetStateFormatter LINE 100% (23/23)  -> floor 0.95
//     OnboardingFlow             LINE 100% (26/26)   -> floor 0.95
//     AutoScanController         LINE 82.6% (19/23)  -> floor 0.78
//   2026-06-15 (round 6, D1/D3 — widget per-PACKAGE floor): the D1 tests
//   (WidgetUpdaterTest + VoltWidgetProviderTest) closed the last untested
//   Android-glue gap in the widget package — the merge-under-lock orchestration
//   and the RemoteViews binding. With those landed the whole
//   com.volttracker.obdpoc.widget package is now well covered, so we promote the
//   single WidgetStateFormatter per-CLASS floor to a per-PACKAGE LINE floor that
//   guards the updater + provider + snapshot store too, like the materialize /
//   classify packages. The class-level WidgetStateFormatter rule is kept as-is
//   (a tighter 0.95 on the pure formatter is still useful). Actual at this round:
//     widget  LINE 93.0% (186/200) -> floor 0.89 (~actual-4, churn room)
//   No existing floor is lowered.
tasks.register("jacocoTestCoverageVerification", JacocoCoverageVerification) {
    dependsOn "jacocoTestReport"
    sourceDirectories.setFrom(coverageSourceDirs())
    classDirectories.setFrom(coverageClassDirs())
    executionData.setFrom(coverageExecData())
    violationRules {
        rule {
            element = "PACKAGE"
            includes = ["com.volttracker.obdpoc.data"]
            limit { counter = "LINE"; minimum = 0.90 }
        }
        // Focused floors for the high-value, pure-logic packages (see history
        // note above). These catch a regression in a strong module that the
        // aggregate project floor would otherwise mask.
        rule {
            element = "PACKAGE"
            includes = ["com.volttracker.obdpoc.materialize"]
            limit { counter = "LINE"; minimum = 0.85 }
        }
        rule {
            element = "PACKAGE"
            includes = ["com.volttracker.obdpoc.classify"]
            limit { counter = "LINE"; minimum = 0.95 }
        }
        // Widget package floor (round 6, D3 — see history note above). The D1 tests covered the
        // updater's merge-under-lock orchestration and the provider's RemoteViews binding, so the
        // whole widget package is guarded here like materialize / classify rather than relying on
        // the aggregate project floor. Measured LINE 93.0% (186/200) -> floor 0.89.
        rule {
            element = "PACKAGE"
            includes = ["com.volttracker.obdpoc.widget"]
            limit { counter = "LINE"; minimum = 0.89 }
        }
        // Focused per-CLASS floors for the new pure-logic feature classes (round 5, I2 — see
        // history note above). Each is keyed to the well-tested decision core so a regression
        // can't hide behind the aggregate project floor.
        rule {
            element = "CLASS"
            includes = ["com.volttracker.obdpoc.EventNotificationDecider"]
            limit { counter = "LINE"; minimum = 0.90 }
        }
        rule {
            element = "CLASS"
            includes = ["com.volttracker.obdpoc.widget.WidgetStateFormatter"]
            limit { counter = "LINE"; minimum = 0.95 }
        }
        rule {
            element = "CLASS"
            includes = ["com.volttracker.obdpoc.OnboardingFlow"]
            limit { counter = "LINE"; minimum = 0.95 }
        }
        rule {
            element = "CLASS"
            includes = ["com.volttracker.obdpoc.AutoScanController"]
            limit { counter = "LINE"; minimum = 0.78 }
        }
        // M2 maintenance-overdue evaluator: pure due/overdue math + crossing-signature de-dup, the
        // exact "pure, testable domain logic" the focused floors guard. MaintenanceDueEvaluatorTest
        // exercises every branch; floor set just under the measured line rate for churn room.
        rule {
            element = "CLASS"
            includes = ["com.volttracker.obdpoc.MaintenanceDueEvaluator"]
            limit { counter = "LINE"; minimum = 0.90 }
        }
        rule {
            limit { counter = "LINE"; minimum = 0.80 }
        }
    }
}
