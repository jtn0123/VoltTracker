apply plugin: "jacoco"

jacoco {
    toolVersion = "0.8.14"
}

// Shared coverage inputs for the report + verification tasks below. Both javac outputs
// (for generated stubs / any Java interop) and Kotlin debug outputs are measured, and
// source roots are mapped so Kotlin production code is held to the ratcheting floors.
def coverageFileFilter = ["**/R.class", "**/R\$*.class", "**/BuildConfig.*", "**/Manifest*.*"]
def coverageClassDirs = {
    files([
        fileTree(dir: "${project.layout.buildDirectory.get()}/intermediates/javac/debug/compileDebugJavaWithJavac/classes", excludes: coverageFileFilter),
        // AGP 9 built-in Kotlin emits here (not the old kotlin-android tmp/kotlin-classes path).
        fileTree(dir: "${project.layout.buildDirectory.get()}/intermediates/built_in_kotlinc/debug/compileDebugKotlin/classes", excludes: coverageFileFilter),
    ])
}
def coverageSourceDirs = {
    files(["${project.projectDir}/src/main/java", "${project.projectDir}/src/main/kotlin"])
}
def coverageExecData = {
    fileTree(dir: project.layout.buildDirectory.get(), includes: ["jacoco/testDebugUnitTest.exec"])
}

tasks.register("jacocoTestReport", JacocoReport) {
    dependsOn "testDebugUnitTest"
    reports {
        xml.required = true
        html.required = true
    }
    sourceDirectories.setFrom(coverageSourceDirs())
    classDirectories.setFrom(coverageClassDirs())
    executionData.setFrom(coverageExecData())
}

// Coverage floors are RATCHETING regression baselines, not goals. Bump them up
// when the suite improves; never lower without discussion in the PR description.
//
// History:
//   2026-05-22 (round 1): project LINE 0.43, data/ LINE 0.70 (set after the
//   first 38-item grade-codebase pass; actual was ~48% project / ~76% data).
//   2026-05-22 (round 2, D4): project LINE 0.71, data/ LINE 0.89. Set after the
//   second pass added engine, recorder, backup round-trip, materializer, and
//   query-plan tests. Actual at the time: 73.7% project / 91.9% data. Each
//   floor is `actual − 2 pts` to absorb minor refactor churn.
tasks.register("jacocoTestCoverageVerification", JacocoCoverageVerification) {
    dependsOn "jacocoTestReport"
    sourceDirectories.setFrom(coverageSourceDirs())
    classDirectories.setFrom(coverageClassDirs())
    executionData.setFrom(coverageExecData())
    violationRules {
        rule {
            element = "PACKAGE"
            includes = ["com.volttracker.obdpoc.data"]
            limit { counter = "LINE"; minimum = 0.89 }
        }
        rule {
            limit { counter = "LINE"; minimum = 0.71 }
        }
    }
}
