# VoltTracker detekt configuration. Builds on detekt's bundled defaults
# (buildUponDefaultConfig = true in app/build.gradle), so only deviations live here.
#
# Philosophy: detekt gates the correctness-leaning rule sets — potential-bugs, unused
# code, naming, empty blocks, performance — at zero findings. Formatting (line length,
# import order, wrapping) is ktlint's job via Spotless. The disables below are default
# rules that conflict with deliberate, reviewed idioms in this codebase; each says why.
# Tighten incrementally: prefer re-enabling a rule over growing this list.
#
# Scope: the test tree (src/test) IS part of detekt's source set (see source.setFrom in
# app/build.gradle) and gets the correctness rules; only the complexity thresholds below
# exclude tests, because table-driven test classes are long and repetitive by design.

complexity:
  # RATCHETING THRESHOLDS — production code only (tests are repetitive by design and
  # excluded). Each value is pinned at the current worst offender (named below) so new
  # code cannot exceed it (detekt flags at >= threshold, so each value is worst+1);
  # when a refactor shrinks a hotspot, LOWER the threshold to
  # the new maximum in the same PR. Never raise one without a review conversation.
  ComplexCondition:
    active: true
    threshold: 7 # ObdStoreVehicles.guessMakeFromWmi is 6
    excludes: ['**/src/test/**', '**/src/androidTest/**']
  CyclomaticComplexMethod:
    active: true
    threshold: 98 # ObdElmDecode.nameForCommand (97) — the PID display-name when-table.
    # RATCHETED DOWN from 179 (A1): the Mode-22 PID decoder when-table (178) became the
    # per-command parser map in ObdVoltMode22ParserRegistry (mirroring the A2 move of the
    # standard Mode-01 PIDs, which had already dropped this from 212), so PID dispatch no
    # longer concentrates complexity in one method. LOWER further if nameForCommand becomes
    # a lookup table too.
    excludes: ['**/src/test/**', '**/src/androidTest/**']
  LargeClass:
    active: true
    threshold: 847 # EnhancedPidCatalog = 846 by detekt's LargeClass metric (NOT wc -l).
    # RATCHETED DOWN from 858: the old pin (BackupController at 857) shed its two biggest
    # clusters — progress publishing (percent/ETA math + the throttled worker emitter) into
    # BackupRestoreProgressPresenter, and the staged merge/replace apply (including the
    # replace staging/rollback ladder) into RestoreApplyPipeline — and now measures under
    # 700. The worst class is EnhancedPidCatalog, a PID data table. LOWER further if the
    # catalog's profile rows move to a resource/registry, or as the remaining hotspots
    # (MainActivity, ObdService, ObdPollingEngine) are decomposed.
    excludes: ['**/src/test/**', '**/src/androidTest/**']
  LongMethod:
    active: true
    threshold: 428 # EnhancedPidProfiles.addSensorExpansionProfiles (427) — PID data table
    excludes: ['**/src/test/**', '**/src/androidTest/**']
  LongParameterList:
    active: true
    functionThreshold: 16 # DashboardPayloadJson.restoreProgress (15)
    constructorThreshold: 32 # StorageSummaryRecord (31)
    excludes: ['**/src/test/**', '**/src/androidTest/**']
  NestedBlockDepth:
    active: true
    threshold: 6 # DataBackup.stageRestoreFileWithStatus (5)
    excludes: ['**/src/test/**', '**/src/androidTest/**']
  TooManyFunctions:
    active: true
    thresholdInFiles: 66
    thresholdInClasses: 61 # ObdService (60) is now the worst — RATCHETED DOWN from 64 (A1).
    # Moving MainActivity's ten DiagnosticsCommands forwards (forceStopPackageFromBridge /
    # cancelRetryFromBridge / openBluetoothSettingsFromBridge / getRecentSessionsJson /
    # shareDiagnostics(Digest)FromBridge / startTestConnectionFromBridge / the adapter-ready
    # schedule+cancel pair / openSetupGuideFromBridge) onto DiagnosticsHostDelegate behind a single
    # diagnostics() accessor (the eventNotifications() growth-by-override pattern) dropped
    # MainActivity from 63 -> 54. The worst class is now ObdService (60, measured — the old
    # "ObdService (54)" note here was stale), with MainActivity (54), ObdPollingEngine (45) and
    # ObdLocalStore (44) next, so worst+1 = 61. LOWER further as ObdService / MainActivity are
    # decomposed.
    thresholdInInterfaces: 25 # ObdSessionStore (24)
    thresholdInObjects: 51 # data.ObdStoreSupport (50) — RATCHETED DOWN from 61 (A1). The old
    # pin (ObdProtocol at 60) was stale: after the standard-PID (A2) and Mode-22 (A1) parser
    # tables moved into their registries, ObdProtocol measures 47 functions and the worst
    # object is ObdStoreSupport (50).
    thresholdInEnums: 12
    excludes: ['**/src/test/**', '**/src/androidTest/**']

empty-blocks:
  EmptyFunctionBlock:
    # No-op Android listener overrides (LocationListener) and neutralized test seams.
    ignoreOverridden: true

exceptions:
  # Catch-log-classify at the boundary is the house pattern: the Bluetooth and SQLite
  # layers catch RuntimeException, log via OBDLog/SessionRecorder, classify failures
  # (ConnectionFailureClassifier), and keep the drive session alive instead of crashing.
  InstanceOfCheckForException:
    active: false
  SwallowedException:
    active: false
  TooGenericExceptionCaught:
    active: false
  TooGenericExceptionThrown:
    active: false

performance:
  SpreadOperator:
    # Structured key=value log forwarding (OBDLog/SessionRecorder varargs).
    active: false

style:
  # Protocol byte offsets, PID scaling factors, and SQL schema literals make a blanket
  # magic-number rule pure noise in this domain; named constants are still used where
  # a value's meaning isn't local (see ObdProbes, EnhancedPidProfiles).
  MagicNumber:
    active: false
  # ktlint (Spotless) owns formatting, including line length.
  MaxLineLength:
    active: false
  # Early-return guard clauses are the house style (ObdPollingEngine, VoltBridge).
  LoopWithTooManyJumpStatements:
    active: false
  ReturnCount:
    active: false
  # Multi-throw guard sequences in the staged-restore and wake-nudge paths are clearer
  # than collapsing them; the catch-side classification is what's load-bearing here.
  ThrowsCount:
    active: false
  # Explicit IllegalArgumentException/IllegalStateException with formatted messages is
  # preferred over require()/check() for the SQL-identifier and lifecycle guards.
  UseCheckOrError:
    active: false
  UseRequire:
    active: false
