plugins {
    id "com.android.application"
}

apply plugin: "com.diffplug.spotless"

spotless {
    java {
        target "src/main/java/**/*.java", "src/test/java/**/*.java"
        googleJavaFormat("1.28.0").aosp()
        removeUnusedImports()
        trimTrailingWhitespace()
        endWithNewline()
    }
    format "dashboard", {
        target "src/main/assets/dashboard/**/*.{js,css,html}",
               "src/main/dashboard-src/**/*.html"
        targetExclude "src/main/assets/dashboard/lib/**", "src/main/assets/dashboard/index.html"
        prettier("3.8.3")
        trimTrailingWhitespace()
        endWithNewline()
    }
}

// Version derivation — see /VERSION and /pyproject.toml at repo root.
//
// versionName is the released semver from VERSION + a short commit SHA so the
// in-app About string ("0.1.0-9bda397") tells you exactly which build you're
// running. python-semantic-release rewrites VERSION on every bumpable PR
// merge — see .github/workflows/release.yml.
//
// versionCode comes from GITHUB_RUN_NUMBER on CI so the Play-style integer
// version is monotonic per workflow. Local dev builds fall back to 1, which
// is fine for fresh installs; Android may reject installing them over newer
// release artifacts unless you explicitly allow downgrades and the signatures
// match.
def repoVersionFile = file("$rootDir/../../VERSION")
def repoVersionName = repoVersionFile.exists() ? repoVersionFile.text.trim() : "0.0.0"
def repoVersionSuffix = (System.getenv("GITHUB_SHA")?.take(7)) ?: "dev"
def repoVersionCode = (System.getenv("GITHUB_RUN_NUMBER") ?: "1").toInteger()

android {
    namespace = "com.volttracker.obdpoc"
    compileSdk = 36

    defaultConfig {
        applicationId = "com.volttracker.obdpoc"
        minSdk = 23
        targetSdk = 36
        versionCode = repoVersionCode
        versionName = "${repoVersionName}-${repoVersionSuffix}"
    }

    // Release signing activates only when mobile/android/keystore.properties exists
    // (gitignored). Without it, release builds are produced unsigned.
    signingConfigs {
        release {
            def keystoreProps = rootProject.file("keystore.properties")
            if (keystoreProps.exists()) {
                def props = new Properties()
                keystoreProps.withInputStream { props.load(it) }
                ["storeFile", "storePassword", "keyAlias", "keyPassword"].each { key ->
                    if (!props.getProperty(key)?.trim()) {
                        throw new GradleException("keystore.properties is missing '" + key + "'")
                    }
                }
                def keystore = file(props.getProperty("storeFile"))
                if (!keystore.exists()) {
                    throw new GradleException("keystore.properties storeFile not found: " + keystore)
                }
                storeFile = keystore
                storePassword = props.getProperty("storePassword")
                keyAlias = props.getProperty("keyAlias")
                keyPassword = props.getProperty("keyPassword")
            }
        }
    }

    buildTypes {
        debug {
            // Release-produced debug APKs should be debuggable *and* signed by the
            // stable app key when CI has signing secrets. Otherwise every tagged
            // debug APK gets Android's throwaway runner debug key and cannot update
            // the previous debug/release install.
            if (rootProject.file("keystore.properties").exists()) {
                signingConfig = signingConfigs.release
            }
        }
        release {
            minifyEnabled = true
            proguardFiles getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro"
            if (rootProject.file("keystore.properties").exists()) {
                signingConfig = signingConfigs.release
            }
        }
    }

    buildFeatures {
        buildConfig = true
    }

    testOptions {
        unitTests {
            returnDefaultValues = true
            includeAndroidResources = true
        }
        unitTests.all {
            jacoco.includeNoLocationClasses = true
            jacoco.excludes = ["jdk.*", "jdk.internal.*", "sun.*"]
            jvmArgs += ["--enable-native-access=ALL-UNNAMED"]
        }
    }

    lint {
        abortOnError = true
        warningsAsErrors = true
        checkDependencies = true
        disable += ["GradleDependency"]
        htmlReport = true
        xmlReport = true
    }
}

apply from: "jacoco.gradle"

dependencies {
    implementation libs.androidx.activity
    // FileProvider, for handing the data-backup file to the Android share sheet.
    implementation libs.androidx.core
    testImplementation libs.junit
    // Real org.json implementation; the android.jar stub returns no-op defaults in unit tests.
    testImplementation libs.json
    // Robolectric runs the real Android SQLite layer on the JVM for ObdLocalStore tests.
    testImplementation libs.robolectric
}

// Dependency locking — enabled so CI can emit a Gradle lockfile that OSV-Scanner
// can parse (the F1 gradle-dependency-audit job runs `:app:dependencies
// --write-locks`). No lockfile is committed (app/gradle.lockfile is gitignored),
// so locking imposes NO version enforcement on normal builds: Gradle only verifies
// against a lockfile when one is present. The scan regenerates it fresh each run.
dependencyLocking {
    lockAllConfigurations()
}

// Assembles the shipped dashboard index.html from the per-screen partials in
// src/main/dashboard-src/. Edit the small partials; never hand-edit the generated file.
tasks.register("generateDashboardHtml") {
    description = "Assembles assets/dashboard/index.html from dashboard-src partials."
    def srcDir = file("src/main/dashboard-src")
    def outFile = file("src/main/assets/dashboard/index.html")
    inputs.dir(srcDir)
    outputs.file(outFile)
    doLast {
        def sb = new StringBuilder()
        new File(srcDir, "index.template.html").eachLine("UTF-8") { line ->
            def m = (line =~ /^\s*<!-- include: (\S+) -->\s*$/)
            if (m.find()) {
                sb.append(new File(srcDir, m.group(1)).getText("UTF-8").replaceAll(/\s+$/, ""))
            } else {
                sb.append(line)
            }
            sb.append("\n")
        }
        outFile.setText(sb.toString().replaceAll(/\n+$/, "") + "\n", "UTF-8")
    }
}

tasks.named("generateDashboardHtml") {
    mustRunAfter(rootProject.tasks.named("verifyGeneratedDashboardClean"))
}

tasks.named("preBuild") {
    dependsOn("generateDashboardHtml")
}
