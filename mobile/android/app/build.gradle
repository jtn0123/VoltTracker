import com.volttracker.build.DashboardHtmlAssembler

plugins {
    // Kotlin is the language for Android production code. AGP 9.0+ has built-in Kotlin
    // support enabled by default, so no separate Kotlin plugin is applied. See CONTRIBUTING.md.
    id "com.android.application"
}

apply plugin: "com.diffplug.spotless"
apply plugin: "org.gradle.test-retry"
apply plugin: "io.gitlab.arturbosch.detekt"

// Static analysis (complexity, smells, bug patterns) — complements ktlint, which is
// formatting-only. Thresholds/exclusions live in app/detekt.yml; CI gates on :app:detekt.
detekt {
    buildUponDefaultConfig = true
    config.setFrom(files("detekt.yml"))
    source.setFrom(files("src/main/kotlin", "src/test/java"))
}

// Pin detekt's bytecode target to 21, matching the Gradle java toolchain below (and the JDK CI
// runs on). detekt 1.23.x otherwise derives --jvm-target from the JDK that launched Gradle, and
// its max supported value is 21 — so a contributor whose default JDK is newer than 21 hit a hard
// "Invalid value (24) passed to --jvm-target" failure on `:app:detekt`. Pinning it (paired with
// the toolchain + foojay resolver) makes the local detekt loop JDK-launcher-independent. JDK 21 is
// also the highest Java release this detekt line understands, so this is the correct ceiling.
tasks.withType(io.gitlab.arturbosch.detekt.Detekt).configureEach {
    jvmTarget = "21"
}

spotless {
    java {
        target "src/main/java/**/*.java", "src/test/java/**/*.java"
        googleJavaFormat("1.28.0").aosp()
        removeUnusedImports()
        trimTrailingWhitespace()
        endWithNewline()
    }
    kotlin {
        // Android production code lives in src/main/kotlin. ktlint enforces the official Kotlin
        // style so the spotlessCheck CI gate covers Kotlin the same way it covers Java tests and
        // the dashboard TypeScript. Tests live under src/test/java by repo convention, but the
        // glob covers the whole src/test tree so a Kotlin test can never land unformatted just
        // because it sits in a different source root. (detekt also analyses the test tree — see
        // source.setFrom above; only its complexity rules exclude tests, documented in detekt.yml.)
        target "src/main/kotlin/**/*.kt", "src/test/**/*.kt"
        ktlint("1.5.0")
        trimTrailingWhitespace()
        endWithNewline()
    }
    format "dashboard", {
        // Only the HTML partials/template. (Spotless globs don't expand `{a,b}` braces, so the
        // historical `assets/dashboard/**/*.{js,css,html}` target only ever matched nothing — the
        // dashboard source/CSS were never Spotless-formatted, just ESLint-linted + authored. The
        // TypeScript lives in dashboard-src/js and assets/dashboard/js is the built, minified
        // bundle — neither should be prettier-reformatted here.)
        target "src/main/dashboard-src/**/*.html"
        prettier("3.8.3")
        trimTrailingWhitespace()
        endWithNewline()
    }
}

// Version derivation — see /VERSION and /pyproject.toml at repo root.
//
// versionName is the released semver from VERSION + a short commit SHA so the
// in-app About string ("0.1.0-9bda397") tells you exactly which build you're
// running. python-semantic-release rewrites VERSION on every bumpable PR
// merge — see .github/workflows/release.yml.
//
// versionCode is derived from VERSION so every workflow rebuilding the same tag
// produces the same install identity. The previous workflow-local run number
// changed between release.yml and release-asset repair runs.
def repoVersionFile = file("$rootDir/../../VERSION")
def repoVersionName = repoVersionFile.exists() ? repoVersionFile.text.trim() : "0.0.0"
def repoVersionSuffix = (System.getenv("GITHUB_SHA")?.take(7)) ?: "dev"
def repoVersionParts = repoVersionName.split("\\.")
if (repoVersionParts.length != 3 || !repoVersionParts.every { it ==~ /\d+/ }) {
    throw new GradleException("VERSION must be numeric major.minor.patch; found '${repoVersionName}'")
}
def repoVersionNumbers = repoVersionParts.collect { it.toInteger() }
if (repoVersionNumbers[1] > 999 || repoVersionNumbers[2] > 999) {
    throw new GradleException("VERSION minor and patch must each fit in 0..999")
}
def repoVersionCode =
        Math.addExact(
                Math.addExact(Math.multiplyExact(repoVersionNumbers[0], 1_000_000), repoVersionNumbers[1] * 1_000),
                repoVersionNumbers[2])
def benchmarkDebugTarget =
        (findProperty("voltTrackerBenchmarkDebug")?.toString()?.toBoolean() ?: false) ||
                gradle.startParameter.taskNames.any {
                    it == "verifyStartupPerformance" ||
                            it.contains("startup-benchmark") ||
                            it.contains("connectedDebugAndroidTest")
                }

android {
    namespace = "com.volttracker.obdpoc"
    compileSdk = 37

    defaultConfig {
        applicationId = "com.volttracker.obdpoc"
        minSdk = 23
        targetSdk = 37
        versionCode = repoVersionCode
        versionName = "${repoVersionName}-${repoVersionSuffix}"
        testInstrumentationRunner = "androidx.test.runner.AndroidJUnitRunner"
    }

    // Release signing activates only when mobile/android/keystore.properties exists
    // (gitignored). Local release builds without it are unsigned; tagged CI releases fail
    // before assemble if the signing secrets are missing.
    signingConfigs {
        release {
            def keystoreProps = rootProject.file("keystore.properties")
            if (keystoreProps.exists()) {
                def props = new Properties()
                keystoreProps.withInputStream { props.load(it) }
                ["storeFile", "storePassword", "keyAlias", "keyPassword"].each { key ->
                    if (!props.getProperty(key)?.trim()) {
                        throw new GradleException("keystore.properties is missing '" + key + "'")
                    }
                }
                def keystore = file(props.getProperty("storeFile"))
                if (!keystore.exists()) {
                    throw new GradleException("keystore.properties storeFile not found: " + keystore)
                }
                storeFile = keystore
                storePassword = props.getProperty("storePassword")
                keyAlias = props.getProperty("keyAlias")
                keyPassword = props.getProperty("keyPassword")
            }
        }
    }

    buildTypes {
        debug {
            // Release-produced debug APKs should be debuggable *and* signed by the
            // stable app key when CI has signing secrets. Otherwise every tagged
            // debug APK gets Android's throwaway runner debug key and cannot update
            // the previous debug/release install.
            if (rootProject.file("keystore.properties").exists()) {
                signingConfig = signingConfigs.release
            }
            if (benchmarkDebugTarget) {
                debuggable = false
                profileable = true
            }
        }
        release {
            minifyEnabled = true
            // Strip resources unreferenced after R8 code shrinking (keep.xml not needed:
            // the dashboard ships as assets/, which resource shrinking never touches).
            shrinkResources = true
            proguardFiles getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro"
            if (rootProject.file("keystore.properties").exists()) {
                signingConfig = signingConfigs.release
            }
        }
    }

    // Java 17 source/target. AGP's built-in Kotlin defaults its jvmTarget to targetCompatibility,
    // so this single setting keeps the Java and Kotlin bytecode targets in lockstep (a mismatch
    // would fail the build). minSdk 23 language features are handled by AGP desugaring. Previously
    // unset (AGP default) — pinned now that Kotlin is part of the toolchain.
    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }

    buildFeatures {
        buildConfig = true
    }

    testOptions {
        unitTests {
            returnDefaultValues = true
            includeAndroidResources = true
        }
        unitTests.all {
            jacoco.includeNoLocationClasses = true
            jacoco.excludes = ["jdk.*", "jdk.internal.*", "sun.*"]
            jvmArgs += ["--enable-native-access=ALL-UNNAMED"]
            if (rootProject.hasProperty("voltTrackerRealDbPath")) {
                systemProperty "volttracker.realDbPath", rootProject.property("voltTrackerRealDbPath")
            }
            retry {
                // One retry absorbs pure infra flake (emulator-less CI runners hiccuping on
                // Robolectric/SQLite I/O) so it can't fail the job. failOnPassedAfterRetry
                // stays false ON PURPOSE, but pass-on-retry is NOT silent: each retry is a
                // separate <testcase> in the JUnit XML, and the "Summarize unit test results"
                // step in .github/workflows/android.yml lists every test that passed only on
                // retry and emits a ::warning per flake. Investigate those instead of letting
                // them accumulate.
                maxRetries = 1
                failOnPassedAfterRetry = false
            }
        }
    }

    lint {
        abortOnError = true
        warningsAsErrors = true
        checkDependencies = true
        // "A newer version is available" advisories — informational only, and with
        // warningsAsErrors they fail the build the moment Google ships a newer AGP
        // or dependency, independent of our code. GradleDependency covers libraries;
        // AndroidGradlePluginVersion covers AGP itself. We bump deliberately via the
        // version catalog, so neither should abort a release preflight.
        disable += ["GradleDependency", "AndroidGradlePluginVersion"]
        htmlReport = true
        xmlReport = true
    }
}

// Pin the build to JDK 21 so every JVM-launched task (compile, detekt, tests) runs on a fixed
// toolchain regardless of which JDK started Gradle. Without this the build inherited the launcher
// JDK, and detekt — whose max --jvm-target is 21 — failed hard on a machine whose default JDK was
// newer than 21 ("Invalid value (24) passed to --jvm-target"), forcing contributors to
// `export JAVA_HOME=…21` by hand (the gotcha CLAUDE.md/MEMORY documented). The foojay-resolver
// plugin in settings.gradle lets Gradle discover an installed JDK 21 (or provision one when
// downloads are allowed). The `compileOptions` block above still pins the *bytecode* level to
// Java 17 (minSdk-compatible); this only fixes the JDK that runs the toolchain. AGP's built-in
// Kotlin inherits this toolchain, so Kotlin compiles on the same JDK 21 — no separate
// kotlin { jvmToolchain } block is needed.
java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

apply from: "jacoco.gradle"

dependencies {
    implementation libs.androidx.activity
    // FileProvider, for handing the data-backup file to the Android share sheet.
    implementation libs.androidx.core
    // Installs the packaged baseline profile (src/main/baseline-prof.txt) on devices that
    // don't get Play-delivered compilation, so the profiled startup path is AOT-compiled.
    implementation libs.androidx.profileinstaller
    testImplementation libs.junit
    // Real org.json implementation; the android.jar stub returns no-op defaults in unit tests.
    testImplementation libs.json
    // Robolectric runs the real Android SQLite layer on the JVM for ObdLocalStore tests.
    testImplementation libs.robolectric
    // Instrumented smoke (src/androidTest): launches MainActivity on the emulator and waits
    // for the dashboard JS handshake. Run by the emulator-smoke CI job, not the JVM suite.
    androidTestImplementation libs.androidx.test.core
    androidTestImplementation libs.androidx.test.junit
    androidTestImplementation libs.androidx.test.runner
}

// Dependency locking — only the shipped release runtime classpath is locked against
// the committed app/gradle.lockfile (un-ignored in mobile/android/.gitignore). That is
// the dependency surface that actually ships in the release APK and the exact scope the
// OSV-Scanner gradle-dependency-audit job reads directly, so the security scan is
// reproducible and version-pinned.
//
// We deliberately do NOT lock all configurations: AGP's Unified Test Platform
// orchestration configs (unified-test-platform-*) drag in transitive Netty that runs
// only on the build/test host and is never bundled in the release APK. Locking those
// would flood the OSV scan with advisories for code that does not ship.
//
// Regenerate after a release-dependency change with:
//   ./gradlew :app:dependencies --configuration releaseRuntimeClasspath --write-locks
// and commit app/gradle.lockfile.
configurations.configureEach {
    if (name == "releaseRuntimeClasspath") {
        resolutionStrategy.activateDependencyLocking()
    }
}

// Assembles the shipped dashboard index.html from the per-screen partials in
// src/main/dashboard-src/. Edit the small partials; never hand-edit the generated file.
tasks.register("generateDashboardHtml") {
    description = "Assembles assets/dashboard/index.html from dashboard-src partials."
    def srcDir = file("src/main/dashboard-src")
    def outFile = file("src/main/assets/dashboard/index.html")
    inputs.dir(srcDir)
    outputs.file(outFile)
    doLast {
        outFile.setText(DashboardHtmlAssembler.assemble(srcDir), "UTF-8")
    }
}

tasks.named("generateDashboardHtml") {
    mustRunAfter(rootProject.tasks.named("verifyGeneratedDashboardClean"))
}

tasks.named("preBuild") {
    dependsOn("generateDashboardHtml")
    // The shipped dashboard JS assets (assets/dashboard/js) are gitignored, built from
    // dashboard-src/js TypeScript by esbuild — build them before the assets get packaged.
    dependsOn(rootProject.tasks.named("buildDashboardJs"))
    // Bootstrap the lefthook git hooks on any local build; a safe no-op when
    // lefthook is not installed (CI runners) — see rootProject installGitHooks.
    dependsOn(rootProject.tasks.named("installGitHooks"))
}
