# Default Robolectric SDK for tests that don't pin one with @Config(sdk = [...]).
#
# Without this, an unpinned Robolectric test runs against the app's targetSdk. When targetSdk was
# bumped to 37 (E3 / platform-default hardening) those tests broke with a DefaultSdkPicker
# IllegalArgumentException, because Robolectric 4.16.1 ships no SDK 37 image. Pinning the default to
# 34 — the SDK every explicitly-pinned test in this module already uses — keeps unpinned tests on a
# Robolectric-supported image regardless of how high targetSdk climbs. Individual tests may still
# override this via @Config(sdk = [...]).
sdk=34
