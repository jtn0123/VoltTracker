<section id="view-settings" class="view" data-view="settings">
  <article class="panel connect-card">
    <div class="connection-head">
      <div>
        <div class="kicker">Connection</div>
        <strong id="adapterSummary">No adapter selected</strong>
        <small id="appStateSummary"
          >Pick a paired OBD adapter to start logging.</small
        >
      </div>
      <button
        id="connectBtn"
        type="button"
        class="primary primary-action settings-primary-action"
      >
        Connect
      </button>
    </div>
    <div class="state-grid" aria-label="Live app state">
      <div><span>Logging</span><strong id="loggingState">idle</strong></div>
      <div><span>GPS</span><strong id="gpsState">waiting</strong></div>
      <div><span>DB</span><strong id="dbState">ready</strong></div>
      <div><span>Source</span><strong id="dataSourceState">real</strong></div>
    </div>
    <div class="control-row" data-demo-hidden="true">
      <select id="deviceSelect">
        <option value="">No paired adapters found</option>
      </select>
      <button id="refreshBtn" type="button" class="settings-refresh-btn">
        Refresh
      </button>
    </div>
    <div
      class="button-grid connection-actions"
      data-demo-hidden="true"
      aria-label="Connection actions"
    >
      <button id="permissionBtn" type="button" class="settings-command">
        <span>Permissions</span>
        <small>Bluetooth + location</small>
      </button>
      <button id="lastBtn" type="button" class="settings-command">
        <span>Reconnect last</span>
        <small>Saved adapter</small>
      </button>
      <button id="scanBtn" type="button" class="scan settings-command">
        <span>Scan</span>
        <small>Codes + live PIDs</small>
      </button>
      <button
        id="tpmsScanBtn"
        type="button"
        data-action="tpmsScan"
        class="settings-command"
      >
        <span>Detail probe</span>
        <small>Targeted signals</small>
      </button>
    </div>
    <p id="statusCopy" class="status-copy" data-demo-hidden="true">
      Pick a paired OBD adapter to start logging.
    </p>
    <div id="demoBanner" class="demo-banner" hidden>
      <span>
        <strong>Demo preview is running</strong>
        <small>Preview data is isolated from real OBD history.</small>
      </span>
      <button id="demoStopBtn" type="button" class="demo-stop">
        Stop demo
      </button>
    </div>
  </article>

  <article id="historyCard" class="panel list-card" hidden>
    <header>
      <span class="kicker">Remembered adapters</span>
      <span id="historyHint" class="status-copy">tap to select</span>
    </header>
    <div id="historyList"></div>
  </article>

  <p
    id="appVersionFooter"
    class="status-copy"
    style="text-align: center; margin-top: 16px; opacity: 0.6"
  >
    Volt Tracker
  </p>
</section>
