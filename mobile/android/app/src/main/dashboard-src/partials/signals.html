<section id="view-signals" class="view" data-view="signals">
  <div class="map-sheet signal-sheet">
    <div class="map-sheet-head">
      <div>
        <span class="kicker">Enhanced discovery</span>
        <h2>Signals workspace</h2>
      </div>
      <span class="badge" data-state="scanning">
        <span class="dot"></span><span>catalog</span>
      </span>
    </div>
  </div>

  <article id="enhancedCard" class="panel list-card signal-console">
    <header class="signal-console-head">
      <div>
        <span class="kicker">Detailed signals</span>
        <h3 id="enhancedTitle">No detailed signal results yet</h3>
      </div>
      <span id="enhancedBadge" class="status-copy">ready</span>
    </header>

    <div class="signal-stage-panel">
      <div>
        <span class="kicker">Probe mode</span>
        <strong id="signalStageLabel">Tires</strong>
        <small id="signalStageHint">
          Narrow tire receiver candidates; avoids DTC and freeze-frame reads.
        </small>
      </div>
      <div
        id="signalStageBar"
        class="map-layer-tabs signal-stage-tabs"
        role="group"
        aria-label="Detail Probe mode"
      >
        <button type="button" data-signal-stage="passive">
          <span>Passive</span>
        </button>
        <button type="button" data-signal-stage="low-risk">
          <span>Low-risk</span>
        </button>
        <button type="button" data-signal-stage="tires" class="is-active">
          <span>Tires</span>
        </button>
        <button type="button" data-signal-stage="experimental">
          <span>Experimental</span>
        </button>
      </div>
      <div class="signal-stage-actions">
        <button
          id="detailProbeBtn"
          type="button"
          class="primary-action"
          data-action="detailProbe"
        >
          Run probe
        </button>
        <button id="exportSignalLogsBtn" type="button" class="link-btn">
          export logs
        </button>
      </div>
    </div>

    <div class="status-meta signal-kpis">
      <div>
        <span>Working</span><strong id="enhancedConfirmedCount">0</strong>
      </div>
      <div>
        <span>No hit</span><strong id="enhancedRejectedCount">0</strong>
      </div>
      <div>
        <span>Candidate</span><strong id="enhancedCandidateCount">0</strong>
      </div>
      <div>
        <span>Deferred</span><strong id="enhancedDeferredCount">0</strong>
      </div>
    </div>

    <div
      id="enhancedFilterBar"
      class="map-layer-tabs signal-filter-tabs"
      role="group"
      aria-label="Detailed signal filters"
    >
      <button type="button" data-signal-filter="all" class="is-active">
        <span>All</span><b id="enhancedAllCount">0</b>
      </button>
      <button type="button" data-signal-filter="confirmed">
        <span>Working</span><b id="enhancedWorkingTabCount">0</b>
      </button>
      <button type="button" data-signal-filter="candidate">
        <span>Candidate</span><b id="enhancedCandidateTabCount">0</b>
      </button>
      <button type="button" data-signal-filter="rejected">
        <span>No hit</span><b id="enhancedRejectedTabCount">0</b>
      </button>
      <button type="button" data-signal-filter="deferred">
        <span>Deferred</span><b id="enhancedDeferredTabCount">0</b>
      </button>
      <button type="button" data-signal-filter="tpms">
        <span>Tires</span><b id="enhancedTiresTabCount">0</b>
      </button>
    </div>

    <div id="enhancedNextList" class="enhanced-next-list"></div>
    <div id="enhancedCapabilityList" class="enhanced-capability-list"></div>
  </article>
</section>
