<div
  id="restoreProgress"
  class="restore-progress"
  role="alertdialog"
  aria-modal="true"
  aria-labelledby="restoreProgressTitle"
  aria-describedby="restoreProgressDetail restoreProgressStats restoreProgressNote"
  tabindex="-1"
  hidden
>
  <div class="restore-progress-backdrop"></div>
  <section class="restore-progress-card" role="document">
    <header class="restore-progress-head">
      <div>
        <span id="restoreProgressKicker" class="restore-progress-kicker"
          >Backup and restore</span
        >
        <h2 id="restoreProgressTitle" class="restore-progress-title">
          Preparing restore
        </h2>
      </div>
      <button
        type="button"
        id="restoreProgressClose"
        class="restore-progress-close"
        aria-label="Close restore status"
        hidden
      >
        ×
      </button>
    </header>
    <div
      id="restoreProgressMeter"
      class="restore-progress-meter"
      role="progressbar"
      aria-valuemin="0"
      aria-valuemax="100"
      aria-label="Backup and restore progress"
    >
      <span id="restoreProgressFill"></span>
    </div>
    <div class="restore-progress-meta">
      <span id="restoreProgressPhase">Preparing</span>
      <span id="restoreProgressPercent">--</span>
      <span id="restoreProgressEta">ETA calculating</span>
    </div>
    <p id="restoreProgressDetail" class="restore-progress-detail">
      Checking the selected backup file.
    </p>
    <p id="restoreProgressStats" class="restore-progress-stats">
      Preparing work.
    </p>
    <p id="restoreProgressNote" class="restore-progress-note">
      Keep Volt Tracker open until this finishes.
    </p>
  </section>
</div>
