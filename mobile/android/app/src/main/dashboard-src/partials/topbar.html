<header class="topbar">
  <div class="top-main">
    <div class="screen-heading">
      <span class="drive-title-mark" aria-hidden="true">
        <svg viewBox="0 0 24 24" focusable="false">
          <path id="screenTitleIcon" d="M13 2 5 13h6l-1 9 9-13h-6z" />
        </svg>
      </span>
      <div>
        <div id="screenKicker" class="kicker">Volt Tracker Android</div>
        <h1 id="screenTitle">Drive</h1>
      </div>
    </div>
    <!--
      Right-side status cluster: the quiet last-connected line and the state
      badge share the title row so the header stays a single slim strip.
      Both are tap targets for the same status popover — connection-status.ts
      owns the toggle, the popover contents, and hiding the last-connected
      line until there is a real session row to show. The badge's color always
      encodes connection state (never the tab accent).
    -->
    <div class="top-status">
      <!--
        Demo / Testing header line: while a demo runs, this replaces the
        last-connected line (drive.ts#renderTopDemoInfo shows it and keeps the
        live sample/SOC meta fresh; connection-status.ts hides the adapter
        line). One header slot, one truth — the old separate Drive now-chip
        duplicated the purple "demo" pill right below it.
      -->
      <button
        id="topDemoInfo"
        type="button"
        class="connection-status__line top-demo-info"
        hidden
        aria-haspopup="dialog"
        aria-expanded="false"
        aria-controls="statusPopover"
        aria-label="Demo / Testing is running. Tap for status details"
      >
        <span class="connection-status__line-dot" aria-hidden="true"></span>
        <strong>Demo / Testing</strong>
        <small id="topDemoMeta">sample data</small>
      </button>
      <button
        id="lastConnectedBadge"
        type="button"
        class="connection-status__line"
        data-state="unknown"
        hidden
        aria-haspopup="dialog"
        aria-expanded="false"
        aria-controls="statusPopover"
        aria-label="Last connection. Tap for status details"
      >
        <span class="connection-status__line-dot" aria-hidden="true"></span>
        <strong id="lastConnectedLabel">--</strong>
        <small id="lastConnectedAt">--</small>
      </button>
      <button
        id="stateBadge"
        type="button"
        class="badge"
        data-state="idle"
        aria-haspopup="dialog"
        aria-expanded="false"
        aria-controls="statusPopover"
      >
        <span class="visually-hidden">Connection status: </span
        ><span class="dot"></span><span id="stateText">idle</span>
      </button>
    </div>
  </div>
  <!--
    Status popover: tap target is the state badge (and the last-connected line).
    Static shell only — connection-status.ts fills the state pill, detail copy,
    and the connection/trip rows on every open and live update.
  -->
  <div
    id="statusPopover"
    class="status-popover"
    role="dialog"
    aria-labelledby="statusPopoverTitle"
    tabindex="-1"
    hidden
  >
    <div class="status-popover__head">
      <h2 id="statusPopoverTitle" class="status-popover__title">Connection</h2>
      <span
        id="statusPopoverState"
        class="badge status-popover__state"
        data-state="idle"
      >
        <span class="dot"></span><span id="statusPopoverStateText">idle</span>
      </span>
    </div>
    <p id="statusPopoverDetail" class="status-popover__detail">Ready.</p>
    <dl id="statusPopoverConnection" class="status-popover__rows"></dl>
    <h3 class="status-popover__section">Trip</h3>
    <dl id="statusPopoverTrip" class="status-popover__rows"></dl>
  </div>
</header>
