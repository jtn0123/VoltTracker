sonar.projectKey=jtn0123_VoltTracker
sonar.organization=jtn0123ismysonar

sonar.sources=receiver
sonar.tests=tests,receiver/frontend/src/__tests__,e2e
sonar.exclusions=**/node_modules/**,**/dist/**,**/.venv/**,**/venv/**,**/__pycache__/**,receiver/frontend/src/__tests__/**
sonar.python.version=3.10,3.11,3.12,3.13
sonar.python.coverage.reportPaths=coverage.xml
sonar.javascript.lcov.reportPaths=receiver/frontend/coverage/lcov.info,e2e/coverage/lcov.info

# receiver/static/js/**: legacy static JS served directly by Flask templates
# (map_view.js, charts etc.). Not bundled by vite, not covered by vitest
# (which targets receiver/frontend/src/), and e2e instrumented coverage is
# only hooked up for local runs — see the comment block in the sonarcloud
# job in .github/workflows/test.yml. Excluding from coverage measurement
# until automated tests exist for this directory. Mirrors the InkyPi
# repo's `src/static/scripts/**` exclusion.
sonar.coverage.exclusions=receiver/static/js/**
