sonar.projectKey=jtn0123_VoltTracker
sonar.organization=jtn0123ismysonar

sonar.sources=receiver
sonar.tests=tests,receiver/frontend/src/__tests__,e2e
sonar.exclusions=**/node_modules/**,**/dist/**,**/.venv/**,**/venv/**,**/__pycache__/**,receiver/frontend/src/__tests__/**
sonar.python.version=3.10,3.11,3.12,3.13
sonar.python.coverage.reportPaths=coverage.xml
sonar.javascript.lcov.reportPaths=receiver/frontend/coverage/lcov.info,e2e/coverage/lcov.info

# Coverage exclusions — files that are real production code but lack
# automated test coverage in CI today. Each entry is intentional and
# should be removed once tests catch up.
#
# - receiver/static/js/**: legacy static JS served directly by Flask
#   templates (map_view.js, charts, etc.). Not bundled by vite, not
#   covered by vitest (which targets receiver/frontend/src/), and e2e
#   instrumented coverage is only hooked up for local runs — see the
#   comment block in the sonarcloud job in .github/workflows/test.yml.
#   Mirrors the InkyPi repo's src/static/scripts/** exclusion.
#
# - receiver/migrations_alembic/**: schema migration scripts. These run
#   via `alembic upgrade head` at container start and have integration-
#   level coverage from the test-postgres CI job (which exercises every
#   migrated table). They are not unit-testable in any meaningful way.
#
# - receiver/frontend/src/{import,charging,map,summary,main,charts}.ts:
#   the test files that exist under src/__tests__/ cover battery, core,
#   live, trips, schemas, store, fetchJson, and api. These six modules
#   have no vitest test files yet — adding them is tracked as a follow-
#   up to PR #45 so the cognitive-complexity refactor can land first
#   without doubling the size of the diff. TODO: write src/__tests__/
#   {import,charging,map,summary,main,charts}.test.ts and remove this
#   exclusion.
sonar.coverage.exclusions=receiver/static/js/**,receiver/migrations_alembic/**,receiver/frontend/src/import.ts,receiver/frontend/src/charging.ts,receiver/frontend/src/map.ts,receiver/frontend/src/summary.ts,receiver/frontend/src/main.ts,receiver/frontend/src/charts.ts
