# Install: brew install lefthook — any `./gradlew` Android build then bootstraps
# the hooks automatically (:app:preBuild -> installGitHooks runs `lefthook
# install` when lefthook is on PATH; safe no-op otherwise, e.g. in CI).
# Manual install: lefthook install
# Run manually: lefthook run pre-commit

pre-commit:
  parallel: true
  commands:
    spotless-java:
      glob: "mobile/android/app/src/**/*.java"
      run: cd mobile/android && ./gradlew --no-daemon :app:spotlessJavaCheck
      stage_fixed: false
    # I1 (2026-07-12): Kotlin is the primary production language; without this hook a ktlint
    # violation rode ~8 min to CI while Java (legacy tests only) was checked locally.
    spotless-kotlin:
      glob: "mobile/android/app/src/**/*.kt"
      run: cd mobile/android && ./gradlew --no-daemon :app:spotlessKotlinCheck
      stage_fixed: false
    spotless-dashboard:
      glob: "mobile/android/app/src/main/{assets/dashboard,dashboard-src}/**/*.{js,css,html}"
      run: cd mobile/android && ./gradlew --no-daemon :app:spotlessDashboardCheck
      stage_fixed: false
    generate-dashboard-html:
      glob: "mobile/android/app/src/main/dashboard-src/{index.template.html,partials/**/*.html}"
      run: |
        cd mobile/android
        ./gradlew --no-daemon generateDashboardHtml
        git add app/src/main/assets/dashboard/index.html
      stage_fixed: true
    # I1: catch undefined globals, redeclared names, and unreachable code locally before
    # they ride to CI. Spotless handles formatting; this catches semantic issues Spotless
    # can't see. Skipped if dashboard-tests/node_modules is missing so first-time clones
    # bootstrap themselves before the lint run.
    lint-dashboard-js:
      # The editable source ESLint lints is the TypeScript under dashboard-src/js; the old glob
      # pointed at the gitignored esbuild bundle (assets/dashboard/js), so no staged file ever
      # matched and this hook never ran locally.
      glob: "mobile/android/app/src/main/dashboard-src/js/**/*.ts"
      run: |
        if [ ! -d mobile/android/dashboard-tests/node_modules ]; then
          echo "dashboard test dependencies missing; running npm ci once"
          npm --prefix mobile/android/dashboard-tests ci
        fi
        npm --prefix mobile/android/dashboard-tests run lint
      stage_fixed: false
    actionlint-workflows:
      glob: ".github/workflows/**/*.{yml,yaml}"
      run: |
        if command -v actionlint >/dev/null 2>&1; then
          actionlint -config-file .github/actionlint.yaml {staged_files}
        else
          echo "warning: skipping actionlint because it is not installed"
          echo "run 'brew install actionlint' to enable local workflow lint"
        fi
      stage_fixed: false

# Pre-push gate: run the fast test suites locally so a broken push is caught in
# ~30-60s instead of ~8min later in CI. Opt-in (only fires after `lefthook
# install`). Escape hatch for emergencies: `git push --no-verify`.
pre-push:
  parallel: true
  commands:
    unit-tests:
      run: cd mobile/android && ./gradlew --no-daemon :app:testDebugUnitTest
    # I2 (2026-07-12): detekt ratchets and tsc are zero-tolerance CI gates; running them here
    # (~30-60s combined) keeps a ratchet trip or type error from riding ~8 min to CI.
    detekt:
      run: cd mobile/android && ./gradlew --no-daemon :app:detekt
    dashboard-typecheck:
      run: |
        if [ ! -d mobile/android/dashboard-tests/node_modules ]; then
          npm --prefix mobile/android/dashboard-tests ci
        fi
        npm --prefix mobile/android/dashboard-tests run typecheck
    dashboard-tests:
      run: |
        if [ ! -d mobile/android/dashboard-tests/node_modules ]; then
          npm --prefix mobile/android/dashboard-tests ci
        fi
        npm --prefix mobile/android/dashboard-tests test
